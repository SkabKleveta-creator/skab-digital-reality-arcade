name: Neon Shinobi regression checks
on:
  push:
    paths: ['games/neon-shinobi/**', '.github/workflows/neon-shinobi.yml']
  pull_request:
    paths: ['games/neon-shinobi/**', '.github/workflows/neon-shinobi.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/neon-shinobi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
