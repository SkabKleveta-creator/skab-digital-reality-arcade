<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Shinobi responsive QA</title><style>body{background:#202636;color:#e8f0ff;font:14px monospace;margin:16px}button{padding:10px;margin:0 6px 12px 0}iframe{display:block;border:1px solid #7985a1;background:#080c18;max-width:none}p{max-width:700px;line-height:1.6}</style><h1>Responsive layout QA</h1><p>Resize the embedded game to review the real interface at common display sizes. This checks layout; it does not emulate touch hardware.</p><button data-size="390,844">Phone portrait</button><button data-size="844,390">Phone landscape</button><button data-size="320,740">Small phone</button><button data-size="1180,900">Desktop</button><p id="size">390 × 844</p><iframe title="Neon Shinobi layout preview" src="../" width="390" height="844"></iframe><script>for(const button of document.querySelectorAll('button'))button.onclick=()=>{const [width,height]=button.dataset.size.split(',');const frame=document.querySelector('iframe');frame.width=width;frame.height=height;document.getElementById('size').textContent=width+' × '+height;};</script></html>
