<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chrome Rebellion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#070a12; --storm:#101a2e; --amber:#f2a541; --asc:#8fe9ff; --alarm:#e23d4b; --bone:#e9eef2;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#070a12; } }
:root[data-theme="dark"]{ --ink:#070a12; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; background:var(--ink); }
body{ margin:0; height:100%; background:var(--ink); overflow:hidden; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; font-family:'Barlow',system-ui,sans-serif; }
#wrap{ position:fixed; top:env(safe-area-inset-top,0px); bottom:env(safe-area-inset-bottom,0px);
  left:env(safe-area-inset-left,0px); right:env(safe-area-inset-right,0px); }
#c{ position:absolute; left:0; top:0; display:block; outline:none; }
#touch{ position:absolute; inset:0; pointer-events:none; display:none; }
#touch.on{ display:block; }
#stickZone{ position:absolute; left:0; bottom:0; width:44%; height:62%; pointer-events:auto; }
#stickBase{ position:absolute; width:128px; height:128px; margin:-64px 0 0 -64px; border-radius:50%;
  border:2px solid rgba(233,238,242,.28); background:radial-gradient(circle,rgba(16,26,46,.35),rgba(16,26,46,.1)); display:none; }
#stickKnob{ position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(242,165,65,.9),rgba(160,90,20,.75)); box-shadow:0 0 0 2px rgba(255,255,255,.18); }
#btns{ position:absolute; right:10px; bottom:12px; width:236px; height:206px; pointer-events:none; }
.tb{ position:absolute; border-radius:50%; pointer-events:auto; display:flex; align-items:center; justify-content:center;
  font:700 13px/1 'Saira Condensed',sans-serif; letter-spacing:.04em; color:#e9eef2;
  background:radial-gradient(circle at 38% 30%,rgba(60,78,108,.78),rgba(14,22,40,.72)); border:2px solid rgba(233,238,242,.3); }
.tb.dn{ background:radial-gradient(circle at 38% 30%,rgba(242,165,65,.95),rgba(150,80,20,.85)); color:#1a0e02; }
.tb.big{ width:74px; height:74px; font-size:15px; }
.tb.mid{ width:58px; height:58px; }
.tb.sp{ border-color:rgba(143,233,255,.7); }
#bL{ right:84px; bottom:4px; } #bH{ right:4px; bottom:44px; } #bJ{ right:160px; bottom:0; }
#bG{ right:96px; bottom:86px; } #bS{ right:14px; bottom:128px; } #bD{ right:170px; bottom:70px; }
#bP{ position:absolute; right:12px; top:10px; width:44px; height:44px; border-radius:10px; pointer-events:auto;
  background:rgba(14,22,40,.6); border:2px solid rgba(233,238,242,.28); color:#e9eef2; font:700 16px 'Saira Condensed'; display:flex; align-items:center; justify-content:center; }
@media (max-height:420px){ #btns{ transform:scale(.86); transform-origin:100% 100%; } }
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" tabindex="0" aria-label="Chrome Rebellion game"></canvas>
<div id="touch">
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div id="btns">
    <div class="tb big" id="bL" data-b="L">LIGHT</div>
    <div class="tb big" id="bH" data-b="H">HEAVY</div>
    <div class="tb mid" id="bJ" data-b="J">JUMP</div>
    <div class="tb mid" id="bG" data-b="G">GRAB</div>
    <div class="tb mid sp" id="bS" data-b="S">SPEC</div>
    <div class="tb mid" id="bD" data-b="D">DODGE</div>
  </div>
  <div id="bP" data-b="P">II</div>
</div>
</div>
<script>
'use strict';
/* ===================== CHROME REBELLION ===================== */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sgn=v=>v<0?-1:1;
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function srand(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
const FONT_D="'Saira Condensed','Arial Narrow',Impact,sans-serif";
const FONT_B="'Barlow','Segoe UI',system-ui,sans-serif";
const COL={amber:'#f2a541',amberD:'#b8741e',asc:'#8fe9ff',ascD:'#3aa6c9',alarm:'#e23d4b',bone:'#e9eef2',storm:'#101a2e',ink:'#070a12',out:'#0a0d14',heal:'#6fe3a5',vio:'#b58cff'};

/* ---------- canvas ---------- */
const wrap=document.getElementById('wrap');
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let VW=960;const VH=540;let SC=1,OX=0,OY=0,DPR=1,CSSW=960,CSSH=540;
const FLOOR=356, ZMAX=150;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(200,wrap.clientWidth),h=Math.max(150,wrap.clientHeight);
  CSSW=w;CSSH=h;
  cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
  cv.style.width=w+'px';cv.style.height=h+'px';
  VW=Math.round(clamp(VH*w/h,720,1180));
  SC=Math.min(cv.width/VW,cv.height/VH);
  OX=(cv.width-VW*SC)/2;OY=(cv.height-VH*SC)/2;
  if(typeof bgInvalidate==='function')bgInvalidate();
}
window.addEventListener('resize',resize);
function toLogical(cx,cy){const r=cv.getBoundingClientRect();return{x:((cx-r.left)*DPR-OX)/SC,y:((cy-r.top)*DPR-OY)/SC};}

/* ---------- save ---------- */
const SAVE_KEY='chrome-rebellion-v1';
let SAVE={unlocked:1,diff:'veteran',music:true,sfx:true,best:0,cleared:false};
function loadSave(){try{const s=localStorage.getItem(SAVE_KEY);if(s){const o=JSON.parse(s);if(o&&typeof o==='object')Object.assign(SAVE,o);}}catch(e){}}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}

/* ---------- input ---------- */
const BTNS=['L','H','J','G','S','D'];
const IN={ax:0,ay:0,held:{},prev:{},buf:{},frame:0,run:false,tapDir:0,tapT:-99,tiltT:0,
  menu:{up:0,down:0,left:0,right:0,ok:0,back:0,pause:0},anyPress:false,device:'kb',mash:0,lastDirSig:''};
const KEY={}; // code -> bool
const KMAP={KeyJ:'L',KeyZ:'L',KeyK:'H',KeyX:'H',Space:'J',KeyC:'J',KeyL:'G',KeyV:'G',KeyI:'S',KeyB:'S',KeyU:'D',ShiftLeft:'D',ShiftRight:'D',KeyN:'D'};
let kbEdge={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(!KEY[e.code])kbEdge[e.code]=true;
  KEY[e.code]=true;IN.device='kb';auInit();
  // double tap run
  if((e.code==='ArrowLeft'||e.code==='KeyA'||e.code==='ArrowRight'||e.code==='KeyD')&&!e.repeat){
    const d=(e.code==='ArrowLeft'||e.code==='KeyA')?-1:1;
    if(IN.tapDir===d&&IN.frame-IN.tapT<16)IN.run=true;
    IN.tapDir=d;IN.tapT=IN.frame;
  }
});
window.addEventListener('keyup',e=>{KEY[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in KEY)KEY[k]=false;TOUCH.btn={};});

/* touch */
const TOUCH={active:false,stickId:null,sx:0,sy:0,dx:0,dy:0,btn:{},edge:{}};
const touchEl=document.getElementById('touch');
function enableTouchUI(){touchEl.classList.add('on');IN.device='touch';}
(function setupTouch(){
  const zone=document.getElementById('stickZone'),base=document.getElementById('stickBase'),knob=document.getElementById('stickKnob');
  zone.addEventListener('pointerdown',e=>{e.preventDefault();auInit();TOUCH.stickId=e.pointerId;const r=zone.getBoundingClientRect();
    TOUCH.sx=e.clientX;TOUCH.sy=e.clientY;base.style.display='block';base.style.left=(e.clientX-r.left)+'px';base.style.top=(e.clientY-r.top)+'px';
    TOUCH.dx=0;TOUCH.dy=0;knob.style.transform='translate(0,0)';try{zone.setPointerCapture(e.pointerId);}catch(_){}});
  zone.addEventListener('pointermove',e=>{if(e.pointerId!==TOUCH.stickId)return;e.preventDefault();
    let dx=e.clientX-TOUCH.sx,dy=e.clientY-TOUCH.sy;const m=Math.hypot(dx,dy),R=52;if(m>R){dx*=R/m;dy*=R/m;}
    TOUCH.dx=dx/R;TOUCH.dy=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`;});
  const end=e=>{if(e.pointerId!==TOUCH.stickId)return;TOUCH.stickId=null;TOUCH.dx=0;TOUCH.dy=0;base.style.display='none';};
  zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);
  document.querySelectorAll('#touch [data-b]').forEach(el=>{
    const b=el.dataset.b;
    el.addEventListener('pointerdown',e=>{e.preventDefault();auInit();TOUCH.btn[b]=true;TOUCH.edge[b]=true;el.classList.add('dn');try{el.setPointerCapture(e.pointerId);}catch(_){}});
    const up=e=>{TOUCH.btn[b]=false;el.classList.remove('dn');};
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
  });
})();
window.addEventListener('touchstart',()=>{if(IN.device!=='touch')enableTouchUI();},{passive:true});
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)enableTouchUI();

/* pointer (menus) */
const PTR={x:-1,y:-1,click:false,down:false};
cv.addEventListener('pointerdown',e=>{auInit();const p=toLogical(e.clientX,e.clientY);PTR.x=p.x;PTR.y=p.y;PTR.click=true;PTR.down=true;cv.focus();});
cv.addEventListener('pointermove',e=>{const p=toLogical(e.clientX,e.clientY);PTR.x=p.x;PTR.y=p.y;PTR.moved=true;});
cv.addEventListener('pointerup',()=>{PTR.down=false;});

/* gamepad */
let padPrev={};
function readPad(){
  const out={ax:0,ay:0,b:{}};
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const p of pads){if(!p)continue;
    const dz=v=>Math.abs(v)<.25?0:v;
    out.ax=dz(p.axes[0]||0);out.ay=dz(p.axes[1]||0);
    const bt=i=>p.buttons[i]&&p.buttons[i].pressed;
    if(bt(14))out.ax=-1;if(bt(15))out.ax=1;if(bt(12))out.ay=-1;if(bt(13))out.ay=1;
    out.b.J=bt(0);out.b.G=bt(1);out.b.L=bt(2);out.b.H=bt(3);out.b.D=bt(4)||bt(6);out.b.S=bt(5)||bt(7);out.b.P=bt(9);out.b.B=bt(8);
    if(Object.values(out.b).some(Boolean)||out.ax||out.ay)IN.device='pad';
    break;}
  return out;
}

function pollInput(){
  IN.frame++;
  const pad=readPad();
  let ax=0,ay=0;
  if(KEY.ArrowLeft||KEY.KeyA)ax-=1;if(KEY.ArrowRight||KEY.KeyD)ax+=1;
  if(KEY.ArrowUp||KEY.KeyW)ay-=1;if(KEY.ArrowDown||KEY.KeyS)ay+=1;
  if(pad.ax||pad.ay){ax=pad.ax;ay=pad.ay;}
  if(TOUCH.stickId!==null){ax=Math.abs(TOUCH.dx)>.22?TOUCH.dx:0;ay=Math.abs(TOUCH.dy)>.3?TOUCH.dy:0;}
  // analog run: sustained strong horizontal tilt
  const analog=(TOUCH.stickId!==null)||pad.ax;
  if(analog){ if(Math.abs(ax)>.88){IN.tiltT++;if(IN.tiltT>14)IN.run=true;} else IN.tiltT=0; }
  if(Math.abs(ax)<.2&&!analog)IN.run=IN.run&&false;
  if(Math.abs(ax)<.2)IN.run=false;
  const m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m;}
  IN.ax=ax;IN.ay=ay;
  IN.prev=IN.held;const h={};
  for(const b of BTNS){h[b]=!!(Object.keys(KMAP).some(k=>KMAP[k]===b&&KEY[k])||TOUCH.btn[b]||pad.b[b]);}
  IN.held=h;IN.anyPress=false;
  const kbe=b=>Object.keys(KMAP).some(k=>KMAP[k]===b&&kbEdge[k]);
  for(const b of BTNS){const edge=(h[b]&&!IN.prev[b])||TOUCH.edge[b]||(kbe(b)&&!IN.prev[b]);if(edge){IN.buf[b]=IN.frame;IN.anyPress=true;IN.mash++;}}
  const dsig=(ax>.5?'r':ax<-.5?'l':'')+(ay>.5?'d':ay<-.5?'u':'');if(dsig&&dsig!==IN.lastDirSig)IN.mash++;IN.lastDirSig=dsig;
  // menu edges
  const M=IN.menu;const pm=IN._pm||{};
  const cur={up:KEY.ArrowUp||KEY.KeyW||ay<-.6,down:KEY.ArrowDown||KEY.KeyS||ay>.6,left:KEY.ArrowLeft||KEY.KeyA||ax<-.6,right:KEY.ArrowRight||KEY.KeyD||ax>.6,
    ok:KEY.Enter||KEY.KeyJ||KEY.Space||KEY.KeyZ||pad.b.J||pad.b.L,back:KEY.Escape||KEY.Backspace||KEY.KeyX||pad.b.G,pause:KEY.Escape||KEY.KeyP||KEY.Enter||pad.b.P||TOUCH.edge.P};
  const KE={up:['ArrowUp','KeyW'],down:['ArrowDown','KeyS'],left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],ok:['Enter','KeyJ','Space','KeyZ'],back:['Escape','Backspace','KeyX'],pause:['Escape','KeyP','Enter']};
  for(const k in cur){M[k]=(cur[k]&&!pm[k])||(!pm[k]&&KE[k].some(c=>kbEdge[c]))?1:0;}
  if(TOUCH.edge.P)M.pause=1;
  IN._pm=cur;TOUCH.edge={};kbEdge={};
}
function pressed(b,win){return IN.frame-(IN.buf[b]||-999)<=(win||8);}
function consume(b){IN.buf[b]=-999;}
/* ===================== AUDIO ===================== */
const AU={ctx:null,master:null,sfxG:null,musG:null,rev:null,revIn:null,noise:null,track:null,step:0,nextT:0,bar:0,fade:1};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  let a;try{a=new C();}catch(e){return;}
  AU.ctx=a;
  const comp=a.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.2;
  AU.master=a.createGain();AU.master.gain.value=.85;AU.master.connect(comp);comp.connect(a.destination);
  AU.sfxG=a.createGain();AU.sfxG.gain.value=SAVE.sfx?.9:0;AU.sfxG.connect(AU.master);
  AU.musG=a.createGain();AU.musG.gain.value=SAVE.music?.42:0;AU.musG.connect(AU.master);
  // reverb
  const len=a.sampleRate*2.4,ir=a.createBuffer(2,len,a.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  AU.rev=a.createConvolver();AU.rev.buffer=ir;const rg=a.createGain();rg.gain.value=.35;AU.rev.connect(rg);rg.connect(AU.master);
  AU.revIn=AU.rev;
  const nb=a.createBuffer(1,a.sampleRate,a.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;AU.noise=nb;
  if(a.state==='suspended')a.resume();
}
function auSetVol(){if(!AU.ctx)return;AU.sfxG.gain.value=SAVE.sfx?.9:0;AU.musG.gain.value=SAVE.music?.42:0;}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function osc(type,f0,f1,t,dur,peak,dest,att){const a=AU.ctx,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);env(g,t,att||.003,peak,dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);return o;}
function nz(t,dur,peak,ftype,f0,f1,q,dest,att){const a=AU.ctx,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=AU.noise;s.loop=true;
  f.type=ftype;f.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q||1;env(g,t,att||.002,peak,dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
let sfxCount=0,sfxWin=0;
function sfx(name,vol){
  if(!AU.ctx||!SAVE.sfx)return;const a=AU.ctx,t=a.currentTime,D=AU.sfxG,R=AU.revIn;vol=vol||1;
  // rate limiting
  const now=performance.now();if(now-sfxWin>50){sfxWin=now;sfxCount=0;}if(++sfxCount>7)return;
  switch(name){
    case 'hitL':nz(t,.07,.5*vol,'bandpass',2200,900,1.2,D);osc('sine',210,70,t,.09,.55*vol,D);break;
    case 'hitH':nz(t,.16,.7*vol,'lowpass',2600,300,.8,D);osc('sine',150,38,t,.22,.9*vol,D);osc('triangle',720,480,t,.12,.18*vol,D);nz(t,.25,.12*vol,'bandpass',900,400,2,R);break;
    case 'metal':for(const f of[523,1187,1693,2411])osc('sine',f*rand(.97,1.03),f*.98,t,.35,.08*vol,D);nz(t,.05,.3*vol,'highpass',3000,3000,1,D);osc('sine',900,1100,t,.4,.05*vol,R);break;
    case 'whoosh':nz(t,.16,.18*vol,'bandpass',500,2400,2.5,D,.03);break;
    case 'whooshH':nz(t,.24,.26*vol,'bandpass',300,1500,2,D,.05);break;
    case 'block':osc('triangle',1500,900,t,.1,.25*vol,D);nz(t,.06,.35*vol,'highpass',2500,2500,1,D);osc('sine',2400,2200,t,.3,.06*vol,R);break;
    case 'parry':osc('sine',1760,1760,t,.6,.3*vol,D);osc('sine',2637,2637,t,.5,.18*vol,D);osc('sine',880,880,t,.7,.2*vol,R);nz(t,.1,.5*vol,'highpass',4000,4000,1,D);osc('sine',180,60,t,.2,.6*vol,D);break;
    case 'elec':{const o=osc('sawtooth',180,90,t,.32,.16*vol,D);const l=a.createOscillator(),lg=a.createGain();l.frequency.value=37;lg.gain.value=90;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+.4);
      nz(t,.3,.22*vol,'bandpass',3500,1800,3,D);break;}
    case 'zap':nz(t,.12,.25*vol,'bandpass',4200,2000,4,D);osc('square',1300,300,t,.1,.06*vol,D);break;
    case 'boom':nz(t,.9,.9*vol,'lowpass',900,90,.7,D);osc('sine',90,28,t,.7,1*vol,D);nz(t,1.2,.25*vol,'lowpass',400,100,.5,R,.02);break;
    case 'glass':for(let i=0;i<6;i++){const tt=t+i*.018;osc('sine',rand(2800,6200),rand(2400,5000),tt,.25,.06*vol,D);}nz(t,.18,.4*vol,'highpass',5000,5000,1,D);break;
    case 'break':nz(t,.2,.55*vol,'lowpass',1400,300,1,D);for(let i=0;i<3;i++)osc('sine',rand(90,160),50,t+i*.03,.1,.35*vol,D);break;
    case 'thud':osc('sine',110,36,t,.25,.9*vol,D);nz(t,.14,.35*vol,'lowpass',700,150,1,D);break;
    case 'pick':osc('sine',660,660,t,.08,.2*vol,D);osc('sine',990,990,t+.06,.12,.2*vol,D);break;
    case 'heal':[523,659,784,1046].forEach((f,i)=>osc('sine',f,f,t+i*.05,.3,.12*vol,R));osc('sine',523,1046,t,.4,.1*vol,D);break;
    case 'charge':osc('sawtooth',120,900,t,.45,.1*vol,D,.2);nz(t,.45,.12*vol,'bandpass',300,3000,3,D,.3);break;
    case 'special':osc('sawtooth',80,40,t,.6,.3*vol,D);nz(t,.5,.5*vol,'lowpass',3000,200,1,D);osc('sine',440,880,t,.4,.12*vol,R);break;
    case 'hurt':osc('sine',260,90,t,.2,.5*vol,D);nz(t,.12,.4*vol,'bandpass',800,400,1.5,D);break;
    case 'down':osc('sine',80,40,t,.25,.8*vol,D);nz(t,.2,.3*vol,'lowpass',500,100,1,D);break;
    case 'warn':osc('sine',988,988,t,.14,.18*vol,D);osc('sine',988,988,t+.2,.14,.18*vol,D);break;
    case 'ui':osc('sine',880,1320,t,.06,.14*vol,D);break;
    case 'uiOk':osc('sine',660,660,t,.08,.16*vol,D);osc('sine',1320,1320,t+.05,.14,.14*vol,R);break;
    case 'deny':osc('triangle',220,160,t,.14,.2*vol,D);break;
    case 'combo':osc('sine',1320,1320,t,.08,.08*vol,D);break;
    case 'servo':osc('sawtooth',300,520,t,.18,.05*vol,D);nz(t,.18,.05*vol,'bandpass',1200,2000,6,D);break;
    case 'dash':nz(t,.2,.3*vol,'bandpass',800,3000,2,D,.01);osc('sine',300,120,t,.15,.15*vol,D);break;

function updateFighter(e){
  e.st++;timers(e);
  if(e.hp<=0&&!e.dying&&e.state!=='dead'){e.dying=true;}
  if(e.dying&&!isAir(e)&&!isDownish(e)&&e.state!=='dead'){releaseAll(e);e.move=null;setState(e,'air');e.vh=4.5;e.h=Math.max(e.h,1);e.vx=-e.face*3;}
  switch(e.state){
    case 'attack':updAttack(e);break;
    case 'hit':e.hitstun--;e.vx*=.86;e.vz*=.8;if(e.hitstun<=0){if(e.crumple){e.crumple=0;setState(e,'down');e.downT=26;sfx('down',.5);}else setState(e,'idle');}break;

function updAttack(e){

  else if(m.keepV!==undefined&&e.h<=0){e.vx*=m.keepV>=.9?.985:.95;e.vz*=.9;}

/* ---------- physics ---------- */
function physics(e){
  if(e.state==='grabbed'||e.state==='held')return;
  e.x+=e.vx;e.z+=e.vz;
  const airborne=e.h>0||e.vh>0;
  if(airborne){e.h+=e.vh;e.vh-=GRAV*(e.state==='air'&&e.juggle>1?1.06:1);if(e.h<=0){e.h=0;const vy=e.vh;e.vh=0;onLand(e,vy);}}
  e.z=clamp(e.z,0,ZMAX);
  const b=boundsOf(e);
  if(e.x<b.x0){wallHit(e,-1);e.x=b.x0;}else if(e.x>b.x1){wallHit(e,1);e.x=b.x1;}
  // props
  for(const p of G.props){if(p.dead||!p.solid)continue;if(e.h>=p.ht)continue;
    const ox=(p.w+e.w*.6)/2-Math.abs(e.x-p.x),oz=(p.d+14)/2-Math.abs(e.z-p.z);if(ox<=0||oz<=0)continue;
    if((e.state==='air'||e.state==='thrown')&&Math.abs(e.vx)>4.5){damageProp(p,e.state==='thrown'?30:18,sgn(e.vx),G.player);if(e.team==='enemy'){e.hp-=6;e.flash=4;}e.vx*=-.3;sfx('wall',.6);shake(4);
      if(e.team==='enemy'&&G.player){G.player.charge=Math.min(100,(G.player.charge||0)+3);ftext(e.x,e.z,e.h+e.ht,'IMPACT','#f2a541',16);}continue;}
    if(ox<oz){e.x+=sgn(e.x-p.x)*ox;if(Math.abs(e.vx)>.3||e.team==='enemy')e.z+=(p.z>ZMAX*.6?-1:p.z<ZMAX*.4?1:sgn(e.z-p.z||1))*1.8;}else{e.z+=sgn(e.z-p.z)*oz;}
  }
}
function wallHit(e,side){
  if((e.state==='air'||e.state==='thrown')&&Math.abs(e.vx)>3.5){
    const hard=e.kdFromWall||e.state==='thrown'||Math.abs(e.vx)>6;
    e.vx=-side*Math.abs(e.vx)*.3;e.vh=Math.max(e.vh,3.2);
    if(hard&&e.team==='enemy'){hurtDirect(e,e.def.boss?4:8);G.combo++;G.comboT=85;if(G.player)G.player.charge=Math.min(100,(G.player.charge||0)+3);ftext(e.x,e.z,e.h+e.ht,'WALL SPLAT','#f2a541',20);}

  } else if(e.state==='hit'&&e.wallable>0&&Math.abs(e.vx)>2.5){e.hitstun+=14;e.vx=-side*2;e.wallable=0;sfx('wall',.7);shake(3);sparks(e.x+side*e.w*.5,e.z,e.h+80,5,'#fff1c4',4);}
  else e.vx=0;

function onLand(e,vy){

/* ---------- separation ---------- */
function separate(){
  const L=G.ents;
  for(let i=0;i<L.length;i++){const a=L[i];if(a.dead||!grounded(a))continue;
    for(let j=i+1;j<L.length;j++){const b=L[j];if(b.dead||!grounded(b))continue;
      const dz=Math.abs(a.z-b.z);if(dz>16)continue;const min=(a.w+b.w)*(a.team===b.team?.42:.32);const dx=b.x-a.x;const ad=Math.abs(dx);if(ad>=min)continue;
      const push=(min-ad)*.25*(1-dz/16);const s=dx===0?(a.id<b.id?1:-1):sgn(dx);
      const wa=a.team==='player'?.35:1,wb=b.team==='player'?.35:1;
      a.x-=s*push*wa;b.x+=s*push*wb;
      if(a.team===b.team){const sz=a.z===b.z?(a.id<b.id?-1:1):sgn(b.z-a.z);a.z-=sz*.4;b.z+=sz*.4;}
    }}
}
function grounded(e){return e.h<=0&&!['grabbed','held','holding','grab','air','thrown','down','dead','getup'].includes(e.state)&&!e.def.small;}

function enemyNear(p,dirSign,maxD,minD){let best=null,bd=maxD;for(const t of G.ents){if(t.team===p.team||t.dead||isDownish(t))continue;const dx=(t.x-p.x)*dirSign;if(dx<(minD||-5)||dx>bd||Math.abs(t.z-p.z)>26)continue;bd=dx;best=t;}return best;}
function downInFront(p){for(const t of G.ents){if(t.team===p.team||t.dead||t.state!=='down')continue;const dx=(t.x-p.x)*p.face;if(dx>-10&&dx<90&&Math.abs(t.z-p.z)<24)return t;}return null;}

function updDodge(p){const d=p.def.dodge;const k=p.st/d.len;

  if(p.st>=d.len){setState(p,'idle');p.vx*=.4;p.vz*=.4;}

function playerControl(p){
  const c=p.def,ax=IN.ax,ay=IN.ay,mag=Math.hypot(ax,ay);
  if(p.dying||G.cine>0){if(canAct(p)){p.vx*=.8;p.vz*=.8;if(Math.abs(p.vx)<.3)setState(p,'idle');}return;}

    if(okState){consume('S');if((p.charge||0)>=sp.cost){p.charge-=sp.cost;if(ax)p.face=sgn(ax);startMove(p,c.SP);return;}
      else{sfx('deny');ftext(p.x,p.z,p.ht+20,'CYBER CHARGE LOW','#8fe9ff',16,40);}}}
  switch(p.state){
    case 'idle':case 'walk':case 'run':{
      if(IN.held.D&&mag<.3){setState(p,'block');p.move=null;return;}

        if(mag<.3){const fr=enemyNear(p,p.face,95),bk=enemyNear(p,-p.face,85,4);if(bk&&!fr){startMove(p,c.B);return;}}
        if(ax)p.face=sgn(ax);

      if(pressed('H')){consume('H');

        if(p.weapon){startMove(p,'wp_'+p.weapon.type+'H');return;}
        if(running){startMove(p,c.RH);return;}
        if(downInFront(p)&&Math.abs(ax)<.5){startMove(p,c.DN);return;}
        if(Math.abs(ax)>.5){p.face=sgn(ax);startMove(p,c.FH);return;}
        startMove(p,c.H);return;}
      // movement
      const run=IN.run&&Math.abs(ax)>.3;const sp=run?c.run:c.walk;
      const tvx=ax*sp,tvz=ay*c.walk*.66;
      p.vx+=(tvx-p.vx)*(run?.14:.25);p.vz+=(tvz-p.vz)*.25;
      if(Math.abs(ax)>.15)p.face=sgn(ax);
      const spd=Math.hypot(p.vx,p.vz);
      const ns=run&&spd>c.walk*1.1?'run':spd>.35?'walk':'idle';if(ns!==p.state){p.state=ns;}
      if(p.state==='run'&&G.t%5===0)landDust(p,1);
      return;}
    case 'block':
      if(!IN.held.D){setState(p,'idle');return;}
      if(mag>=.3&&pressed('D',14)){consume('D');startDodge(p,ax,ay);return;}
      if(mag>=.5){startDodge(p,ax,ay);return;}
      if(pressed('L')&&p.counterWin>0){consume('L');setState(p,'idle');startMove(p,c.L);return;}
      if(pressed('H')&&p.counterWin>0){consume('H');setState(p,'idle');startMove(p,c.H);return;}
      if(pressed('G')){consume('G');if(tryGrab(p))return;}
      return;
    case 'attack':{const m=p.move;if(!m||m.special)return;
      if(m.air){if(p.mt>=m.s+m.a&&m.airRepeat&&p.airActs<c.airMax+1&&(pressed('L')||pressed('H'))){const hv=pressed('H');consume('L');consume('H');p.airActs++;startMove(p,hv?c.AH:c.AL);}return;}
      if(p.mt>=m.cancel){
        if(pressed('L',12)&&m.next){consume('L');if(ax)p.face=sgn(ax);startMove(p,m.next);return;}
        if(pressed('H',12)&&m.fin){consume('H');if(ax)p.face=sgn(ax);startMove(p,m.fin);return;}
      }
      if(p.hits.size>0&&p.mt>=m.s+m.a){
        if(pressed('D')){consume('D');startDodge(p,mag>.3?ax:-p.face,ay);return;}
        if(pressed('J')){consume('J');p.move=null;doJump(p);return;}
      }
      if(p.mt>=moveTotal(m)-3&&pressed('D')&&mag>=.3){consume('D');startDodge(p,ax,ay);}
      return;}
    case 'jump':{
      p.vx+=(ax*c.walk*(p.runJ?1.6:1.1)-p.vx)*.06;p.vz+=(ay*c.walk*.5-p.vz)*.08;
      if(Math.abs(ax)>.3&&!p.runJ)p.face=sgn(ax);
      if(pressed('J')&&c.wallJump&&!p.wallJ){const b=boundsOf(p);const nearL=p.x-b.x0<34,nearR=b.x1-p.x<34;
        if(nearL||nearR){consume('J');const dir=nearL?1:-1;p.vx=dir*7.2;p.vh=c.jumpV*.92;p.face=dir;p.wallJ=1;p.airActs=0;sfx('wall',.6);ring(p.x,p.z,50,'rgba(255,157,122,',12,3);ftext(p.x,p.z,p.h+p.ht,'REBOUND','#ff9d7a',16);}}
      if((pressed('L')||pressed('H'))&&p.airActs<c.airMax){const hv=pressed('H');consume('L');consume('H');p.airActs++;
        if(p.carry||p.weapon){throwHeld(p);return;}startMove(p,hv?c.AH:c.AL);}
      return;}
    case 'down':return;
  }
}
function updGrab(p){
  const t=p.grabbing;if(!t||t.dead||t.state!=='grabbed'){p.grabbing=null;setState(p,'idle');return;}
  p.grabT++;t.x=p.x+p.face*(p.w*.45+t.w*.42);t.z=p.z;t.face=-p.face;t.h=0;p.vx*=.7;p.vz*=.7;
  if(p.kneeT>0){p.kneeT--;return;}
  const esc=t.def.boss?80:t.def.heavyBody?110:170;
  if(p.grabT>esc&&p.team==='player'){releaseGrab(p);setState(t,'idle');t.inv=12;t.vx=t.face*-1;p.vx=-p.face*4;setState(p,'stun');p.stunT=14;ftext(t.x,t.z,t.ht,'BROKE FREE','#8fe9ff',16);sfx('block');return;}
  if(p.autoThrow){p.autoThrow=0;throwEnemy(p,'fwd');return;}
  if(pressed('L')){consume('L');p.knees=(p.knees||0)+1;p.kneeT=13;grabStrike(p,t,6+p.def.grabPow*1.6);if(p.knees>=3||t.hp<=0)p.autoThrow=1;return;}
  if(pressed('H')){consume('H');if(IN.ay>.5)throwEnemy(p,'slam');else if(Math.abs(IN.ax)>.3&&sgn(IN.ax)!==p.face)throwEnemy(p,'back');else throwEnemy(p,'fwd');return;}
  if(pressed('J')){consume('J');uniqueGrapple(p,t);return;}
  if(pressed('D')){consume('D');releaseGrab(p);startDodge(p,IN.ax||-p.face,IN.ay);return;}
  if(pressed('G')){consume('G');throwEnemy(p,'fwd');return;}
}
function grabStrike(p,t,dmg){
  if(t.team==='enemy')t.hp-=dmg;t.flash=4;G.combo++;G.comboT=85;if(G.combo>G.bestCombo)G.bestCombo=G.combo;
  p.charge=Math.min(100,(p.charge||0)+2.5);G.score+=Math.round(dmg*12);
  const hx=t.x-p.face*4;flash(hx,t.z,t.h+70,40,'#ffe6c4');sparks(hx,t.z,t.h+70,6,'#fff1c4',5,p.face>0?0:Math.PI);sfx('hitL');G.hitstop=Math.max(G.hitstop,4);
  if(t.hp<=0){t.dying=true;releaseGrab(p);setState(t,'air');t.vh=5;t.vx=p.face*6;t.h=1;}
}
function uniqueGrapple(p,t){
  const id=p.def.id;
  if(id==='ram'){ftext(p.x,p.z,p.ht+20,'POWERBOMB','#f2a541',22);throwEnemy(p,'bomb');}
  else if(id==='ward'){ftext(p.x,p.z,p.ht+20,'HIP TOSS','#ffc861',20);throwEnemy(p,'slam');}
  else if(id==='vex'){releaseGrab(p);grabStrike(p,t,9);if(!t.dying){setState(t,'stun');t.stunT=50;}
    setState(p,'jump');p.vh=9.5;p.h=1;p.vx=p.face*5.6;p.airActs=0;p.face=-p.face;p.runJ=1;ftext(p.x,p.z,p.ht+20,'VAULT','#ff9d7a',20);sfx('whooshH');}
  else if(id==='wire'){releaseGrab(p);grabStrike(p,t,12);ftext(p.x,p.z,p.ht+20,'SHORT CIRCUIT','#7ef0c8',20);sfx('elec');
    for(let i=0;i<4;i++)arc(t.x,t.z,t.h+80,t.x+rand(-60,60),t.z+rand(-20,20),rand(0,120),'#bffff0',12);
    if(!t.dying){setState(t,'stun');t.stunT=100;t.elecT=100;t.vx=p.face*3;}
    for(const o of G.ents){if(o===t||o.team===p.team||o.dead)continue;if(Math.abs(o.x-t.x)<120&&Math.abs(o.z-t.z)<40){arc(t.x,t.z,80,o.x,o.z,o.h+80,'#bffff0',10);applyHit(p,o,{dmg:8,kb:3,reach:[0,0],hb:[0,0],elec:1,arcStun:60,hitSfx:'zap',spin:1});}}
    setState(p,'rec');p.recT=14;}
}

  const foes=G.ents.filter(e=>e.team==='enemy'&&!e.dead&&!e.dying&&!e.boss);

      g.addColorStop(0,'rgba(255,200,90,.9)');g.addColorStop(.5,'rgba(255,110,40,.6)');g.addColorStop(1,'rgba(120,30,10,0)');c.fillStyle=g;c.beginPath();c.ellipse(fx,y1-fh/2,(x1-x0)/10,fh/2,0,0,TAU);c.fill();}c.globalCompositeOperation='source-over';

/* ---------- flow ---------- */
function makePlayer(id){const d=CHARS[id];const p=mkFighter(d,'player',140,80);p.charge=25;p.careless=0;return p;}
function resetWorld(){G.ents=[];G.props=[];G.items=[];G.projs=[];G.hazards=[];G.npcs=[];G.bgnpcs=[];G.bossList=[];PARTS.length=0;FLOORFX.length=0;TEXTS.length=0;
  G.lock=null;G.wave=null;G.waveIdx=0;G.boss=null;G.dialog=null;G.bark=null;G.cine=0;G.combo=0;G.comboT=0;G.target=null;G.hitstop=0;G.slow=0;G.pincerT=0;G.camMin=0;G.goT=0;WX.rain.length=0;WX.motes.length=0;}
function startStage(idx,keepPlayer){
  const S=Object.assign({},STAGES[idx]);S.x0=0;resetWorld();G.S=S;G.stageIdx=idx;
  const old=G.player;G.player=makePlayer(G.runChar);if(keepPlayer&&old){G.player.charge=old.charge;}
  G.ents.push(G.player);CAM.x=0;CAM.shake=0;
  for(const pr of S.props)addProp(pr[0],pr[1],pr[2],pr[3]?Object.assign({},pr[3]):undefined);
  for(const it of S.items)spawnItem(it[0],it[1],it[2]);
  S.waves=S.waves.map(w=>Object.assign({done:false},w));
  if(S.setup)S.setup(S);
  S.decorBack=[];S.decorFront=[];
  if(S.id===1)S.decorBack.push(drawCrash);
  if(S.conveyors)S.decorBack.push(drawConveyors);
  G.cp={waveIdx:-1,x:140,z:80};
  musicPlay(S.music);bgInvalidate();
  G.state='intro';G.introT=0;
}
function beginPlay(){G.state='play';const S=G.S;if(S.intro&&S.intro.length)G.dialog={lines:S.intro,i:0,t:0};}
function parseGroup(str){const out=[];for(const part of str.split(',')){let [t,n]=part.split('*');n=+(n||1);let drop=false,dis=false;if(t.endsWith('!')){drop=true;t=t.slice(0,-1);}if(t.endsWith('~')){dis=true;t=t.slice(0,-1);}out.push({t,n,drop,dis});}return out;}
function spawnGroup(w,gi){const g=parseGroup(w.groups[gi]);let k=0;const lk=G.lock;
  for(const sp of g)for(let i=0;i<sp.n;i++){const side=(k+gi)%2===0?1:-1;let x=side>0?lk.x1+50+k*36:lk.x0-50-k*36;const z=rand(12,ZMAX-12);
    const e=spawnEnemy(sp.t,x,z);
    if(sp.drop){e.x=rand(lk.x0+120,lk.x1-120);e.h=300;e.state='jump';e.entering=false;e.vh=-2;}
    if(sp.dis){e.x=rand(lk.x0+220,lk.x1-80);e.z=rand(8,30);e.entering=false;e.disguised=true;e.face=Math.random()<.5?1:-1;}
    if(G.diff==='recruit'&&sp.t==='swarmer'&&i>2){e.dead=true;G.ents.splice(G.ents.indexOf(e),1);}
    k++;}
}
function triggerWave(i){const S=G.S;const w=S.waves[i];G.waveIdx=i;G.wave=w;w.gi=0;
  const x0=clamp(w.x-VW*.45,Math.max(0,G.camMin),S.len-VW);G.lock={x0,x1:x0+VW};
  G.cp={waveIdx:i,x:clamp(G.player.x,x0+60,x0+VW-60),z:G.player.z};
  let delay=false;if(w.crash&&!S.crash){S.crash={t:0,x:x0+VW*.72};delay=true;}
  if(w.boss){const list=Array.isArray(w.boss)?w.boss:[w.boss];list.forEach((b,k)=>{const e=spawnEnemy(b,G.lock.x1+90+k*60,k?ZMAX*.75:ZMAX*.35);e.phase=0;e.ai.cd=60;});
    if(!w.seen){w.seen=1;const t0=Array.isArray(w.boss)?w.boss[0]:w.boss;G.dialog={lines:bossDialog(t0),i:0,t:0,boss:t0};G.banner={text:BOSSDEF[t0].name,sub:BOSSDEF[t0].title,t:200,boss:1};}
    else G.cine=60;
    musicPlay(t0Final(w)?'final':'boss');
  } else if(w.groups.length&&!delay){spawnGroup(w,0);}
  if(w.tip&&!w.tipShown){w.tipShown=1;G.tip={text:w.tip,t:360};}
  sfx('warn',.5);
}
function t0Final(w){return w.boss==='consensus';}
function aliveFoes(){return G.ents.filter(e=>e.team==='enemy'&&!e.dead&&e.state!=='dead'&&!e.dying);}
function stageTick(){
  const S=G.S,p=G.player;if(!S||!p)return;
  if(S.tick)S.tick(S);
  if(G.pincerT>0)G.pincerT--;
  // wave logic
  if(!G.lock){const i=S.waves.findIndex(w=>!w.done);if(i>=0&&p.x>=S.waves[i].x&&G.cine<=0)triggerWave(i);
    else if(i<0&&!G.stageDone){G.stageDone=true;endStage();}}
  else if(G.wave){const w=G.wave;const foes=aliveFoes();const bossAlive=G.bossList.some(b=>!b.dead&&b.state!=='dead'&&!b.dying);
    if(w.boss&&!bossAlive&&G.bossList.length){for(const e of foes){e.dying=true;e.noDrop=true;}}
    const nonBoss=foes.filter(e=>!e.boss).length;
    if(w.gi<w.groups.length-1&&nonBoss<=(w.after===undefined?1:w.after)&&G.cine<=0&&(!w.boss||bossAlive)){w.gi++;spawnGroup(w,w.gi);}
    else if(w.boss&&bossAlive&&w.groups.length&&w.gi===w.groups.length-1&&nonBoss===0&&G.t%900===0){spawnGroup(w,w.gi);}
    if(w.boss&&!w.gi&&w.groups.length&&w.gi===0&&!w.bs&&G.cine<=0){w.bs=1;spawnGroup(w,0);}
    if(foes.length===0&&(!w.boss||!bossAlive)&&(w.gi>=w.groups.length-1||!w.groups.length)&&G.cine<=0){waveClear(w);}
  }
  // conveyors
  for(const hz of G.hazards){if(hz.type!=='conveyor')continue;
    for(const e of G.ents){if(e.dead||e.h>4||e.state==='held'||e.state==='grabbed'||e.def.hover)continue;if(e.x>hz.x0&&e.x<hz.x1&&e.z>hz.z0&&e.z<hz.z1)e.x+=hz.v*(e.team==='player'&&e.state==='walk'?.6:1);}
    for(const it of G.items){if(it.x>hz.x0&&it.x<hz.x1&&it.z>hz.z0&&it.z<hz.z1)it.x+=hz.v;}
    if(--hz.pressT<=0){hz.pressT=150;if(Math.abs(hz.x1-(CAM.x+VW/2))<VW)spawnLane({x0:hz.x1-50,x1:hz.x1+60,z0:hz.z0,z1:hz.z1,warn:40,act:8,tail:30,dmg:15,fx:'press',sfxHit:'press',label:'PRESS'});}}
}
function waveClear(w){w.done=true;G.lock=null;G.wave=null;G.goT=200;G.score+=500;G.bossList=G.bossList.filter(b=>!b.dead&&b.state!=='dead');
  if(w.boss){G.bossList=[];musicPlay(G.S.music);}
  G.ents=G.ents.filter(e=>e.team==='player'||(!e.dead&&e.state!=='dead'));
}
function endStage(){const S=G.S;
  if(S.id===1){S.leaving=true;for(const n of G.bgnpcs)if(n.keep){n.run=2.4;}}
  const lines=S.outro||[];
  const fin=()=>{G.state='clear';G.clearT=0;musicPlay('calm');const nx=Math.min(6,G.stageIdx+2);if(G.stageIdx<5)SAVE.unlocked=Math.max(SAVE.unlocked,nx);SAVE.best=Math.max(SAVE.best,G.score);writeSave();sfx('uiOk');};
  if(lines.length)G.dialog={lines,i:0,t:0,onDone:()=>{G.pendClear=90;}};else G.pendClear=90;
  G.onClear=fin;
}

  G.ents=G.ents.filter(e=>e===p);G.projs=[];G.bossList=[];G.combo=0;G.stats.deaths++;
  Object.assign(p,{hp:p.maxhp,dying:false,dead:false,state:'idle',st:0,vx:0,vz:0,vh:0,h:0,inv:90,move:null,grabbing:null,heldBy:null,alpha:1,juggle:0,juggleImm:false});
  p.charge=Math.max(p.charge||0,50);

}

function botThink(){

  const press=b=>{IN.buf[b]=IN.frame;IN.anyPress=true;IN.mash++;};
  const B=G.botS||(G.botS={t:0,n:0});B.t++;
  if(p.state==='held'){IN.mash+=2;return;}
  if(p.state==='down'){if(B.t%3===0)press('L');return;}
  if(p.state==='grab'){if(B.t%8===0)press(B.n++%3===2?'H':'L');return;}
  // avoid warned lanes
  for(const pr of G.projs){if(pr.kind!=='lane'||pr.team==='player')continue;if(pr.t>=pr.warn+pr.act)continue;
    if(p.x>pr.x0-20&&p.x<pr.x1+20&&p.z>pr.z0-10&&p.z<pr.z1+10){const midz=(pr.z0+pr.z1)/2;
      if(pr.z1-pr.z0<ZMAX*.8)IN.ay=p.z<midz?(pr.z0>8?-1:1):(pr.z1<ZMAX-8?1:-1);else IN.ax=p.x<(pr.x0+pr.x1)/2?-1:1;return;}}
  const foes=G.ents.filter(e=>e.team==='enemy'&&!e.dead&&!e.dying&&e.state!=='dead'&&!(e.entering&&G.lock&&(e.x<G.lock.x0||e.x>G.lock.x1)));
  if(!foes.length){if(!G.lock&&!G.dialog){IN.ax=1;IN.run=true;}else if(G.lock){const cx=(G.lock.x0+G.lock.x1)/2;IN.ax=Math.abs(p.x-cx)>40?sgn(cx-p.x):0;}
    return;}

  let skip=false;if(G.slow>0){G.slow--;skip=G.t%2===0;}
  if(G.comboT>0){G.comboT--;if(G.comboT===0)G.combo=0;}

  if(p){if(!G.dialog)playerControl(p);else if(canAct(p)){p.vx*=.8;p.vz*=.8;if(Math.hypot(p.vx,p.vz)<.3)setState(p,'idle');}updateFighter(p);}

}

  UI.portrait=IN.device==='touch'&&CSSH>CSSW*1.05;
  const st=G.state;
  try{
    if((st==='play'||st==='pause'||st==='retry'||st==='clear'||st==='intro')&&G.S&&G.player)drawWorld(c);
    switch(st){
      case 'title':drawTitle(c);break;
      case 'select':drawSelect(c);break;
      case 'stages':drawStages(c);break;
      case 'controls':drawControls(c);break;
      case 'intro':drawIntroCard(c);break;
      case 'play':drawHUD(c);drawDialog(c);break;
      case 'pause':drawHUD(c);drawPause(c);break;
      case 'retry':drawRetry(c);break;
      case 'clear':drawClear(c);break;
      case 'ending':drawEnding(c);break;
    }
    if(UI.portrait&&!UI.rotateOK)drawRotate(c);
    if(PTR.click){for(let i=UI.hits.length-1;i>=0;i--){const h=UI.hits[i],r=h.r;if(PTR.x>=r.x&&PTR.x<=r.x+r.w&&PTR.y>=r.y&&PTR.y<=r.y+r.h){h.fn();break;}}}
  }catch(err){console.error(err);G.lastErr=String(err&&err.stack||err);}
  c.restore();
  PTR.click=false;PTR.moved=false;IN.anyPress=saveAny;
  const showTouch=IN.device==='touch'&&G.state==='play'&&!(UI.portrait&&!UI.rotateOK);
  const want=showTouch?'':'none';if(touchEl.style.display!==want)touchEl.style.display=want;
}
let lastT=performance.now(),accT=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=now-lastT;lastT=now;if(dt>250)dt=250;accT+=dt;let n=0;
  try{
    while(accT>=1000/60&&n<4){accT-=1000/60;tick();n++;}if(n===4)accT=0;
    if(G.fast)for(let i=0;i<G.fast;i++)tick();
  }catch(err){console.error(err);G.lastErr=String(err&&err.stack||err);}
  render();musicTick();
}
window.__CR={G,IN,UI,SAVE,STAGES,CAM,
  start(ch,stage,diff){if(diff)G.diff=diff;G.runChar=ch||'ram';UI.stageSel=stage||0;UI.charSel=CHAR_IDS.indexOf(G.runChar);pickChar();},
  bot(on){G.bot=!!on;},god(on){G.god=!!on;},fast(n){G.fast=n|0;},
  step(n){for(let i=0;i<n;i++)tick();render();},
  skipTo(i){const S=G.S;for(let k=0;k<i&&k<S.waves.length;k++)S.waves[k].done=true;const w=S.waves[i];if(w){G.player.x=w.x-40;CAM.x=clamp(w.x-VW*.42-40,0,S.len-VW);G.camMin=CAM.x;}},
};
loadSave();G.diff=SAVE.diff||'veteran';resize();go('title');musicPlay('title');
requestAnimationFrame(frame);

</script>
