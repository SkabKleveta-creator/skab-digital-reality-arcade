<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RECLAIMER RUN</title>
<style>
  :root{
    --void:#0a0e16; --copper:#c97b3d; --copper-dim:#8a5626;
    --patina:#4fb8a6; --hazard:#e0483f; --bone:#e8e6df;
    --shadow:#241408; --panel:#160f0a;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; width:100%; height:100%;
    background:var(--void); color:var(--bone);
    font-family:'Courier New', ui-monospace, Menlo, Consolas, monospace;
    overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none; }
  #app{ position:fixed; inset:0; }
  canvas{ position:absolute; inset:0; display:block; width:100%; height:100%; touch-action:none; }

  #hud{ position:fixed; inset:0; pointer-events:none;
    padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left)); }
  #topRow{ display:flex; justify-content:space-between; align-items:flex-start; }
  .gauge{ width:118px; }
  .gaugeLabel{ display:flex; justify-content:space-between; font-size:9px; letter-spacing:0.13em; color:var(--copper); margin-bottom:3px; }
  .gaugeTrack{ height:5px; background:var(--shadow); border:1px solid var(--copper-dim); overflow:hidden; }
  .gaugeFill{ height:100%; background:var(--patina); }
  .gaugeFill.low{ background:var(--hazard); }
  #podBlock{ text-align:right; }
  #podBlock .lbl{ font-size:9px; letter-spacing:0.13em; color:var(--copper); margin-bottom:4px; }
  #pods{ display:flex; gap:4px; justify-content:flex-end; }
  .pod{ width:9px; height:15px; border:1px solid var(--patina); background:var(--patina); }
  .pod.spent{ background:transparent; border-color:var(--copper-dim); }
  #lvlTag{ position:fixed; left:0; right:0; top:max(14px,env(safe-area-inset-top));
    text-align:center; font-size:9px; letter-spacing:0.22em; color:var(--copper-dim); pointer-events:none; }

  #readout{ position:fixed; left:0; right:0; bottom:calc(max(24px,env(safe-area-inset-bottom)) + 172px);
    text-align:center; pointer-events:none; font-size:10px; letter-spacing:0.11em; line-height:1.7; }
  .obj{ color:var(--copper); } .val{ color:var(--bone); }
  .cue{ color:var(--patina); } .warn{ color:var(--hazard); }

  #beat{ position:fixed; left:0; right:0; top:32%; text-align:center; padding:0 22px;
    font-size:12px; letter-spacing:0.13em; color:var(--patina); pointer-events:none; text-transform:uppercase; }
  #beat[hidden]{ display:none !important; }

  #departBtn{ position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(max(24px,env(safe-area-inset-bottom)) + 132px);
    width:190px; pointer-events:auto; background:rgba(79,184,166,0.18);
    border:1px solid var(--patina); color:var(--patina); padding:11px 0; text-align:center;
    font-size:11px; letter-spacing:0.16em; }
  #departBtn[hidden]{ display:none !important; }

  #thrustPad{ position:fixed; bottom:max(24px,env(safe-area-inset-bottom)); left:max(18px,env(safe-area-inset-left));
    width:132px; height:132px; border-radius:50%; border:1px solid var(--copper-dim);
    background:rgba(201,123,61,0.05); pointer-events:auto; touch-action:none; }
  #thrustPad .ring{ position:absolute; inset:9px; border:1px solid rgba(201,123,61,0.22); border-radius:50%; }
  #thrustPad .thumb{ position:absolute; width:44px; height:44px; left:50%; top:50%; margin:-22px;
    border-radius:50%; background:var(--copper); opacity:0.5; }
  #thrustPad.active .thumb{ opacity:0.9; }
  .padTag{ position:absolute; bottom:-17px; width:100%; text-align:center; font-size:9px; letter-spacing:0.18em; color:var(--copper-dim); }

  .actBtn{ position:fixed; width:80px; height:80px; border-radius:50%; border:2px solid var(--copper-dim);
    background:rgba(201,123,61,0.07); pointer-events:auto; touch-action:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .actBtn .glyph{ font-size:20px; color:var(--copper); }
  .actBtn .cap{ font-size:8px; letter-spacing:0.1em; color:var(--copper-dim); margin-top:2px; }
  .actBtn.held{ background:rgba(79,184,166,0.22); border-color:var(--patina); }
  .actBtn.held .glyph,.actBtn.held .cap{ color:var(--patina); }
  .actBtn.ready{ border-color:var(--patina); box-shadow:0 0 14px rgba(79,184,166,0.45); }
  .actBtn.ready .glyph{ color:var(--patina); }
  #btnA{ right:max(18px,env(safe-area-inset-right)); bottom:max(24px,env(safe-area-inset-bottom)); }
  #btnB{ right:calc(max(18px,env(safe-area-inset-right)) + 88px); bottom:calc(max(24px,env(safe-area-inset-bottom)) + 52px); }

  .overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:20px; background:rgba(10,14,22,0.76); pointer-events:auto; }
  .overlay[hidden]{ display:none !important; pointer-events:none; }
  .card{ width:min(430px,100%); max-height:88vh; overflow-y:auto; background:var(--panel);
    border:1px solid var(--copper-dim); padding:22px 20px; }
  .card .eyebrow{ font-size:10px; letter-spacing:0.3em; color:var(--patina); text-transform:uppercase; margin-bottom:6px; }
  .card h1{ font-size:15px; letter-spacing:0.14em; color:var(--copper); margin:0 0 4px; text-transform:uppercase; }
  .card .sub{ font-size:11px; color:var(--copper-dim); letter-spacing:0.08em; margin-bottom:14px; }
  .card p{ font-size:12px; line-height:1.65; margin:0 0 11px; }
  .card h1.bad{ color:var(--hazard); }
  .ctl{ display:flex; justify-content:space-between; font-size:11px; padding:6px 0; border-bottom:1px solid var(--shadow); }
  .ctl:last-of-type{ border-bottom:none; }
  .ctl span:first-child{ color:var(--copper); }
  button.main{ font-family:inherit; letter-spacing:0.14em; text-transform:uppercase; font-size:11px;
    background:var(--copper-dim); color:var(--bone); border:1px solid var(--copper); padding:12px 16px; width:100%; cursor:pointer; margin-top:6px; }
  button.main:active{ background:var(--copper); }
  .footer{ text-align:center; font-size:9px; letter-spacing:0.18em; color:var(--copper-dim); margin-top:14px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="topRow">
      <div class="gauge">
        <div class="gaugeLabel"><span>TANK</span><span id="propVal">100%</span></div>
        <div class="gaugeTrack"><div class="gaugeFill" id="propFill" style="width:100%"></div></div>
        <div class="gaugeLabel" style="margin-top:6px;"><span>HULL</span><span id="hullVal">100%</span></div>
        <div class="gaugeTrack"><div class="gaugeFill" id="hullFill" style="width:100%"></div></div>
      </div>
      <div id="podBlock">
        <div class="lbl">RECLAIMER PODS</div>
        <div id="pods"></div>
      </div>
    </div>
  </div>
  <div id="lvlTag"></div>

  <div id="readout"></div>
  <div id="beat" hidden></div>
  <div id="departBtn" hidden>DEPART (X)</div>

  <div id="thrustPad"><div class="ring"></div><div class="thumb"></div><div class="padTag">RCS THRUST</div></div>
  <div class="actBtn" id="btnA"><div class="glyph">A</div><div class="cap">MATCH</div></div>
  <div class="actBtn" id="btnB"><div class="glyph">B</div><div class="cap">HOOK</div></div>

  <div class="overlay" id="briefing">
    <div class="card">
      <div class="eyebrow">RECLAIMER RUN</div>
      <h1 id="brTitle">Level 1</h1>
      <div class="sub" id="brSub"></div>
      <div id="brBody"></div>
      <button class="main" id="brBtn">DEPLOY RCL-1</button>
      <div class="footer" id="ftr1"></div>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="card">
      <div class="eyebrow">RECLAIMER RUN</div>
      <h1 id="rsTitle"></h1>
      <div class="sub" id="rsSub"></div>
      <div id="rsBody"></div>
      <button class="main" id="rsBtn"></button>
      <div class="footer" id="ftr2"></div>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="card">
      <h1>PAUSED</h1>
      <p>Controls released.</p>
      <button class="main" id="resumeBtn">RESUME (ESC)</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var BUILD_ID = 'RCL-BUILD-2026-08-08-04';

  var C = { void:'#0a0e16', copper:'#c97b3d', copperDim:'#8a5626',
            patina:'#4fb8a6', hazard:'#e0483f', bone:'#e8e6df' };

  var K = {
    thrustAcc:     215,
    loadFactor:    0.45,   // accel = thrustAcc / (1 + loadFactor * towedMass)
    maxSpeed:      310,
    matchRange:    280,
    matchRate:     2.9,
    brakeRate:     2.2,
    hookRange:     54,
    hookVrel:      30,
    contactVrel:   95,
    contactDamage: 10,
    propThrust:    1.5,    // %/s at full deflection
    propMatch:     2.0,    // %/s holding A
    towSpacing:    40,
    maxTow:        10,
    strandSpeed:   12
  };

  // Explicit per-level source of truth.
  // pods: +1 every other level (2,2,3,3,4,4,5)
  // size: compounds +10% per level from a 2060 base (1.10^6 = 1.77x by L7)
  // heavy: share of HEAVY-class salvage, so trains get heavier as fields grow
  var LEVELS = [
    { targets:10, pods:2, size:2060, driftMin:12, driftMax:38, heavy:0.15, name:'SHAKEDOWN' },
    { targets:15, pods:2, size:2266, driftMin:16, driftMax:45, heavy:0.20, name:'NEAR SHELF' },
    { targets:20, pods:3, size:2493, driftMin:19, driftMax:52, heavy:0.26, name:'BREAKUP TRAIL' },
    { targets:25, pods:3, size:2742, driftMin:23, driftMax:59, heavy:0.32, name:'STAGE GRAVEYARD' },
    { targets:30, pods:4, size:3016, driftMin:26, driftMax:66, heavy:0.38, name:'DRIFT CORRIDOR' },
    { targets:40, pods:4, size:3318, driftMin:30, driftMax:73, heavy:0.44, name:'CASCADE FIELD' },
    { targets:50, pods:5, size:3650, driftMin:33, driftMax:80, heavy:0.50, name:'DEEP SCATTER' }
  ];

  var MASS_CLASS = [
    { name:'LIGHT', mass:0.7, r:17 },
    { name:'STD',   mass:1.0, r:22 },
    { name:'HEAVY', mass:1.5, r:28 }
  ];
  var TYPES = ['COMSAT BUS','UPPER STAGE','NAV SAT','ADAPTER RING','CUBESAT CLUSTER','TANK SECTION'];

  function $(id){ return document.getElementById(id); }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }

  var cv = $('cv'), ctx = cv.getContext('2d');
  var D = {
    propVal:$('propVal'), propFill:$('propFill'), hullVal:$('hullVal'), hullFill:$('hullFill'),
    pods:$('pods'), lvlTag:$('lvlTag'), readout:$('readout'), beat:$('beat'), departBtn:$('departBtn'),
    pad:$('thrustPad'), btnA:$('btnA'), btnB:$('btnB'),
    briefing:$('briefing'), brTitle:$('brTitle'), brSub:$('brSub'), brBody:$('brBody'), brBtn:$('brBtn'),
    result:$('result'), rsTitle:$('rsTitle'), rsSub:$('rsSub'), rsBody:$('rsBody'), rsBtn:$('rsBtn'),
    paused:$('paused'), resumeBtn:$('resumeBtn'), ftr1:$('ftr1'), ftr2:$('ftr2')
  };
  D.ftr1.textContent = BUILD_ID; D.ftr2.textContent = BUILD_ID;

  var WORLD = { w:2100, h:2100 };
  var STATION = { x:1050, y:1050, r:78, dock:120 };

  var S = {
    phase:'BRIEFING', paused:false, t:0, deployT:0,
    level:0, campaign:0, banked:[],
    pods:2, podsMax:2,
    ship:{ x:0, y:0, vx:0, vy:0, angle:-Math.PI/2, prop:100, hull:100 },
    targets:[], tow:[], delivered:0, trips:0, hits:0,
    beat:{ text:'', t:0 }, hookSolution:false, inDock:false, dockReady:false, atLimit:false, firstRun:true
  };

  var IN = { tx:0, ty:0, a:false, bEdge:false, depart:false };

  // ---- level setup -------------------------------------------------------
  function buildLevel(i){
    var cfg = LEVELS[i];
    var size = cfg.size;
    WORLD.w = size; WORLD.h = size;
    STATION.x = size/2; STATION.y = size/2;

    var driftMin = cfg.driftMin, driftMax = cfg.driftMax;
    var out = [];
    var guard = 0;
    while (out.length < cfg.targets && guard++ < 20000){
      var x = rand(120, WORLD.w-120), y = rand(120, WORLD.h-120);
      if (dist(x,y,STATION.x,STATION.y) < STATION.dock + 420) continue;
      var roll = Math.random();
      var mc = roll < cfg.heavy ? MASS_CLASS[2] : (roll < cfg.heavy + (1-cfg.heavy)*0.42 ? MASS_CLASS[0] : MASS_CLASS[1]);
      var ok = out.every(function(t){ return dist(x,y,t.x,t.y) > 105; });
      if (!ok) continue;
      var sp = rand(driftMin, driftMax), dir = rand(0,Math.PI*2);
      out.push({
        x:x, y:y, vx:Math.cos(dir)*sp, vy:Math.sin(dir)*sp,
        ang:rand(0,Math.PI*2), spin:rand(-1.2,1.2),
        type:pick(TYPES), cls:mc.name, mass:mc.mass, r:mc.r,
        status:'PENDING'
      });
    }

    S.targets = out;
    S.pods = cfg.pods; S.podsMax = cfg.pods;
    S.tow = []; S.delivered = 0; S.trips = 0; S.hits = 0;
    S.ship.x = STATION.x; S.ship.y = STATION.y + STATION.dock*0.6;
    S.ship.vx = 0; S.ship.vy = 0; S.ship.angle = Math.PI/2;
    S.ship.prop = 100; S.ship.hull = 100;
    S.deployT = 0;
  }

  function showBriefing(){
    var cfg = LEVELS[S.level];
    D.brTitle.textContent = 'LEVEL ' + (S.level+1) + ' — ' + cfg.name;
    D.brSub.textContent = 'SALVAGE FIELD ' + (S.level+1) + ' OF ' + LEVELS.length;
    var body = '';
    body += '<div class="ctl"><span>SALVAGE IN FIELD</span><span>' + cfg.targets + '</span></div>';
    body += '<div class="ctl"><span>RECLAIMER FUEL PODS</span><span>' + cfg.pods + '</span></div>';
    body += '<div class="ctl"><span>FIELD SPAN</span><span>' + cfg.size + 'M</span></div>';
    body += '<div class="ctl"><span>DRIFT RATE</span><span>' + cfg.driftMin + '-' + cfg.driftMax + '</span></div>';
    body += '<div class="ctl"><span>HEAVY SALVAGE</span><span>' + Math.round(cfg.heavy*100) + '%</span></div>';
    body += '<div class="ctl"><span>BANKED SO FAR</span><span>' + S.campaign + '</span></div>';
    if (S.firstRun){
      body += '<p style="margin-top:14px;">Hook salvage with B. You can chain several into one tow train &mdash; more mass, less thrust. Dock at the RECLAIMER to drop the whole train; each drop-off spends one pod and refills your tank.</p>';
      body += '<p><span style="color:var(--hazard)">You must DEPART docked with the RECLAIMER.</span> Run the tank dry out in the field and the entire haul is lost.</p>';
      body += '<div class="ctl"><span>THRUST</span><span>left pad / WASD</span></div>';
      body += '<div class="ctl"><span>A &mdash; MATCH VELOCITY</span><span>hold &middot; Space / J</span></div>';
      body += '<div class="ctl"><span>B &mdash; HOOK / DROP</span><span>K</span></div>';
      body += '<div class="ctl"><span>DEPART (at dock)</span><span>X</span></div>';
    } else {
      body += '<p style="margin-top:14px;">Field is denser and drifting faster. Fill the train before you burn a pod.</p>';
    }
    D.brBody.innerHTML = body;
    D.brBtn.textContent = 'DEPLOY RCL-1';
    setPhase('BRIEFING');
  }

  function startLevel(){
    buildLevel(S.level);
    S.firstRun = false;
    setPhase('DEPLOY');
  }

  function setPhase(p){
    S.phase = p;
    D.briefing.hidden = p !== 'BRIEFING';
    D.result.hidden = p !== 'RESULT';
    if (p !== 'FLIGHT') D.departBtn.hidden = true;
  }

  function beat(text){ S.beat.text = text; S.beat.t = 2.1; }

  function towedMass(){ return S.tow.reduce(function(a,t){ return a + t.mass; }, 0); }
  function accelNow(){ return K.thrustAcc / (1 + K.loadFactor*towedMass()); }

  function nearestPending(){
    var best=null, bd=Infinity;
    for (var i=0;i<S.targets.length;i++){
      var t = S.targets[i];
      if (t.status !== 'PENDING') continue;
      var d = dist(S.ship.x,S.ship.y,t.x,t.y);
      if (d < bd){ bd=d; best=t; }
    }
    return best ? { t:best, d:bd } : null;
  }

  // ---- update ------------------------------------------------------------
  function update(dt){
    S.t += dt;
    if (S.beat.t > 0) S.beat.t -= dt;

    if (S.phase === 'DEPLOY'){
      S.deployT += dt;
      if (S.deployT > 1.6) setPhase('FLIGHT');
      return;
    }
    if (S.phase !== 'FLIGHT') return;

    var sh = S.ship;

    for (var i=0;i<S.targets.length;i++){
      var t = S.targets[i];
      if (t.status !== 'PENDING') continue;
      t.x += t.vx*dt; t.y += t.vy*dt; t.ang += t.spin*dt;
      if (t.x < 50 || t.x > WORLD.w-50) t.vx *= -1;
      if (t.y < 50 || t.y > WORLD.h-50) t.vy *= -1;
    }

    // thrust
    var mag = Math.hypot(IN.tx, IN.ty);
    if (mag > 0.04 && sh.prop > 0){
      var ux = IN.tx/mag, uy = IN.ty/mag, amt = Math.min(mag,1);
      sh.angle = Math.atan2(uy,ux);
      var acc = accelNow();
      sh.vx += ux*acc*amt*dt; sh.vy += uy*acc*amt*dt;
      sh.prop = clamp(sh.prop - K.propThrust*amt*dt, 0, 100);
    }

    // A: match nearest pending target if in range, else null velocity
    var near = nearestPending();
    var mt = (near && near.d < K.matchRange && S.tow.length < K.maxTow) ? near.t : null;
    if (IN.a && sh.prop > 0){
      var k = mt ? K.matchRate : K.brakeRate;
      var tvx = mt ? mt.vx : 0, tvy = mt ? mt.vy : 0;
      var f = 1 - Math.exp(-k*dt);
      sh.vx += (tvx - sh.vx)*f; sh.vy += (tvy - sh.vy)*f;
      sh.prop = clamp(sh.prop - K.propMatch*dt, 0, 100);
    }

    var sp = Math.hypot(sh.vx, sh.vy);
    if (sp > K.maxSpeed){ var s = K.maxSpeed/sp; sh.vx *= s; sh.vy *= s; }

    sh.x += sh.vx*dt; sh.y += sh.vy*dt;

    var pushed = false;
    if (sh.x < 60){ sh.vx += 260*dt; pushed = true; }
    if (sh.x > WORLD.w-60){ sh.vx -= 260*dt; pushed = true; }
    if (sh.y < 60){ sh.vy += 260*dt; pushed = true; }
    if (sh.y > WORLD.h-60){ sh.vy -= 260*dt; pushed = true; }
    S.atLimit = pushed;

    // hook solution
    S.hookSolution = false;
    if (mt){
      var d = dist(sh.x,sh.y,mt.x,mt.y);
      var rv = Math.hypot(sh.vx-mt.vx, sh.vy-mt.vy);
      if (d < K.hookRange && rv < K.hookVrel) S.hookSolution = true;
    }

    // contact damage against free salvage
    for (var j=0;j<S.targets.length;j++){
      var ft = S.targets[j];
      if (ft.status !== 'PENDING') continue;
      var dd = dist(sh.x,sh.y,ft.x,ft.y);
      if (dd < ft.r + 13){
        var rv2 = Math.hypot(sh.vx-ft.vx, sh.vy-ft.vy);
        if (rv2 > K.contactVrel){
          sh.hull = clamp(sh.hull - K.contactDamage, 0, 100);
          S.hits++;
          beat('HARD CONTACT — HULL DAMAGE');
        }
        var nx = (sh.x-ft.x)/(dd||1), ny = (sh.y-ft.y)/(dd||1);
        sh.x = ft.x + nx*(ft.r+14); sh.y = ft.y + ny*(ft.r+14);
        sh.vx = ft.vx + nx*28; sh.vy = ft.vy + ny*28;
      }
    }

    // tow chain follows
    var px = sh.x, py = sh.y;
    for (var c=0;c<S.tow.length;c++){
      var tw = S.tow[c];
      var dx = px - tw.x, dy = py - tw.y;
      var dl = Math.hypot(dx,dy) || 1;
      var ax = px - (dx/dl)*K.towSpacing, ay = py - (dy/dl)*K.towSpacing;
      tw.x += (ax - tw.x)*Math.min(1, 11*dt);
      tw.y += (ay - tw.y)*Math.min(1, 11*dt);
      tw.vx = sh.vx; tw.vy = sh.vy; tw.ang += 0.25*dt;
      px = tw.x; py = tw.y;
    }

    S.inDock = dist(sh.x,sh.y,STATION.x,STATION.y) < STATION.dock;
    S.dockReady = S.inDock && Math.hypot(sh.vx,sh.vy) < 60;
    D.departBtn.hidden = !S.dockReady;

    if (IN.bEdge){
      IN.bEdge = false;
      if (S.dockReady && S.tow.length) dropOff();
      else if (S.inDock && S.tow.length && !S.dockReady) beat('TOO FAST TO DOCK — SLOW BELOW 60');
      else tryHook(mt);
    }

    if (IN.depart){
      IN.depart = false;
      if (S.dockReady) depart();
      else if (S.inDock) beat('SLOW BELOW 60 TO DEPART');
      else beat('MUST BE DOCKED WITH RECLAIMER TO DEPART');
    }

    // stranded: dry tank, drifting, away from dock
    if (sh.prop <= 0 && !S.inDock && Math.hypot(sh.vx,sh.vy) < K.strandSpeed) return stranded('TANK DRY — TUG ADRIFT');
    if (sh.hull <= 0) return stranded('HULL INTEGRITY LOST');
  }

  function tryHook(mt){
    if (S.tow.length >= K.maxTow){ beat('TOW TRAIN AT CAPACITY — RETURN TO DOCK'); return; }
    if (!mt){ beat('NO SALVAGE IN RANGE'); return; }
    var sh = S.ship;
    var d = dist(sh.x,sh.y,mt.x,mt.y);
    var rv = Math.hypot(sh.vx-mt.vx, sh.vy-mt.vy);
    if (d >= K.hookRange){ beat('TOO FAR — CLOSE TO ' + K.hookRange + 'M'); return; }
    if (rv >= K.hookVrel){ beat('REL V ' + Math.round(rv) + ' — HOLD A TO MATCH'); return; }
    mt.status = 'TOWED';
    S.tow.push(mt);
    beat('HOOKED ' + mt.type + ' — TRAIN ' + S.tow.length + '/' + K.maxTow);
  }

  function dropOff(){
    var n = S.tow.length;
    S.tow.forEach(function(t){ t.status = 'DONE'; });
    S.tow = [];
    S.delivered += n;
    S.trips++;
    if (S.pods > 0){
      S.pods--;
      S.ship.prop = 100;
      beat('DROPPED ' + n + ' — POD SPENT, TANK FULL (' + S.pods + ' LEFT)');
    } else {
      beat('DROPPED ' + n + ' — NO PODS LEFT, NO REFUEL');
    }
  }

  function depart(){
    S.campaign += S.delivered;
    S.banked.push({ level:S.level+1, delivered:S.delivered, of:LEVELS[S.level].targets });
    var cfg = LEVELS[S.level];
    var last = S.level >= LEVELS.length-1;
    D.rsTitle.className = '';
    D.rsTitle.textContent = last ? 'CAMPAIGN COMPLETE' : 'DEPARTED — HAUL BANKED';
    D.rsSub.textContent = 'LEVEL ' + (S.level+1) + ' CLOSED';
    var pctv = Math.round(100*S.delivered/cfg.targets);
    var body = '';
    body += '<div class="ctl"><span>SALVAGE BANKED</span><span>' + S.delivered + ' / ' + cfg.targets + '  (' + pctv + '%)</span></div>';
    body += '<div class="ctl"><span>TRIPS</span><span>' + S.trips + '</span></div>';
    body += '<div class="ctl"><span>PODS LEFT</span><span>' + S.pods + ' / ' + S.podsMax + '</span></div>';
    body += '<div class="ctl"><span>HARD CONTACTS</span><span>' + S.hits + '</span></div>';
    body += '<div class="ctl"><span>CAMPAIGN TOTAL</span><span>' + S.campaign + '</span></div>';
    if (last){
      body += '<p style="margin-top:14px;">Every field worked. Total salvage recovered: ' + S.campaign + '.</p>';
      var tot = 0;
      S.banked.forEach(function(b){ tot += b.of; });
      body += '<div class="sub" style="margin:12px 0 4px;">CAMPAIGN LEDGER</div>';
      S.banked.forEach(function(b){
        body += '<div class="ctl"><span>LEVEL ' + b.level + '</span><span>' + b.delivered + ' / ' + b.of + '</span></div>';
      });
      body += '<div class="ctl"><span>TOTAL</span><span>' + S.campaign + ' / ' + tot +
              '  (' + Math.round(100*S.campaign/tot) + '%)</span></div>';
      D.rsBtn.textContent = 'RUN CAMPAIGN AGAIN (R)';
    } else {
      D.rsBtn.textContent = 'NEXT FIELD (R)';
    }
    S.lastResult = last ? 'CAMPAIGN' : 'ADVANCE';
    D.rsBody.innerHTML = body;
    setPhase('RESULT');
  }

  function stranded(reason){
    D.rsTitle.className = 'bad';
    D.rsTitle.textContent = 'TOTAL LOSS';
    D.rsSub.textContent = reason;
    var body = '';
    body += '<p>The tug never made it back to the RECLAIMER. Salvage in the field and in tow is written off.</p>';
    body += '<div class="ctl"><span>HAUL FORFEITED</span><span>' + S.delivered + '</span></div>';
    body += '<div class="ctl"><span>CAMPAIGN TOTAL</span><span>' + S.campaign + '</span></div>';
    D.rsBody.innerHTML = body;
    D.rsBtn.textContent = 'RETRY LEVEL ' + (S.level+1) + ' (R)';
    S.lastResult = 'RETRY';
    setPhase('RESULT');
  }

  function advance(){
    if (S.lastResult === 'ADVANCE'){ S.level++; showBriefing(); }
    else if (S.lastResult === 'CAMPAIGN'){ S.level = 0; S.campaign = 0; S.banked = []; S.firstRun = true; showBriefing(); }
    else startLevel();
  }

  // ---- HUD ---------------------------------------------------------------
  function drawHUD(){
    D.propVal.textContent = Math.round(S.ship.prop)+'%';
    D.propFill.style.width = clamp(S.ship.prop,0,100)+'%';
    D.propFill.classList.toggle('low', S.ship.prop < 25);
    D.hullVal.textContent = Math.round(S.ship.hull)+'%';
    D.hullFill.style.width = clamp(S.ship.hull,0,100)+'%';
    D.hullFill.classList.toggle('low', S.ship.hull < 40);

    var html = '';
    for (var i=0;i<S.podsMax;i++) html += '<div class="pod'+(i < S.pods ? '' : ' spent')+'"></div>';
    D.pods.innerHTML = html;

    D.lvlTag.textContent = S.phase === 'FLIGHT'
      ? 'LEVEL ' + (S.level+1) + ' — DELIVERED ' + S.delivered + ' / ' + LEVELS[S.level].targets
      : '';

    D.beat.hidden = !(S.beat.t > 0);
    if (S.beat.t > 0) D.beat.textContent = S.beat.text;

    D.btnA.classList.toggle('held', IN.a);
    var bReady = (S.dockReady && S.tow.length) || S.hookSolution;
    D.btnB.classList.toggle('ready', !!bReady);
    D.btnB.querySelector('.cap').textContent = (S.dockReady && S.tow.length) ? 'DROP' : 'HOOK';

    if (S.phase !== 'FLIGHT'){ D.readout.innerHTML = ''; return; }

    var sh = S.ship, lines = [];
    if (S.tow.length){
      lines.push('<span class="obj">IN TOW</span> <span class="val">' + S.tow.length + '</span>' +
                 ' <span class="obj">MASS</span> <span class="val">' + towedMass().toFixed(1) + '</span>' +
                 ' <span class="obj">THRUST</span> <span class="val">' + Math.round(100*accelNow()/K.thrustAcc) + '%</span>');
    }
    if (S.inDock){
      if (S.tow.length && !S.dockReady){
        lines.push('<span class="warn">DOCK ZONE — SLOW BELOW 60 TO DROP</span>');
      } else if (S.tow.length){
        lines.push('<span class="cue">AT DOCK — B TO DROP ' + S.tow.length + '</span>');
        lines.push(S.pods > 0
          ? '<span class="obj">COSTS 1 POD — REFILLS TANK</span>'
          : '<span class="warn">NO PODS LEFT — NO REFUEL</span>');
      } else {
        lines.push('<span class="cue">AT DOCK — X TO DEPART</span>');
      }
    } else {
      var dHome = Math.round(dist(sh.x,sh.y,STATION.x,STATION.y));
      lines.push('<span class="obj">RECLAIMER</span> <span class="val">' + dHome + 'M</span>');
      var near = nearestPending();
      if (near && near.d < K.matchRange){
        var rv = Math.hypot(sh.vx-near.t.vx, sh.vy-near.t.vy);
        lines.push('<span class="obj">' + near.t.cls + ' ' + near.t.type + '</span> ' +
                   '<span class="obj">REL V</span> <span class="' + (rv<K.hookVrel?'cue':'warn') + '">' + Math.round(rv) + '</span>' +
                   ' <span class="obj">/' + K.hookVrel + '</span>');
        if (S.hookSolution) lines.push('<span class="cue">CAPTURE SOLUTION — B TO HOOK</span>');
        else if (rv >= K.hookVrel) lines.push('<span class="obj">HOLD A TO MATCH VELOCITY</span>');
      }
      if (S.ship.prop < 22) lines.push('<span class="warn">LOW TANK — GET HOME</span>');
    }
    if (S.atLimit) lines.push('<span class="warn">OPERATING AREA LIMIT</span>');
    D.readout.innerHTML = lines.join('<br>');
  }

  // ---- render ------------------------------------------------------------
  var stars = [];
  function seedStars(){
    stars = [];
    for (var i=0;i<260;i++) stars.push({ x:Math.random()*WORLD.w, y:Math.random()*WORLD.h, r:rand(0.4,1.5), l:rand(0.25,0.8) });
  }
  seedStars();

  function resize(){
    var dpr = Math.min(window.devicePixelRatio||1, 2);
    cv.width = window.innerWidth*dpr; cv.height = window.innerHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  function render(){
    var w = window.innerWidth, h = window.innerHeight;
    ctx.fillStyle = C.void; ctx.fillRect(0,0,w,h);
    var camx = S.ship.x - w/2, camy = S.ship.y - h/2;
    ctx.save(); ctx.translate(-camx,-camy);

    for (var i=0;i<stars.length;i++){
      var s = stars[i];
      ctx.globalAlpha = s.l; ctx.fillStyle = C.bone;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(138,86,38,0.32)'; ctx.lineWidth = 2; ctx.setLineDash([12,10]);
    ctx.strokeRect(40,40,WORLD.w-80,WORLD.h-80); ctx.setLineDash([]);

    drawStation();
    for (var j=0;j<S.targets.length;j++) if (S.targets[j].status === 'PENDING') drawSalvage(S.targets[j]);
    drawTowChain();
    drawShip();
    ctx.restore();

    drawEdgeArrow(w,h,camx,camy);
    drawRadar(w,h);
  }

  function drawStation(){
    ctx.save();
    ctx.strokeStyle = 'rgba(79,184,166,0.22)'; ctx.lineWidth = 1.5; ctx.setLineDash([8,8]);
    ctx.beginPath(); ctx.arc(STATION.x,STATION.y,STATION.dock,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = C.patina; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(STATION.x,STATION.y,STATION.r,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(STATION.x,STATION.y,STATION.r*0.5,0,Math.PI*2); ctx.stroke();
    for (var a=0;a<8;a++){
      var an = a*Math.PI/4 + S.t*0.05;
      ctx.beginPath();
      ctx.moveTo(STATION.x+Math.cos(an)*STATION.r*0.5, STATION.y+Math.sin(an)*STATION.r*0.5);
      ctx.lineTo(STATION.x+Math.cos(an)*STATION.r, STATION.y+Math.sin(an)*STATION.r);
      ctx.stroke();
    }
    ctx.fillStyle = C.patina; ctx.font = '11px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText('RECLAIMER', STATION.x, STATION.y - STATION.r - 14);
    ctx.font = '9px "Courier New", monospace'; ctx.fillStyle = C.copperDim;
    ctx.fillText('PODS ' + S.pods + '/' + S.podsMax, STATION.x, STATION.y + STATION.r + 20);
    ctx.restore();
  }

  function drawSalvage(t){
    ctx.save();
    ctx.translate(t.x,t.y); ctx.rotate(t.ang);
    ctx.strokeStyle = C.copper; ctx.lineWidth = 2;
    ctx.strokeRect(-t.r*0.55,-t.r*0.55,t.r*1.1,t.r*1.1);
    ctx.beginPath();
    ctx.moveTo(-t.r*0.55,0); ctx.lineTo(-t.r*1.3,0);
    ctx.moveTo(t.r*0.55,0); ctx.lineTo(t.r*1.3,0);
    ctx.stroke();
    if (t.cls === 'HEAVY'){
      ctx.beginPath(); ctx.moveTo(-t.r*0.3,-t.r*0.3); ctx.lineTo(t.r*0.3,t.r*0.3); ctx.stroke();
    }
    ctx.restore();
  }

  function drawTowChain(){
    if (!S.tow.length) return;
    ctx.save();
    ctx.strokeStyle = C.copper; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.5;
    var px = S.ship.x, py = S.ship.y;
    for (var i=0;i<S.tow.length;i++){
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(S.tow[i].x,S.tow[i].y); ctx.stroke();
      px = S.tow[i].x; py = S.tow[i].y;
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    for (var j=0;j<S.tow.length;j++){
      var t = S.tow[j];
      ctx.save();
      ctx.translate(t.x,t.y); ctx.rotate(t.ang);
      ctx.strokeStyle = C.patina; ctx.lineWidth = 2;
      ctx.strokeRect(-t.r*0.55,-t.r*0.55,t.r*1.1,t.r*1.1);
      ctx.restore();
    }
  }

  function drawShip(){
    var sh = S.ship;
    ctx.save();
    ctx.translate(sh.x,sh.y); ctx.rotate(sh.angle);
    var thrusting = Math.hypot(IN.tx,IN.ty) > 0.04 && sh.prop > 0 && S.phase === 'FLIGHT';
    if (thrusting){
      ctx.fillStyle = C.hazard; ctx.globalAlpha = 0.75;
      ctx.beginPath(); ctx.moveTo(-11,-5); ctx.lineTo(-11,5); ctx.lineTo(-11-rand(9,19),0);
      ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = IN.a ? C.patina : C.copper; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(-11,-9); ctx.lineTo(-6,0); ctx.lineTo(-11,9);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2,-9); ctx.lineTo(2,-15); ctx.moveTo(2,9); ctx.lineTo(2,15); ctx.stroke();
    ctx.restore();

    if (S.phase === 'FLIGHT'){
      var near = nearestPending();
      if (near && near.d < K.matchRange){
        ctx.save();
        ctx.strokeStyle = S.hookSolution ? C.patina : 'rgba(138,86,38,0.55)';
        ctx.lineWidth = S.hookSolution ? 2 : 1;
        ctx.setLineDash(S.hookSolution ? [] : [4,6]);
        ctx.beginPath(); ctx.arc(sh.x,sh.y,K.hookRange,0,Math.PI*2); ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawEdgeArrow(w,h,camx,camy){
    if (S.phase !== 'FLIGHT') return;
    var sx = STATION.x - camx, sy = STATION.y - camy, m = 54;
    if (sx > m && sx < w-m && sy > m && sy < h-m) return;
    var cx = w/2, cy = h/2, ang = Math.atan2(sy-cy, sx-cx);
    var px = cx + Math.cos(ang)*(Math.min(w,h)/2 - m);
    var py = cy + Math.sin(ang)*(Math.min(w,h)/2 - m);
    ctx.save(); ctx.translate(px,py); ctx.rotate(ang);
    ctx.fillStyle = C.patina;
    ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(-8,-7); ctx.lineTo(-8,7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawRadar(w,h){
    if (S.phase !== 'FLIGHT') return;
    var size = 84, x = w - size - 16, y = 96;
    ctx.save();
    ctx.fillStyle = 'rgba(10,14,22,0.6)'; ctx.fillRect(x,y,size,size);
    ctx.strokeStyle = 'rgba(138,86,38,0.7)'; ctx.lineWidth = 1; ctx.strokeRect(x,y,size,size);
    function px(v){ return x + (v/WORLD.w)*size; }
    function py(v){ return y + (v/WORLD.h)*size; }
    ctx.fillStyle = C.patina; ctx.fillRect(px(STATION.x)-2.5, py(STATION.y)-2.5, 5, 5);
    ctx.fillStyle = 'rgba(201,123,61,0.85)';
    for (var i=0;i<S.targets.length;i++){
      var t = S.targets[i];
      if (t.status !== 'PENDING') continue;
      ctx.fillRect(px(t.x)-1, py(t.y)-1, 2, 2);
    }
    ctx.fillStyle = C.bone;
    ctx.beginPath(); ctx.arc(px(S.ship.x), py(S.ship.y), 2.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ---- input -------------------------------------------------------------
  var keys = {};
  window.addEventListener('keydown', function(e){
    if (!keys[e.code]){
      keys[e.code] = true;
      if (e.code === 'KeyK'){
        if (S.phase === 'BRIEFING') startLevel();
        else if (S.phase === 'FLIGHT') IN.bEdge = true;
      }
      if (e.code === 'KeyX' && S.phase === 'FLIGHT') IN.depart = true;
      if (e.code === 'KeyR' && S.phase === 'RESULT') advance();
      if (e.code === 'Enter' && S.phase === 'BRIEFING') startLevel();
      if (e.code === 'Escape' && (S.phase === 'FLIGHT' || S.phase === 'DEPLOY')) togglePause(!S.paused);
    }
    syncKeys();
  });
  window.addEventListener('keyup', function(e){ keys[e.code] = false; syncKeys(); });
  function syncKeys(){
    IN.keyX = ((keys.KeyD||keys.ArrowRight)?1:0) - ((keys.KeyA||keys.ArrowLeft)?1:0);
    IN.keyY = ((keys.KeyS||keys.ArrowDown)?1:0) - ((keys.KeyW||keys.ArrowUp)?1:0);
    IN.keyA = !!(keys.Space || keys.KeyJ);
  }
  syncKeys();

  var prevGpB = false, prevGpX = false;
  function combine(){
    var gx=0, gy=0, ga=false, gb=false, gxb=false;
    var pads = (navigator.getGamepads && navigator.getGamepads()) || [];
    for (var i=0;i<pads.length;i++){
      var gp = pads[i]; if (!gp) continue;
      var dz = function(v){ return Math.abs(v) < 0.18 ? 0 : v; };
      if (gp.axes && gp.axes.length >= 2){ gx = dz(gp.axes[0]); gy = dz(gp.axes[1]); }
      if (gp.buttons){
        ga = !!(gp.buttons[0] && gp.buttons[0].pressed);
        gb = !!(gp.buttons[1] && gp.buttons[1].pressed);
        gxb = !!(gp.buttons[2] && gp.buttons[2].pressed);
      }
      break;
    }
    IN.tx = clamp((IN.touchX||0) + (IN.keyX||0) + gx, -1, 1);
    IN.ty = clamp((IN.touchY||0) + (IN.keyY||0) + gy, -1, 1);
    IN.a = !!(IN.touchA || IN.keyA || ga);
    if (gb && !prevGpB && S.phase === 'FLIGHT') IN.bEdge = true;
    prevGpB = gb;
    if (gxb && !prevGpX && S.phase === 'FLIGHT') IN.depart = true;
    prevGpX = gxb;
  }

  (function(){
    var el = D.pad, thumb = el.querySelector('.thumb'), id = null, radius = 46;
    function move(cx0,cy0){
      var r = el.getBoundingClientRect();
      var cx = r.left + r.width/2, cy = r.top + r.height/2;
      var dx = cx0-cx, dy = cy0-cy, d = Math.hypot(dx,dy);
      var vx = dx, vy = dy;
      if (d > radius){ vx = dx/d*radius; vy = dy/d*radius; }
      thumb.style.transform = 'translate('+vx+'px,'+vy+'px)';
      IN.touchX = clamp(dx/radius,-1,1); IN.touchY = clamp(dy/radius,-1,1);
    }
    function reset(){ thumb.style.transform='translate(0,0)'; el.classList.remove('active'); IN.touchX=0; IN.touchY=0; }
    el.addEventListener('pointerdown', function(e){ id=e.pointerId; el.classList.add('active'); el.setPointerCapture(id); move(e.clientX,e.clientY); });
    el.addEventListener('pointermove', function(e){ if (e.pointerId===id) move(e.clientX,e.clientY); });
    function end(e){ if (e.pointerId!==id) return; id=null; reset(); }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  })();

  (function(){
    var el = D.btnA, id = null;
    el.addEventListener('pointerdown', function(e){ id=e.pointerId; el.setPointerCapture(id); IN.touchA = true; });
    function end(e){ if (e.pointerId!==id) return; id=null; IN.touchA = false; }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  })();

  D.btnB.addEventListener('pointerdown', function(e){ e.preventDefault(); if (S.phase === 'FLIGHT') IN.bEdge = true; });
  D.departBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); if (S.phase === 'FLIGHT') IN.depart = true; });

  function clearInputs(){
    IN.touchX=0; IN.touchY=0; IN.touchA=false; IN.keyX=0; IN.keyY=0; IN.keyA=false;
    IN.a=false; IN.bEdge=false; IN.depart=false; keys = {};
    D.pad.classList.remove('active');
    D.pad.querySelector('.thumb').style.transform = 'translate(0,0)';
  }
  function togglePause(p){ S.paused = p; D.paused.hidden = !p; if (p) clearInputs(); }
  window.addEventListener('blur', function(){ clearInputs(); if (S.phase==='FLIGHT'||S.phase==='DEPLOY') togglePause(true); });
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ clearInputs(); if (S.phase==='FLIGHT'||S.phase==='DEPLOY') togglePause(true); }
  });

  D.brBtn.addEventListener('click', startLevel);
  D.rsBtn.addEventListener('click', advance);
  D.resumeBtn.addEventListener('click', function(){ togglePause(false); });

  var last = 0;
  function frame(ts){
    var dt = Math.min((ts-last)/1000, 0.05); last = ts;
    if (!S.paused){ combine(); update(dt||0); }
    render(); drawHUD();
    requestAnimationFrame(frame);
  }

  buildLevel(0);
  seedStars();
  showBriefing();
  requestAnimationFrame(frame);

  if (/[?&]test=1/.test(location.search)){
    window.RCL = { S:S, IN:IN, K:K, LEVELS:LEVELS, WORLD:WORLD, STATION:STATION,
                   nearestPending:nearestPending, towedMass:towedMass, accelNow:accelNow,
                   startLevel:startLevel, showBriefing:showBriefing, advance:advance, BUILD_ID:BUILD_ID };
  }
})();
</script>
</body>
</html>
