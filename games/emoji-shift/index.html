<main class="cabinet">

  <nav class="mode-tabs" aria-label="Game modes"><button data-mode="campaign" class="active">CAMPAIGN <small>30 RUNS</small></button><button data-mode="daily">DAILY SHIFT <small>NEW EVERY DAY</small></button><button data-mode="free">FREE PLAY <small>NO MOVE LIMIT</small></button></nav>
