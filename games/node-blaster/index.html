function card(eyebrow,title,body){return `<article class="card"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${body}</article>`;}
function stats(list){return `<div class="statgrid">${list.map(([v,l])=>`<div><b>${v}</b><small>${l}</small></div>`).join('')}</div>`;}
function drawScreen(){document.body.classList.toggle('ingame',!!game.run&&game.state!=='title');document.body.classList.toggle('reducedMotion',!settings.motion);const r=game.run,z=r?ZONES[r.zone]:ZONES[0];let html='';
 if(screen==='title'){document.body.classList.remove('ingame');html=`<div class="hero"><div><div class="brandline"><i class="brandicon"></i><span class="eyebrow">SKAB DIGITAL REALITY / ARCADE</span></div><h1>NODE<span>BLASTER</span></h1><div class="subtitle">C O R E &nbsp; B R E A C H</div><p class="lead">One drone. Five hostile systems.<br>Cut through the defenses. Take down the core.<br>Then see how far your signal holds.</p><div class="actions">${button(checkpoint?'Continue run →':'Breach the core →',checkpoint?'continue':'mode','primary')}${checkpoint?button('New run','mode','ghost'):button('How to play','help','ghost')}</div><div class="actions">${button('Settings','settings','ghost')}${button('Records','records','ghost')}${checkpoint?button('How to play','help','ghost'):''}</div><div class="fine">${checkpoint?escapeHTML(checkpoint.label)+' · '+checkpoint.run.mode.toUpperCase()+'<br>':''}AUTO-FIRE / HUMAN CONTROL<br>KEYBOARD · TOUCH · CONTROLLER ${corrupt?'<br>Checkpoint unavailable. Your records are intact.':''}${!storageOK?'<br>Storage unavailable — this session will not persist.':''}</div></div><div class="heroArt"><div class="caption">01 / INGRESS → 05 / CORE BREACH<br>FIVE GUARDIANS. NO SAFE WAY THROUGH.</div></div></div><div class="footerline"><span>ORIGINAL ARCADE SYSTEM / NB—01</span><span>PROTOTYPE ${VERSION} / SKAB DIGITAL REALITY</span></div>`;}
 if(screen==='mode'){html=card('NEW CIRCUIT','Choose your pressure.',`<p>Standard is the intended challenge. Assist reduces incoming damage by 40%, slows hostile bolts by 20%, and extends beam and field warnings. Records are separate.</p><label class="microlabel">RUN SEED — OPTIONAL<input class="seed" id="seedInput" maxlength="10" inputmode="numeric" placeholder="Leave blank for a new route seed"></label><div class="actions">${button('Standard →','start-standard','primary')}${button('Assist →','start-assist')}${button('Back','title','ghost')}</div><p class="fine">A complete circuit contains five zones. Checkpoints save at zone boundaries. Completing a circuit unlocks the choice to finish or continue.</p>`);}
 if(screen==='paused'){html=card('CIRCUIT '+r.circuit+' / '+r.mode.toUpperCase(),'Signal on hold.',`<p>${z.name} · ${duration(r.time)} elapsed · Seed ${r.seed}</p>${stats([[number(r.score),'SCORE'],[Math.ceil(game.p.hp),'INTEGRITY'],['×'+r.bestCombo,'BEST MULTIPLIER']])}${tags()}<div class="actions">${button('Resume →','resume','primary')}${button('Settings','settings')}${button('Restart run','restart','ghost danger')}${button('Title','leave','ghost')}</div><p class="fine">Checkpoint: ${escapeHTML(checkpoint?.label||'Unavailable')}. Returning to title keeps this checkpoint; current zone progress is not saved.</p>`);}
 if(screen==='settings'){html=card('CONSOLE SETTINGS','Make it yours.',`<div class="setting"><label for="volume-master">Master volume</label><input id="volume-master" type="range" min="0" max="100" value="${settings.master*100}" data-setting="master"></div><div class="setting"><label for="volume-music">Music<small>Cold Circuit / original procedural score</small></label><input id="volume-music" type="range" min="0" max="100" value="${settings.music*100}" data-setting="music"></div><div class="setting"><label for="volume-effects">Sound effects</label><input id="volume-effects" type="range" min="0" max="100" value="${settings.effects*100}" data-setting="effects"></div><div class="setting"><span>Screen motion<small>Shake and decorative movement</small></span>${button(settings.motion?'On':'Reduced','motion')}</div><div class="setting"><span>Effects quality<small>Low reduces decoration and render resolution</small></span>${button(settings.quality==='high'?'High':'Low','quality')}</div><div class="setting"><span>Touch controls</span>${button(settings.touch.toUpperCase(),'touch')}</div><div class="actions">${button('Done','settings-back','primary')}${button('Test audio','audio-test')}${installPrompt?button('Install','install'):''}${updateReady?button('Apply update','update'):''}</div><div id="installState">${audio.fault?'Audio could not start in this browser.':worker?'Offline package registered. Updates apply between runs.':document.querySelector('meta[name="nb-pwa"]')?'Offline support requires HTTPS or localhost.':'Single-file edition. Use the installation package for offline home-screen installation.'}</div>`);}
 if(screen==='help'){html=card('FLIGHT MANUAL','Move. Read. Commit.',`<div class="helpgrid"><div><b>Move / aim</b><p>WASD or arrows. Left thumbstick on touch or controller. Your weapon aims and fires automatically at visible targets with a clear line of sight.</p></div><div><b>Pulse</b><p>Space, Z, controller south button, or PULSE. Blasts nearby threats and clears projectiles. Amber diamonds restore a charge.</p></div><div><b>Dash / shield</b><p>Shift, X, controller east button, or DASH. Move first to choose direction. You cannot pass through walls. The ring shows your protection.</p></div><div><b>Read the threat</b><p>Amber lines warn of beams and charges. Violet circles warn of hazard fields. Support diamonds shield nearby targets. Break the links.</p></div><div><b>Score</b><p>Chain kills within 8 seconds. Every 4 kills increases your multiplier, up to ×5. Damage or an expired chain resets it. Close calls earn bonus points.</p></div><div><b>Checkpoints</b><p>Automatic saves at zone boundaries and after upgrades. Continue starts at your saved boundary. Pause with Esc, P, or controller Start. In menus, use the D-pad / stick, south to select, east to go back.</p></div></div><div class="actions">${button('Back','help-back','primary')}${button('Practice controls','practice','ghost')}</div>`);}
 if(screen==='records'){html=card('PERSONAL RECORDS','Your signal carries.',['standard','assist'].map(mode=>`<div class="eyebrow" style="margin-top:24px">${mode.toUpperCase()}</div>${stats([[number(records[mode].score),'BEST SCORE'],[records[mode].circuit,'CIRCUITS CLEARED'],[number(records[mode].distance),'DISTANCE'],['×'+records[mode].combo,'BEST MULTIPLIER']])}`).join('')+`<div class="actions">${button('Back','title','primary')}</div>`);}
 if(screen==='confirm'){const content=confirmAction==='leave'?['Return to title?','You will keep your last checkpoint. Progress since that boundary will be lost.']:confirmAction==='update'?['Apply the new version?','The current tab will reload. Your saved boundary and records are retained.']:['Start a fresh run?','This replaces your resumable checkpoint. Personal records are kept.'];html=card('CONFIRM',content[0],`<p>${content[1]}</p><div class="actions">${button('Confirm','confirmed','primary')}${button('Cancel','cancel','ghost')}</div>`);}
 if(screen==='zoneclear'){const s=game.zoneSummary||{time:r.zoneTime,hits:r.zoneHits,kills:r.zoneKills,score:0};html=card('ZONE '+String(r.zone+1).padStart(2,'0')+' / GUARDIAN OFFLINE',r.zone===4?'Core breached.':z.name+' restored.',`<p>${z.boss} is offline. ${r.zone===4?'Your first decision is your next upgrade. Then choose whether to extract or face another circuit.':'The uplink is secure. Select a new module before entering '+ZONES[r.zone+1].name+'.'}</p>${stats([[duration(s.time),'ZONE TIME'],[s.hits,'HITS TAKEN'],[s.kills,'THREATS CLEARED'],[number(s.score),'ZONE SCORE'],['×'+r.bestCombo,'BEST MULTIPLIER'],[Math.ceil(game.p.hp),'INTEGRITY']])}<div class="actions">${button('Choose a module →','upgrades','primary')}</div><p class="fine">${storageOK?'Checkpoint saved at this decision.':'Storage is unavailable; keep this tab open.'}</p>`);}
 if(screen==='upgrade'){html=card('SYSTEM EXPANSION / CHOOSE ONE','Change your approach.',`<p>Modules persist for this run. Future circuits keep your build.</p><div class="upgradegrid">${r.offers.map(id=>{const u=UPGRADES.find(v=>v.id===id)||{id,name:{supplyRepair:'Full repair',supplyPulse:'Full capacitor',supplyScore:'Score cache'}[id],cat:'SUPPLY',text:{supplyRepair:'Restore all integrity.',supplyPulse:'Refill all pulse charges.',supplyScore:'Collect 1,000 points.'}[id],max:1};return `<button class="upgrade" data-action="choose" data-id="${id}"><span class="eyebrow">${u.cat}</span><b>${u.name}</b><p>${u.text}</p><em>${UPGRADES.includes(u)?'RANK '+(game.rank(id)+1)+' / '+u.max:'INSTANT'}</em></button>`;}).join('')}</div>${tags()}`);}
 if(screen==='circuitclear'){html=card('CIRCUIT '+r.completed+' COMPLETE','The core is yours.',`<p>Extract with your accomplishments, or carry your build into a harder circuit. Enemy combinations change; health and attack speed increases are capped.</p>${stats([[number(r.score),'SCORE'],[duration(r.time),'RUN TIME'],[r.bosses,'GUARDIANS']])}${tags()}<div class="actions">${button('Extract / finish run','extract','primary')}${button('Continue circuit '+(r.circuit+1)+' →','endless')}</div>`);}
 if(screen==='gameover'||screen==='victory'){const win=screen==='victory';const record=records[r.mode].score;html=card(win?'EXTRACTION CONFIRMED':'SIGNAL LOST',win?'You broke the system.':'One more breach.',`<p>${win?'Circuit secured. Your records are saved.':'Cause: <strong>'+escapeHTML(r.lastDamage||'Signal integrity depleted')+'</strong>'} · ${r.mode.toUpperCase()}</p>${stats([[number(r.score),'FINAL SCORE'],[r.completed,'CIRCUITS CLEARED'],[String(r.zone+1).padStart(2,'0')+' / 05','ZONE REACHED'],[duration(r.time),'RUN TIME'],[r.kills,'THREATS CLEARED'],[r.bosses,'GUARDIANS'],[number(r.distance),'DISTANCE'],['×'+r.bestCombo,'BEST MULTIPLIER'],[r.near,'CLOSE CALLS']])}<div class="callout">${r.score>=record?'PERSONAL BEST':'BEST '+number(record)} / SEED ${r.seed}</div>${tags()}<div class="damageList">${Object.keys(r.damage).length?'DAMAGE / '+Object.entries(r.damage).map(([k,v])=>escapeHTML(k)+': '+v).join(' · '):'DAMAGE / Clean signal'}</div><div class="actions">${button('Retry same seed →','retry','primary')}${button('New seed','mode')}${button('Title','title','ghost')}<a href="https://skabkleveta-creator.github.io/skab-digital-reality-arcade/" target="_blank" rel="noopener" style="padding:15px;font-size:12px">Arcade ↗</a></div>`);}
 $('overlay').innerHTML=html;$('overlay').scrollTop=0;menuIndex=0;menuNav=0;
}
async function begin(mode,seed,tutorial){await audio.unlock();audio.step=0;game.start(mode,seed,tutorial);audio.play();last=performance.now();acc=0;}
function seedValue(){const v=$('seedInput')?.value.trim();return v&&/^\d{1,10}$/.test(v)?Number(v)>>>0:Date.now()>>>0;}
let pendingMode='standard',pendingSeed=0,pendingTutorial=false;
function startRequest(mode,tutorial){pendingMode=mode;pendingSeed=seedValue();pendingTutorial=tutorial??!read('onboarded',false);if(checkpoint){confirmAction='new';returnScreen=screen;setScreen('confirm');}else begin(mode,pendingSeed,pendingTutorial);}
$('overlay').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;await audio.unlock();audio.event('confirm');const act=b.dataset.action;
 switch(act){case'mode':setScreen('mode');break;case'start-standard':startRequest('standard');break;case'start-assist':startRequest('assist');break;case'continue':if(checkpoint&&game.restore(checkpoint)){screen=game.state;drawScreen();}break;case'resume':game.resume();audio.play();break;case'title':game.state='title';game.run=null;audio.active=false;setScreen('title');break;case'settings':returnScreen=screen;setScreen('settings');break;case'settings-back':setScreen(returnScreen);if(game.state==='playing')audio.play();break;case'motion':settings.motion=!settings.motion;write('settings',settings);drawScreen();break;case'quality':settings.quality=settings.quality==='high'?'low':'high';write('settings',settings);resize(false);drawScreen();break;case'touch':settings.touch=settings.touch==='auto'?'on':settings.touch==='on'?'off':'auto';write('settings',settings);resize(false);drawScreen();break;case'audio-test':audio.active=true;audio.level=1;audio.event('pickup');setTimeout(()=>{if(game.state!=='playing')audio.active=false;},8000);break;case'help':returnScreen=screen;setScreen('help');break;case'help-back':setScreen(returnScreen);break;case'practice':startRequest('assist',true);break;case'records':setScreen('records');break;case'restart':confirmAction='restart';returnScreen=screen;setScreen('confirm');break;case'leave':confirmAction='leave';returnScreen=screen;setScreen('confirm');break;case'cancel':setScreen(returnScreen);audio.event('cancel');break;case'confirmed':if(confirmAction==='leave'){game.state='title';game.run=null;setScreen('title');}else if(confirmAction==='update'){worker?.waiting?.postMessage({type:'ACTIVATE_UPDATE'});}else if(confirmAction==='restart'){begin(game.run.mode,game.run.seed,false);}else begin(pendingMode,pendingSeed,pendingTutorial);break;case'upgrades':game.setState('upgrade');break;case'choose':game.selectUpgrade(b.dataset.id);break;case'endless':game.continueCircuit();break;case'extract':game.endRun();break;case'retry':begin(game.run.mode,game.run.seed,false);break;case'install':if(installPrompt){await installPrompt.prompt();installPrompt=null;drawScreen();}break;case'update':confirmAction='update';returnScreen=screen;setScreen('confirm');break;}
});
$('overlay').addEventListener('input',e=>{const k=e.target.dataset.setting;if(k){settings[k]=Number(e.target.value)/100;audio.apply();write('settings',settings);}});
function pause(){if(game.state==='playing'){game.pause();audio.stop();}clearInput();}
$('pauseButton').addEventListener('click',pause);
function resize(interrupt=true){touch=settings.touch==='on'||(settings.touch==='auto'&&(navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches));document.body.classList.toggle('touch',touch);renderer.resize(innerWidth,innerHeight,devicePixelRatio||1,touch);if(interrupt)pause();}
window.addEventListener('resize',()=>resize());window.addEventListener('orientationchange',()=>{pause();resize(false);});window.addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();audio.stop();}else{last=performance.now();acc=0;}});window.addEventListener('pagehide',()=>{pause();audio.stop();});window.addEventListener('gamepaddisconnected',pause);
const mapped=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyZ','KeyX','ShiftLeft','ShiftRight','KeyP','Escape']);
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(!mapped.has(e.code))return;e.preventDefault();if(e.repeat)return;if(e.code==='Escape'||e.code==='KeyP'){if(game.state==='playing')pause();else if(game.state==='paused'&&screen==='paused'){audio.unlock().then(()=>{game.resume();audio.play();});}return;}if(game.state!=='playing'||screen)return;keys.add(e.code);if(['Space','KeyZ'].includes(e.code))pending.pulse=true;if(['KeyX','ShiftLeft','ShiftRight'].includes(e.code))pending.dash=true;});window.addEventListener('keyup',e=>{keys.delete(e.code);});
function setStick(e){const r=$('stick').getBoundingClientRect(),max=r.width*.34;let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y);if(l>max){x=x/l*max;y=y/l*max;}stickAxis={x:x/max,y:y/max};if(Math.hypot(stickAxis.x,stickAxis.y)<.1)stickAxis={x:0,y:0};$('knob').style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;}
$('stick').addEventListener('pointerdown',e=>{if(game.state!=='playing'||stickPointer!==null)return;e.preventDefault();stickPointer=e.pointerId;try{$('stick').setPointerCapture(e.pointerId);}catch{}setStick(e);});$('stick').addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();setStick(e);}});
function release(e){if(e.pointerId===stickPointer){stickPointer=null;stickAxis={x:0,y:0};$('knob').style.transform='translate(-50%,-50%)';}const action=buttons.get(e.pointerId);buttons.delete(e.pointerId);if(action&&!Array.from(buttons.values()).includes(action))$(action+'Button').classList.remove('down');}
for(const type of ['pointerup','pointercancel','lostpointercapture']){window.addEventListener(type,release,{capture:true});$('stick').addEventListener(type,release);}
for(const action of ['pulse','dash']){const el=$(action+'Button');el.addEventListener('pointerdown',e=>{if(game.state!=='playing')return;e.preventDefault();buttons.set(e.pointerId,action);pending[action]=true;el.classList.add('down');try{el.setPointerCapture(e.pointerId);}catch{}});for(const t of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(t,release);}
$('tutorial').addEventListener('click',e=>{if(e.target.closest('button')){game.tutorial=-1;write('onboarded',true);$('tutorial').innerHTML='';}});
function padInput(){let pads=[];try{pads=Array.from(navigator.getGamepads?.()||[]);}catch{}const p=pads.find(Boolean);if(!p){if(hadPad){pause();hadPad=false;}return {x:0,y:0};}hadPad=true;const now={pulse:!!p.buttons[0]?.pressed,dash:!!p.buttons[1]?.pressed,start:!!p.buttons[9]?.pressed};if(!now.pulse&&!now.dash&&!now.start)padArmed=true;if(now.start&&!gpPrevious.start&&padArmed){if(game.state==='playing')pause();else if(game.state==='paused'&&screen==='paused'){audio.unlock().then(()=>{game.resume();audio.play();});}}if(screen&&padArmed){const options=Array.from($('overlay').querySelectorAll('button:not(:disabled)'));let nav=p.buttons[13]?.pressed||p.axes[1]>.55||p.buttons[15]?.pressed||p.axes[0]>.55?1:p.buttons[12]?.pressed||p.axes[1]<-.55||p.buttons[14]?.pressed||p.axes[0]<-.55?-1:0;if(nav&&nav!==menuNav&&options.length){menuIndex=(menuIndex+nav+options.length)%options.length;options[menuIndex].focus();options[menuIndex].scrollIntoView({block:'nearest'});}menuNav=nav;if(now.pulse&&!gpPrevious.pulse)options[Math.min(menuIndex,options.length-1)]?.click();if(now.dash&&!gpPrevious.dash){const back=options.find(b=>['settings-back','help-back','cancel','title'].includes(b.dataset.action));back?.click();}}
 if(game.state==='playing'&&!screen&&padArmed){if(now.pulse&&!gpPrevious.pulse)pending.pulse=true;if(now.dash&&!gpPrevious.dash)pending.dash=true;}gpPrevious=now;return {x:Math.abs(p.axes[0]||0)>.18?p.axes[0]:(p.buttons[15]?.pressed?1:0)-(p.buttons[14]?.pressed?1:0),y:Math.abs(p.axes[1]||0)>.18?p.axes[1]:(p.buttons[13]?.pressed?1:0)-(p.buttons[12]?.pressed?1:0)};}
function updateHUD(){if(!game.run)return;let r=game.run,p=game.p,z=ZONES[r.zone];$('integrity').textContent=Math.ceil(p.hp)+' / '+game.maxHP();$('integrityFill').style.width=100*p.hp/game.maxHP()+'%';$('integrityFill').style.background=p.hp<30?'#ff947d':'#a0f1ce';$('score').textContent=String(Math.floor(r.score)).padStart(6,'0');$('combo').textContent='×'+r.combo+(r.chainClock>0?' / '+r.chainClock.toFixed(1)+'s CHAIN':' / CHAIN TO MULTIPLY');$('pulseLabel').textContent=p.pulses+(game.rank('recharge')?' · '+r.pulseProgress+'/'+(game.rank('recharge')===1?14:10):'');$('dashLabel').textContent=p.dashCd>0?p.dashCd.toFixed(1)+'s':'READY';$('pulseTouch').textContent=p.pulses+' CHARGES';$('dashTouch').textContent=p.dashCd>0?p.dashCd.toFixed(1)+'s':'READY';$('zoneLabel').textContent=String(r.zone+1).padStart(2,'0')+' / '+z.name+' · C'+r.circuit;$('notice').textContent=game.noticeT>0?game.notice:'';let active=game.encounters.find(e=>!e.done);$('objective').textContent=game.tutorial>=0?'FLIGHT CHECK / LEARN YOUR CONTROLS':game.exitOpen?'GUARDIAN OFFLINE / REACH THE UPLINK →':game.bossSpawned?'BREACH THE GUARDIAN / KEEP MOVING':active?`LINK ${active.id+1} / ${active.active?'CLEAR DEFENSES — WAVE '+active.wave+'/2':'ADVANCE TO THE NEXT FIREWALL →'}`:'APPROACH THE GUARDIAN →';let b=game.boss;$('bossHud').style.display=b&&b.hp>0?'block':'none';if(b&&b.hp>0){$('bossName').textContent=z.boss;$('bossFill').style.width=Math.max(0,b.hp/b.maxHp*100)+'%';$('bossPhase').textContent=b.type==='architect'&&game.enemies.some(a=>a.enc===9&&a.type==='support'&&a.hp>0)?'LINKED SHIELD / BREAK THE DIAMONDS':'PHASE '+b.phase+(b.wind>0?' / ATTACK INCOMING':' / READ THE PATTERN');}audio.zone=r.zone;audio.phase=b?.phase||1;audio.level=b&&b.hp>0?2:game.enemies.some(e=>e.hp>0&&game.visible(e))?1:0;
 if(lastTutorial!==game.tutorial){lastTutorial=game.tutorial;if(game.tutorial>=0){const steps=[['01 / MOVE','Use WASD, arrows, or the left thumbstick. Your weapons fire automatically.'],['02 / PULSE','Press Space or PULSE to clear nearby threats. Amber pickups restore charges.'],['03 / DASH','Move in a direction and press Shift or DASH. A short shield protects your escape.']];$('tutorial').innerHTML=`<div class="tutorial"><b>${steps[game.tutorial][0]}</b><p>${steps[game.tutorial][1]}</p><button>Skip flight check →</button></div>`;}else $('tutorial').innerHTML='';}}
function loop(now){if(!last)last=now;let elapsed=Math.min(.12,(now-last)/1000);last=now;const pad=padInput();if(game.state==='playing'&&!screen){acc+=elapsed;let count=0;while(acc>=1/60&&count++<6){const x=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+stickAxis.x+pad.x,y=(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0)+stickAxis.y+pad.y;game.setInput(x,y,pending.pulse,pending.dash);pending.pulse=pending.dash=false;game.step(1/60);acc-=1/60;}if(count>=6)acc=0;}else acc=0;
 const start=performance.now();renderer.render(now/1000);frameSamples.push(performance.now()-start);if(frameSamples.length>600)frameSamples.shift();hudClock+=elapsed;if(hudClock>.09){hudClock=0;updateHUD();}requestAnimationFrame(loop);}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});if(document.querySelector('meta[name="nb-pwa"]')&&'serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').then(reg=>{worker=reg;updateReady=!!reg.waiting;reg.addEventListener('updatefound',()=>{let ins=reg.installing;ins?.addEventListener('statechange',()=>{if(ins.state==='installed'&&navigator.serviceWorker.controller)updateReady=true;});});}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(confirmAction==='update')location.reload();});}
resize(false);drawScreen();requestAnimationFrame(loop);
// Read-only diagnostics for QA. No gameplay mutations or cheats are exposed.
window.NodeBlasterDiagnostics=()=>({version:VERSION,state:game.state,screen,seed:game.run?.seed,zone:game.run?.zone,circuit:game.run?.circuit,score:game.run?.score,hp:game.p?.hp,checkpoint:checkpoint?.label,storageOK,renderMs:frameSamples.length?frameSamples.reduce((a,b)=>a+b,0)/frameSamples.length:0,objects:{enemies:game.enemies?.length||0,shots:game.shots?.length||0,effects:game.effects?.length||0},audio:{state:audio.ctx?.state||'locked',voices:audio.voices.size}});
})();
