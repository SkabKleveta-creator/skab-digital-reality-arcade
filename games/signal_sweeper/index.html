function startGrid(save=true){currentConfig=LEVELS[currentLevel];const c=currentConfig;walls=c.walls.map(w=>({...w}));fragments=c.fragments.map((p,i)=>({id:i,x:p[0],y:p[1],taken:false,pulse:rand(0,8)}));corruption=c.corruption.map((p,i)=>({...p,id:i,maxHp:p.hp,cleared:false,alpha:1,flicker:0}));nodes=c.nodes.map((p,i)=>({...p,id:i,restored:false,ready:false,pulse:rand(0,8),ring:0}));drones=c.drones.map((p,i)=>({...p,path:p.path.map(x=>[...x]),id:i,active:false,stunned:0,angle:0,hitFlash:0,stunAwarded:false,wake:0}));Object.assign(exit,c.exit,{open:false,pulse:0});Object.assign(player,{...c.start,vx:0,vy:0,facing:0,speed:c.playerSpeed||182,integrity:100,fragments:0,nodes:0,dashTime:0,dashCooldown:0,sweepCooldown:0,invuln:0,glow:0});t=combo=comboTimer=screenShake=0;score=entryScore;stats={signal:0,clean:0,sweep:0,stun:0,node:0,bonus:0,sweeps:0,dashes:0,damage:0};particles=[];pulses=[];floatText=[];trail=[];lastDamage='';lastDamageAt=-10;lastResult=null;noticeTime=0;setState('playing');if(save)saveCheckpoint();resizeCanvas();snapCamera();refreshObjective();updateHud();notify(`${c.id} · ${c.name}`,2.2);if(save)beep(700,.12);}
function retryGrid(){startGrid();}
function pause(){if(state!=='playing')return;setState('paused');showPause();}
function showPause(){show(head('SYSTEM ON HOLD')+`<div class="eyebrow">${currentConfig.id} / ${currentConfig.name}</div><h2 id="screenTitle">Take a breath.</h2><p class="lede">Your grid is paused. Resume when you’re ready.</p><div class="metrics">${stat('Time',formatTime(t))}${stat('Integrity',`${Math.ceil(player.integrity)}%`)}${stat('Nodes',`${player.nodes}/${nodes.length}`)}${stat('Run score',fmt(score))}</div><div class="actions">${button('Resume','resume','primary')}${button('How to play','help')}${button('Settings','settings')}${button('Retry grid','confirmRetry')}${button('Main menu','home')}</div><p class="fine">Esc, P, Enter, or Tab returns to play. Leaving for the menu keeps the checkpoint at this grid’s start.</p>`);}
function help(from=state){returnState=from==='playing'?'paused':from;setState('help');show(head('FIELD MANUAL')+`<h2 id="screenTitle">Repair the signal.</h2><p class="lede">Collect signal diamonds, clear the corruption around each node, then sweep beside the node to restore it. Restore every node and reach the green exit.</p><div class="legend"><div class="stat"><strong>01 / Move & collect</strong><p>WASD, arrow keys, left thumbstick, or controller stick. Signal unlocks nodes; it is not spent.</p></div><div class="stat"><strong>02 / Sweep & restore</strong><p>Hold Space / Z, touch A, or controller A. Pulses clear orange corruption, stun drones, and restore nearby ready nodes.</p></div><div class="stat"><strong>03 / Dash to safety</strong><p>Shift / X, touch B, or controller B. Burst in your movement direction with brief protection. Release to stop repeating.</p></div><div class="stat"><strong>04 / Read the threat</strong><p>Red cones and drone contact drain integrity. Walls block scanners. Stunned drones still cause contact damage. Clean corruption and restore nodes to recover integrity.</p></div></div><div class="callout">Pressure starts rising after ${currentConfig.threatStart} seconds on the current grid. Restore all its nodes to stop the background integrity drain.</div><div class="actions">${button(returnState==='paused'?'Return to game':'Back','back','primary')}</div><p class="fine">Esc / P pauses. Tab opens or closes help. Gamepad: Start pauses/resumes, D-pad chooses menu buttons, A confirms, B goes back. Retry restores the score from this grid’s start.</p>`);}
function showSettings(from=state){returnState=from==='playing'?'paused':from;setState('settings');show(head('PREFERENCES')+`<h2 id="screenTitle">Tune your console.</h2><div class="settingsRow"><div>Sound cues<small>Short synthesized effects. No music.</small></div>${button(settings.sound?'On':'Off','sound')}</div><div class="settingsRow"><div>Motion effects<small>Screen shake, particles, and pulsing highlights.</small></div>${button(settings.motion?'On':'Reduced','motion')}</div><div class="actions">${button(returnState==='paused'?'Return to game':'Back','back','primary')}</div><p class="fine">Controls and settings are stored only in this browser.</p>`);}
function returnBack(){if(returnState==='paused'){resume();}else home();}
function resume(){if(!['paused','help','settings'].includes(state))return;setState('playing');lastTime=performance.now();accumulator=0;beep(480,.05);}
function confirmAction(type){setState('confirm');show(head('CONFIRM ACTION')+`<h2 id="screenTitle">${type==='new'?'Start a fresh campaign?':'Retry this grid?'}</h2><p class="lede">${type==='new'?'This replaces the campaign checkpoint. Your personal best stays saved.':'Current-grid progress and points reset. Scores from completed grids stay intact.'}</p><div class="actions">${button(type==='new'?'Start fresh':'Retry grid',type==='new'?'new':'retry','gold')}${button('Cancel',type==='new'?'home':'paused')}</div>`);}
function pointsRows(p){return [['Signal recovered',p.signal],['Corruption cleared',p.clean],['Partial sweeps',p.sweep],['First drone stuns',p.stun],['Nodes restored',p.node],['Integrity bonus',p.bonus]].map(([a,b])=>`<tr><td>${a}</td><td>+${fmt(b)}</td></tr>`).join('');}
function grade(r){return r.integrity>=85&&r.cleared===currentConfig.corruption.length?'PRISTINE':r.integrity>=60?'STABLE':'RECOVERED';}
function completeGrid(){if(state!=='playing')return;const bonus=Math.floor(player.integrity*(10+currentLevel*3));score+=bonus;stats.bonus=bonus;lastResult={index:currentLevel,time:t,integrity:player.integrity,fragments:player.fragments,cleared:corruption.filter(c=>c.cleared).length,score:score-entryScore,points:{signal:stats.signal,clean:stats.clean,sweep:stats.sweep,stun:stats.stun,node:stats.node,bonus},damage:stats.damage};results.push(lastResult);profile.gridBests[currentLevel]=Math.max(profile.gridBests[currentLevel],lastResult.score);if(currentLevel===4){newRecord=score>profile.bestScore;profile.bestScore=Math.max(profile.bestScore,score);const totalTime=results.reduce((n,r)=>n+r.time,0);profile.bestTime=profile.bestTime?Math.min(profile.bestTime,totalTime):totalTime;profile.checkpoint=null;}else{profile.checkpoint={index:currentLevel+1,score,results:structuredClone(results)};}persist();setState(currentLevel===4?'win':'complete');beep(980,.22);if(state==='win')return showVictory();showComplete();}
function showComplete(){const r=lastResult,n=LEVELS[currentLevel+1];show(head('GRID DEBRIEF')+`<div class="eyebrow success">${currentConfig.id} / ${grade(r)}</div><h2 id="screenTitle">${currentConfig.name}<br><span class="success">back online.</span></h2><div class="metrics">${stat('Time',formatTime(r.time))}${stat('Integrity',`${Math.ceil(r.integrity)}%`)}${stat('Signal',`${r.fragments}/${fragments.length}`)}${stat('Corruption',`${r.cleared}/${corruption.length}`)}</div><div class="split"><table class="scoreTable"><caption class="eyebrow" style="text-align:left;padding:0 0 8px">GRID SCORE BREAKDOWN</caption><tbody>${pointsRows(r.points)}</tbody><tfoot><tr><td>Grid earned</td><td>${fmt(r.score)}</td></tr></tfoot></table><div><div class="callout"><div class="eyebrow">UP NEXT / ${n.id}</div><strong>${n.name}</strong><br>${n.nodes.length} nodes · ${n.fragments.length} signal · ${n.drones.length} drones<br>Pressure rises after ${n.threatStart}s.</div>${stat('Campaign score',fmt(score),'checkpoint saved for the next grid')}</div></div><div class="actions">${button(`Next grid →`,'next','primary')}${button('Main menu','home')}</div><p class="fine">${storageOK?'Progress saved. You can continue this campaign later.':'Saving is unavailable. Continue now to keep this session’s progress.'}</p>`);}
function failGrid(){if(state!=='playing')return;player.integrity=0;setState('fail');beep(180,.2);show(head('REPAIR INTERRUPTED')+`<div class="eyebrow failure">${currentConfig.id} / ${currentConfig.name}</div><h2 id="screenTitle">Grid collapsed.</h2><p class="lede">Final damage source: <strong class="failure">${lastDamage||'integrity loss'}</strong>. Your completed grids are preserved.</p><div class="metrics">${stat('Time',formatTime(t))}${stat('Nodes',`${player.nodes}/${nodes.length}`)}${stat('Signal',`${player.fragments}/${fragments.length}`)}${stat('This attempt',fmt(score-entryScore),'points reset on retry')}</div><div class="callout">${lastDamage==='scanner beam'?'Dash across a scanner’s path or sweep to stun it. Use partitions for cover.':lastDamage==='drone contact'?'Give drones room, even when stunned. Dash past them instead of stopping against them.':lastDamage==='system pressure'?'Restore all nodes to stop the background drain. Follow the objective marker and collect only the signal you need.':'Sweep orange zones before entering. Clearing corruption and restoring nodes recover integrity.'}</div><div class="actions">${button('Retry this grid','retry','primary')}${button('Restart campaign','confirmNew')}${button('Main menu','home')}</div><p class="fine">Retry begins ${currentConfig.id} with 100% integrity and ${fmt(entryScore)} campaign points.</p>`);}
function showVictory(){const allTime=results.reduce((n,r)=>n+r.time,0);show(head('CAMPAIGN DEBRIEF')+`<div class="eyebrow success">ALL FIVE GRIDS RESTORED</div><h2 id="screenTitle">Signal recovered.<br><span class="success">System online.</span></h2><p class="lede">Five chambers stabilized. Every required node restored.</p>${newRecord?'<div class="record">NEW PERSONAL BEST</div>':''}<div class="metrics">${stat('Final score',fmt(score))}${stat('Total time',formatTime(allTime))}${stat('Signal',`${results.reduce((n,r)=>n+r.fragments,0)}/92`)}${stat('Corruption',`${results.reduce((n,r)=>n+r.cleared,0)}/${LEVELS.reduce((n,l)=>n+l.corruption.length,0)}`)}</div><table class="scoreTable"><thead><tr><th>GRID</th><th>TIME</th><th>INTEGRITY</th><th>SCORE</th></tr></thead><tbody>${results.map(r=>`<tr><td>${r.index+1} · ${LEVELS[r.index].name}</td><td>${formatTime(r.time)}</td><td>${Math.ceil(r.integrity)}%</td><td>${fmt(r.score)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Personal best</td><td>${fmt(profile.bestScore)}</td></tr></tfoot></table><div class="actions">${button('Play again','new','primary')}${button('Main menu','home')}<a class="btn" href="https://skabkleveta-creator.github.io/skab-digital-reality-arcade/" target="_blank" rel="noopener">Return to Arcade ↗</a></div><p class="fine">${storageOK?'Best score saved on this browser.':'Saving unavailable; note your score before leaving.'}</p>`);}
function act(action){switch(action){case'new':newCampaign();break;case'continue':continueCampaign();break;case'home':home();break;case'confirmNew':confirmAction('new');break;case'confirmRetry':confirmAction('retry');break;case'retry':retryGrid();break;case'next':if(state==='complete'){entryScore=score;currentLevel++;startGrid();}break;case'resume':resume();break;case'paused':setState('paused');showPause();break;case'help':help();break;case'settings':showSettings();break;case'back':returnBack();break;case'sound':settings.sound=!settings.sound;persist();showSettings(returnState);beep();break;case'motion':settings.motion=!settings.motion;persist();showSettings(returnState);break;}}
screen.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.action);});
$('pauseBtn').onclick=()=>state==='playing'?pause():state==='paused'?resume():home();$('helpBtn').onclick=()=>{if(state==='playing')help();else if(state==='home')help();};
function circleRectOverlap(cx,cy,cr,r){return dist(cx,cy,clamp(cx,r.x,r.x+r.w),clamp(cy,r.y,r.y+r.h))<cr;}
function moveWithCollision(entity,dx,dy){const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/5));for(let i=0;i<steps;i++){const nx=entity.x+dx/steps,ny=entity.y+dy/steps;if(!walls.some(w=>circleRectOverlap(nx,entity.y,entity.r,w)))entity.x=nx;if(!walls.some(w=>circleRectOverlap(entity.x,ny,entity.r,w)))entity.y=ny;entity.x=clamp(entity.x,entity.r+18,BASE_W-entity.r-18);entity.y=clamp(entity.y,entity.r+18,BASE_H-entity.r-18);}}
function rayDistance(x,y,a,max){const dx=Math.cos(a),dy=Math.sin(a);let best=max;for(const w of walls){let t0=0,t1=max;for(const [p,d,lo,hi]of [[x,dx,w.x,w.x+w.w],[y,dy,w.y,w.y+w.h]]){if(Math.abs(d)<1e-8){if(p<lo||p>hi){t1=-1;break;}}else{let a=(lo-p)/d,b=(hi-p)/d;if(a>b)[a,b]=[b,a];t0=Math.max(t0,a);t1=Math.min(t1,b);}}if(t1>=t0&&t1>=0)best=Math.min(best,Math.max(0,t0));}return best;}
function addFloat(text,x,y,color='#bff9ff'){floatText.push({text,x,y,life:1,color});if(floatText.length>30)floatText.shift();}
function spawnParticles(x,y,count,color,spread=1,speed=96){if(!settings.motion)return;count=Math.min(count,240-particles.length);for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(speed*.25,speed)*spread;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(1.4,3.2),life:rand(.35,.7),max:1,color});}}
function burstRing(x,y,color,r0=8,r1=92,life=.42){pulses.push({x,y,color,r:r0,target:r1,life,max:life});if(pulses.length>30)pulses.shift();}
function addScore(amount,label,x=player.x,y=player.y,kind='clean'){comboTimer=2.2;combo=clamp(combo+1,1,9);const v=Math.floor(amount*(1+(combo-1)*.18));score+=v;stats[kind]+=v;addFloat(`${label} +${v}`,x,y-22,combo>1?'#ffc247':'#bff9ff');}
function nodeBlocked(n){return corruption.some(c=>!c.cleared&&dist(n.x,n.y,c.x,c.y)<c.r+92);}
function doSweep(){if(player.sweepCooldown>0)return;player.sweepCooldown=currentConfig.sweepCooldown||.42;player.glow=.38;stats.sweeps++;burstRing(player.x,player.y,'#65e4e7',8,96,.42);beep(520,.045);let hit=false;for(const c of corruption){if(c.cleared||dist(player.x,player.y,c.x,c.y)>=c.r+92)continue;c.hp--;hit=true;spawnParticles(c.x,c.y,12,'#ff7c24');if(c.hp<=0){c.cleared=true;c.alpha=1;addScore(140,'CLEAN',c.x,c.y,'clean');player.integrity=clamp(player.integrity+2,0,100);}else addScore(45,'SWEEP',c.x,c.y,'sweep');}for(const d of drones){if(!d.active||dist(player.x,player.y,d.x,d.y)>=96)continue;d.stunned=2.15;d.hitFlash=.35;hit=true;if(!d.stunAwarded){d.stunAwarded=true;addScore(75,'STUN',d.x,d.y,'stun');}spawnParticles(d.x,d.y,6,'#ffc247');}for(const n of nodes){if(n.restored||dist(player.x,player.y,n.x,n.y)>=54)continue;if(player.fragments<n.requirement){notify(`Need ${n.requirement-player.fragments} more signal`,1);continue;}if(nodeBlocked(n)){notify('Clear the corruption around this node',1);continue;}n.restored=true;n.ring=1;player.nodes++;hit=true;player.integrity=clamp(player.integrity+12,0,100);addScore(450,'NODE ONLINE',n.x,n.y,'node');burstRing(n.x,n.y,'#8beaaf',18,132,.65);beep(880,.15);if(settings.motion)screenShake=.1;if(player.nodes===nodes.length){exit.open=true;notify('All nodes online. Reach the green exit.',3);beep(1080,.2);}break;}return hit;}
function dash(input){if(player.dashCooldown>0||player.dashTime>0)return;let {x,y}=input;const m=Math.hypot(x,y);if(m<.12){x=Math.cos(player.facing);y=Math.sin(player.facing);}else{x/=m;y/=m;}player.vx=x*520;player.vy=y*520;player.dashTime=.13;player.dashCooldown=currentConfig.dashCooldown||.78;player.invuln=.18;stats.dashes++;burstRing(player.x,player.y,'#ffc247',6,54,.22);beep(300,.06);}
function playerInput(){let x=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0)+touchMove.x+gpInput.x,y=(keys.has('ArrowDown')||keys.has('KeyS')?1:0)-(keys.has('ArrowUp')||keys.has('KeyW')?1:0)+touchMove.y+gpInput.y;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}return{x,y};}
function damage(amount,cause){if(amount<=0)return;player.integrity-=amount;stats.damage+=amount;lastDamage=cause;lastDamageAt=t;if(settings.motion)screenShake=Math.max(screenShake,.04);}
function inScanner(d,x,y){const dx=x-d.x,dy=y-d.y,m=Math.hypot(dx,dy),range=d.scanRange*(1+player.nodes*.05),a=Math.atan2(dy,dx);return m>=4&&m<=range&&Math.abs(angleDiff(a,d.angle))<d.scanHalf&&rayDistance(d.x,d.y,a,range)>=m-.5;}
function updateDrones(dt){for(const d of drones){if(!d.active&&player.nodes>=d.activeAt){d.active=true;d.wake=.75;notify('Correction drone activating',1.2);burstRing(d.x,d.y,'#ff788b',10,90,.45);}if(!d.active)continue;d.wake=Math.max(0,d.wake-dt);d.stunned=Math.max(0,d.stunned-dt);d.hitFlash=Math.max(0,d.hitFlash-dt);const p=d.path[d.target],dx=p[0]-d.x,dy=p[1]-d.y,m=Math.hypot(dx,dy);d.angle=Math.atan2(dy,dx);if(d.stunned<=0&&d.wake<=0){const step=Math.min(m,d.speed*(1+player.nodes*.06+Math.min(.18,t/280))*dt);if(m>0){d.x+=dx/m*step;d.y+=dy/m*step;}if(m<8)d.target=(d.target+1)%d.path.length;}if(d.wake>0||player.invuln>0)continue;if(dist(player.x,player.y,d.x,d.y)<player.r+d.r)damage(currentConfig.contactDamage*dt,'drone contact');if(d.stunned<=0&&inScanner(d,player.x,player.y))damage((currentConfig.scannerDamage+player.nodes*1.5)*dt,'scanner beam');}}
function updateEffects(dt){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.02,dt);p.vy*=Math.pow(.02,dt);p.life-=dt;}particles=particles.filter(p=>p.life>0);for(const p of pulses){p.r=lerp(p.r,p.target,1-Math.pow(.02,dt));p.life-=dt;}pulses=pulses.filter(p=>p.life>0);for(const f of floatText){f.y-=32*dt;f.life-=dt;}floatText=floatText.filter(f=>f.life>0);for(const tr of trail)tr.life-=dt;trail=trail.filter(tr=>tr.life>0);}
function update(dt){if(state!=='playing')return;t+=dt;comboTimer=Math.max(0,comboTimer-dt);if(!comboTimer)combo=0;for(const k of ['dashCooldown','dashTime','sweepCooldown','invuln','glow'])player[k]=Math.max(0,player[k]-dt);screenShake=Math.max(0,screenShake-dt);noticeTime=Math.max(0,noticeTime-dt);if(!noticeTime){$('notice').classList.remove('show');$('missionBar').classList.remove('notifying');}const input=playerInput();if(Math.hypot(input.x,input.y)>.1)player.facing=Math.atan2(input.y,input.x);if(keys.has('Space')||keys.has('KeyZ')||[...touchButtons.values()].includes('a')||gpInput.a)doSweep();if(keys.has('ShiftLeft')||keys.has('ShiftRight')||keys.has('KeyX')||[...touchButtons.values()].includes('b')||gpInput.b)dash(input);const dirty=corruption.some(c=>!c.cleared&&dist(player.x,player.y,c.x,c.y)<c.r);if(dirty&&player.invuln<=0)damage(currentConfig.corruptionDrain*dt,'corruption exposure');if(player.dashTime<=0){const slow=dirty?.58:1;player.vx=lerp(player.vx,input.x*player.speed*slow,1-Math.pow(.0008,dt));player.vy=lerp(player.vy,input.y*player.speed*slow,1-Math.pow(.0008,dt));}moveWithCollision(player,player.vx*dt,player.vy*dt);if(settings.motion){trail.push({x:player.x,y:player.y,life:.25});if(trail.length>26)trail.shift();}for(const f of fragments){if(!f.taken&&dist(player.x,player.y,f.x,f.y)<29){f.taken=true;player.fragments++;player.integrity=clamp(player.integrity+1.1,0,100);addScore(60,'SIGNAL',f.x,f.y,'signal');beep(720,.05);}}for(const c of corruption)if(c.cleared)c.alpha=Math.max(0,c.alpha-dt*1.4);for(const n of nodes){n.ring=Math.max(0,n.ring-dt*1.2);n.ready=!n.restored&&player.fragments>=n.requirement&&!nodeBlocked(n);}updateDrones(dt);const drain=Math.max(0,t-currentConfig.threatStart)*currentConfig.threatRate;if(drain>0&&player.nodes<nodes.length){damage(drain*dt,'system pressure');}updateEffects(dt);updateCamera(dt);refreshObjective();exit.pulse+=dt;if(player.integrity<=0){failGrid();return;}if(exit.open&&player.x>exit.x-10&&player.x<exit.x+exit.w+10&&player.y>exit.y-12&&player.y<exit.y+exit.h+12){completeGrid();return;}hudClock+=dt;if(hudClock>.05){updateHud();hudClock=0;}}
function targetObjective(){if(exit.open)return{x:exit.x+exit.w/2,y:exit.y+exit.h/2,label:'EXIT OPEN · Reach the green gate',hint:'All required nodes are online.'};const n=nodes.find(n=>!n.restored);if(!n)return null;if(player.fragments<n.requirement){const f=fragments.filter(f=>!f.taken).sort((a,b)=>dist(player.x,player.y,a.x,a.y)-dist(player.x,player.y,b.x,b.y))[0];return{...(f||n),label:`Collect signal · ${player.fragments}/${n.requirement}`,hint:`${n.label} needs ${n.requirement-player.fragments} more.`};}if(nodeBlocked(n)){const c=corruption.filter(c=>!c.cleared&&dist(n.x,n.y,c.x,c.y)<c.r+92).sort((a,b)=>dist(player.x,player.y,a.x,a.y)-dist(player.x,player.y,b.x,b.y))[0];return{...c,label:`Clear corruption near ${n.label}`,hint:'Hold sweep to clean the orange zones.'};}return{...n,label:`Restore ${n.label}`,hint:'Get close to the node and sweep.'};}
function refreshObjective(){const target=targetObjective();if(!target)return;const text=target.label+'|'+target.hint;if(text!==objective){objective=text;$('objective').replaceChildren();const main=document.createTextNode(target.label),sub=document.createElement('small');sub.textContent=target.hint;$('objective').append(main,sub);}}
function updateHud(){$('gridId').textContent=`GRID ${String(currentLevel+1).padStart(2,'0')} / 05`;$('gridName').textContent=currentConfig.name;$('signalValue').textContent=`${player.fragments}/${fragments.length}`;$('nodesValue').textContent=`${player.nodes}/${nodes.length}`;const hp=clamp(player.integrity,0,100);$('integrityValue').textContent=`${Math.ceil(hp)}%`;$('integrityBar').style.width=hp+'%';$('integrityBar').style.background=hp>35?'var(--green)':'var(--red)';$('integrityBar').parentElement.setAttribute('aria-valuenow',Math.ceil(hp));$('damageState').textContent=t-lastDamageAt<.8?lastDamage.toUpperCase():'INTEGRITY';$('scoreValue').textContent=String(score).padStart(6,'0');$('timeValue').textContent=`${formatTime(t)} · ${exit.open?'GRID STABLE':t>currentConfig.threatStart?'PRESSURE RISING':`PRESSURE IN ${Math.ceil(currentConfig.threatStart-t)}s`}`;$('sweepReady').textContent=player.sweepCooldown>0?'RECHARGING':'READY';$('dashReady').textContent=player.dashCooldown>0?'RECHARGING':'READY';$('abilityStatus').textContent=`SWEEP ${player.sweepCooldown>0?'RECHARGING':'READY'} · DASH ${player.dashCooldown>0?'RECHARGING':'READY'}`;}
function resizeCanvas(){const r=$('stage').getBoundingClientRect();camera.width=Math.max(1,r.width);camera.height=Math.max(1,r.height);camera.dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(camera.width*camera.dpr);canvas.height=Math.round(camera.height*camera.dpr);const mobile=matchMedia('(pointer:coarse)').matches;const scale=mobile?Math.max(camera.width/(innerWidth<600?640:900),camera.height/BASE_H):Math.min(camera.width/BASE_W,camera.height/BASE_H);camera.zoom=scale;camera.viewW=Math.min(BASE_W,camera.width/scale);camera.viewH=Math.min(BASE_H,camera.height/scale);camera.offsetX=Math.max(0,(camera.width-BASE_W*scale)/2);camera.offsetY=Math.max(0,(camera.height-BASE_H*scale)/2);$('miniMap').hidden=camera.viewW>=1000&&camera.viewH>=565;snapCamera();}
function snapCamera(){camera.x=clamp(player.x-camera.viewW/2,0,BASE_W-camera.viewW);camera.y=clamp(player.y-camera.viewH/2,0,BASE_H-camera.viewH);}

function draw(){ctx.setTransform(camera.dpr,0,0,camera.dpr,0,0);ctx.fillStyle='#030c12';ctx.fillRect(0,0,camera.width,camera.height);ctx.save();ctx.translate(camera.offsetX,camera.offsetY);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);if(settings.motion&&screenShake>0)ctx.translate(rand(-2,2),rand(-2,2));drawBackground();drawExit();drawCorruption();drawWalls();drawFragments();drawNodes();drawDrones();drawPlayer();drawEffects();drawObjectiveArrow();ctx.restore();drawMiniMap();}
function drawObjectiveArrow(){const target=targetObjective();if(!target)return;const a=Math.atan2(target.y-player.y,target.x-player.x);ctx.save();ctx.translate(player.x+Math.cos(a)*40,player.y+Math.sin(a)*40);ctx.rotate(a);ctx.fillStyle=exit.open?'#8beaaf':'#65e4e7';ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(-6,-6);ctx.lineTo(-2,0);ctx.lineTo(-6,6);ctx.fill();ctx.restore();}
function drawMiniMap(){const map=$('miniMap');if(map.hidden)return;const m=map.getContext('2d'),scale=map.width/BASE_W;m.setTransform(1,0,0,1,0,0);m.fillStyle='#04121d';m.fillRect(0,0,map.width,map.height);m.save();m.scale(scale,scale);m.fillStyle='#3f5b69';for(const w of walls)m.fillRect(w.x,w.y,w.w,w.h);for(const n of nodes){m.fillStyle=n.restored?'#8beaaf':'#ffbf69';m.beginPath();m.arc(n.x,n.y,18,0,7);m.fill();}m.fillStyle='#fff';m.beginPath();m.arc(player.x,player.y,21,0,7);m.fill();m.strokeStyle='#65e4e799';m.lineWidth=7;m.strokeRect(camera.x,camera.y,camera.viewW,camera.viewH);m.restore();}
  function drawBackground(){
    const visualTime=settings.motion?t:0;
    const g = ctx.createRadialGradient(BASE_W*.52, BASE_H*.46, 40, BASE_W*.52, BASE_H*.46, BASE_W*.8);
    g.addColorStop(0,'#082347'); g.addColorStop(.48,'#041224'); g.addColorStop(1,'#020611');
    ctx.fillStyle = g; ctx.fillRect(0,0,BASE_W,BASE_H);

    ctx.save();
    ctx.globalAlpha = .28;
    ctx.strokeStyle = '#16456d'; ctx.lineWidth = 1;
    const grid = 32;
    for(let x=0;x<=BASE_W;x+=grid){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,BASE_H); ctx.stroke();
    }
    for(let y=0;y<=BASE_H;y+=grid){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(BASE_W,y); ctx.stroke();
    }
    ctx.globalAlpha = .15;
    ctx.strokeStyle = '#42e7ff';
    for(let x=((visualTime*24)%128)-128;x<BASE_W;x+=128){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+180,BASE_H); ctx.stroke();
    }
    ctx.restore();

    drawCircuit(76,96,270,96,320,150,'#42e7ff',.32);
    drawCircuit(48,520,240,520,270,470,'#42e7ff',.24);
    drawCircuit(618,64,910,64,940,194,'#ff7c24',.26);
    drawCircuit(566,458,890,458,930,410,'#42e7ff',.22);
    drawCircuit(612,302,690,302,720,350,'#ff7c24',.20);
  }

  function drawCircuit(x1,y1,x2,y2,x3,y3,color,alpha){
    const visualTime=settings.motion?t:0;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.shadowColor = color;
    ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.stroke();
    for(const [x,y] of [[x1,y1],[x2,y2],[x3,y3]]){
      ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawWalls(){
    const visualTime=settings.motion?t:0;
    ctx.save();
    for(const w of walls){
      ctx.fillStyle = 'rgba(7,22,42,.96)';
      roundRect(w.x,w.y,w.w,w.h,7,true,false);
      ctx.strokeStyle = 'rgba(66,231,255,.68)'; ctx.lineWidth = 2; ctx.shadowColor = '#42e7ff'; ctx.shadowBlur = 5;
      roundRect(w.x+.5,w.y+.5,w.w-1,w.h-1,7,false,true);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(191,249,255,.22)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(w.x+8,w.y+w.h/2); ctx.lineTo(w.x+w.w-8,w.y+w.h/2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCorruption(){
    const visualTime=settings.motion?t:0;
    ctx.save();
    for(const c of corruption){
      if(c.cleared && c.alpha <= 0) continue;
      const alpha = c.cleared ? c.alpha*.22 : .70 + Math.sin(visualTime*5+c.seed)*.08;
      const grad = ctx.createRadialGradient(c.x,c.y,4,c.x,c.y,c.r*1.25);
      grad.addColorStop(0,`rgba(255,124,36,${alpha})`);
      grad.addColorStop(.55,`rgba(255,54,95,${alpha*.38})`);
      grad.addColorStop(1,'rgba(255,124,36,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(c.x,c.y,c.r*1.26,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = c.cleared ? 'rgba(103,255,157,.55)' : 'rgba(255,124,36,.88)';
      ctx.lineWidth = 2;
      ctx.setLineDash([10,8]); ctx.lineDashOffset = -visualTime*18 + c.seed*5;
      ctx.beginPath(); ctx.arc(c.x,c.y,c.r + Math.sin(visualTime*4+c.seed)*2,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = alpha*.75;
      ctx.fillStyle = '#ff7c24';
      for(let i=0;i<12;i++){
        const a = i*.9 + c.seed + Math.sin(visualTime*1.7+i)*.18;
        const rr = c.r*randNoise(c.seed+i, .25, .95);
        const sz = 2 + ((i+c.seed)%4);
        ctx.fillRect(c.x+Math.cos(a)*rr, c.y+Math.sin(a)*rr, sz, sz);
      }
    }
    ctx.restore();
  }

  function randNoise(seed,a,b){
    const x = Math.sin(seed*999.13) * 43758.5453;
    return a + (x - Math.floor(x)) * (b-a);
  }

  function drawFragments(){
    const visualTime=settings.motion?t:0;
    ctx.save();
    for(const f of fragments){
      if(f.taken) continue;
      const r = 9 + Math.sin(visualTime*4+f.pulse)*2;
      ctx.save();
      ctx.translate(f.x,f.y);
      ctx.rotate(visualTime*1.8+f.id);
      ctx.shadowColor = '#42e7ff'; ctx.shadowBlur = 8;
      ctx.strokeStyle = '#bff9ff'; ctx.lineWidth = 2;
      ctx.fillStyle = 'rgba(66,231,255,.18)';
      ctx.beginPath();
      ctx.moveTo(0,-r); ctx.lineTo(r,0); ctx.lineTo(0,r); ctx.lineTo(-r,0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawNodes(){
    const visualTime=settings.motion?t:0;
    ctx.save();
    for(const n of nodes){
      const pulse = 1 + Math.sin(visualTime*3+n.pulse)*.06;
      const color = n.restored ? '#67ff9d' : n.ready ? '#ffc247' : '#42e7ff';
      ctx.shadowColor = color; ctx.shadowBlur = n.restored ? 24 : 14;
      ctx.strokeStyle = color; ctx.lineWidth = 3;
      ctx.fillStyle = n.restored ? 'rgba(103,255,157,.22)' : 'rgba(66,231,255,.14)';
      ctx.beginPath(); ctx.arc(n.x,n.y,26*pulse,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x,n.y,13*pulse,0,Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = color;
      ctx.font = '700 10px Inter, system-ui'; ctx.textAlign = 'center';
      ctx.fillText(n.restored ? 'ONLINE' : n.ready ? 'PULSE TO RESTORE' : player.fragments < n.requirement ? `${player.fragments}/${n.requirement} SIGNAL` : 'CLEAR CORRUPTION', n.x, n.y+44);

    ctx.restore();
  }

  function drawExit(){
    const visualTime=settings.motion?t:0;
    ctx.save();
    const cx = exit.x + exit.w/2, cy = exit.y + exit.h/2;
    const openPulse = exit.open ? .65 + Math.sin(visualTime*6)*.25 : .25;

  function drawDrones(){
    const visualTime=settings.motion?t:0;
    ctx.save();
    for(const d of drones){
      if(!d.active){
        ctx.globalAlpha = .30;
      }
      if(d.active && d.stunned <= 0){
        const range = d.scanRange * (1 + player.nodes*.05);
        ctx.save();
        ctx.translate(d.x,d.y);
        ctx.rotate(d.angle);
        const cone = ctx.createRadialGradient(0,0,10,0,0,range);

        ctx.beginPath(); ctx.moveTo(0,0);

  function drawPlayer(){
    const visualTime=settings.motion?t:0;
    ctx.save();
    for(const tr of trail){
      ctx.globalAlpha = tr.life / .35 * .28;
      ctx.fillStyle = '#42e7ff';
      ctx.beginPath(); ctx.arc(tr.x,tr.y,player.r*.82,0,Math.PI*2); ctx.fill();

    const glow = 18 + player.glow*44;
    ctx.shadowColor = '#42e7ff'; ctx.shadowBlur = glow;
    ctx.fillStyle = '#eaffff';
    ctx.strokeStyle = '#42e7ff'; ctx.lineWidth = 3;
    roundRect(player.x-15, player.y-12, 30, 24, 8, true, true);
    ctx.fillStyle = '#153555';
    roundRect(player.x-7, player.y-5, 14, 10, 3, true, false);
    ctx.strokeStyle = '#bff9ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(player.x + Math.cos(player.facing)*13, player.y + Math.sin(player.facing)*10); ctx.lineTo(player.x + Math.cos(player.facing)*22, player.y + Math.sin(player.facing)*17); ctx.stroke();

      ctx.globalAlpha = .42;
      ctx.strokeStyle = '#ffc247'; ctx.lineWidth = 2;

    ctx.restore();

  function drawEffects(){
    const visualTime=settings.motion?t:0;
    ctx.save();
    for(const p of pulses){
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.strokeStyle = p.color; ctx.lineWidth = 5 * a;
      ctx.shadowColor = p.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.stroke();
    }
    for(const p of particles){
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*a,0,Math.PI*2); ctx.fill();

    ctx.shadowBlur = 0;
    ctx.font = '900 13px Inter, system-ui'; ctx.textAlign = 'center';

    ctx.restore();
  }


function roundRect(x,y,w,h,r,fill,stroke){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill)ctx.fill();if(stroke)ctx.stroke();}
function pollGamepad(){let gp=null;try{gp=Array.from(navigator.getGamepads?.()||[]).find(g=>g?.connected);}catch{}if(!gp){if(gpId!==null){gpInput={x:0,y:0,a:false,b:false};gpPrevious=[];gpId=null;if(state==='playing')pause();}return;}gpId=gp.index;const b=gp.buttons.map(x=>!!x.pressed),edge=i=>b[i]&&!gpPrevious[i],x=Math.abs(gp.axes[0]||0)>.18?gp.axes[0]:0,y=Math.abs(gp.axes[1]||0)>.18?gp.axes[1]:0,axis=y>.6?1:y<-.6?-1:0;gpInput={x:clamp(x+(b[15]?1:0)-(b[14]?1:0),-1,1),y:clamp(y+(b[13]?1:0)-(b[12]?1:0),-1,1),a:b[0],b:b[1]};if(state==='playing'){if(edge(9))pause();else if(edge(8))help();}else if(performance.now()>menuUnlock){if(edge(9)&&state==='paused')resume();else if(edge(1)){if(['paused','help','settings'].includes(state))state==='paused'?resume():returnBack();}else{const buttons=[...screen.querySelectorAll('button,a')];let index=buttons.indexOf(document.activeElement);const dir=edge(13)||axis===1&&gpAxis!==1?1:edge(12)||axis===-1&&gpAxis!==-1?-1:0;if(dir&&buttons.length){index=(index+dir+buttons.length)%buttons.length;buttons[index].focus();}if(edge(0)){const target=buttons[index]||buttons[0];target?.click();}}}gpPrevious=b;gpAxis=axis;}
function loop(now){const elapsed=Math.min(.1,Math.max(0,(now-lastTime)/1000||0));lastTime=now;pollGamepad();if(state==='playing'){accumulator+=elapsed;let steps=0;while(accumulator>=1/60&&steps++<7){update(1/60);accumulator-=1/60;}}else accumulator=0;draw();pendingFrame=requestAnimationFrame(loop);}
window.addEventListener('keydown',e=>{const c=e.code;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(c)&&state==='playing')e.preventDefault();if(e.repeat){if(['Enter','Space','Tab','KeyP','Escape'].includes(c))e.preventDefault();return;}if(state==='playing'){keys.add(c);if(['Escape','KeyP','Enter'].includes(c)){e.preventDefault();pause();}else if(c==='Tab'){e.preventDefault();help();}}else{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c)){e.preventDefault();const list=[...screen.querySelectorAll('button,a')],i=list.indexOf(document.activeElement),dir=['ArrowDown','ArrowRight'].includes(c)?1:-1;list[(i+dir+list.length)%list.length]?.focus();return;}if(c==='Tab'&&!['paused','help'].includes(state)){const list=[...screen.querySelectorAll('button,a')],i=list.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();list.at(-1)?.focus();}else if(!e.shiftKey&&i===list.length-1){e.preventDefault();list[0]?.focus();}return;}if(['Escape','KeyP'].includes(c)||c==='Tab'&&['paused','help'].includes(state)){e.preventDefault();state==='paused'?resume():['help','settings'].includes(state)?returnBack():home();return;}if(['Enter','Space','KeyZ'].includes(c)&&!['BUTTON','A'].includes(document.activeElement?.tagName)){e.preventDefault();if(performance.now()>menuUnlock)screen.querySelector('.primary,.gold,button')?.click();}}},{passive:false});window.addEventListener('keyup',e=>keys.delete(e.code));
function resetOnInterruption(){clearInput();if(state==='playing')pause();accumulator=0;lastTime=performance.now();}
window.addEventListener('blur',resetOnInterruption);document.addEventListener('visibilitychange',()=>{if(document.hidden)resetOnInterruption();else lastTime=performance.now();});window.addEventListener('pagehide',resetOnInterruption);window.addEventListener('gamepaddisconnected',()=>{gpInput={x:0,y:0,a:false,b:false};gpPrevious=[];if(state==='playing')pause();});
function updateJoy(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width*.36),y=(e.clientY-r.top-r.height/2)/(r.height*.36);const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}touchMove.x=Math.abs(x)<.06?0:x;touchMove.y=Math.abs(y)<.06?0:y;stick.style.transform=`translate(calc(-50% + ${x*30}px),calc(-50% + ${y*30}px))`;}
joy.addEventListener('pointerdown',e=>{if(state!=='playing'||joyPointer!==null)return;e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);updateJoy(e);});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer){e.preventDefault();updateJoy(e);}});
function releaseJoy(e){if(e.pointerId!==joyPointer)return;touchMove.x=touchMove.y=0;joyPointer=null;stick.style.transform='translate(-50%,-50%)';}for(const name of ['pointerup','pointercancel','lostpointercapture'])joy.addEventListener(name,releaseJoy);
for(const [id,name] of [['sweepBtn','a'],['dashBtn','b']]){const el=$(id);el.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();touchButtons.set(e.pointerId,name);el.setPointerCapture(e.pointerId);el.classList.add('down');});for(const type of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(type,e=>{touchButtons.delete(e.pointerId);if(![...touchButtons.values()].includes(name))el.classList.remove('down');});}
window.addEventListener('pointerup',e=>{touchButtons.delete(e.pointerId);releaseJoy(e);});document.addEventListener('contextmenu',e=>{if(state==='playing')e.preventDefault();});window.addEventListener('resize',()=>{resizeCanvas();clearInput();});new ResizeObserver(resizeCanvas).observe($('stage'));
readProfile();currentLevel=0;entryScore=0;startGrid(false);home();resizeCanvas();lastTime=performance.now();pendingFrame=requestAnimationFrame(loop);
})();
