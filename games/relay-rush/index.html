/* v0.5.1 Route QA Fix
   The ten-route level data used visually touching/near-touching rectangles.
   Collision uses the player center with radius margin, so several gates and
   route exits were visually present but mechanically unreachable.
   This pass adds invisible-name signal links between intended consecutive
   route zones. It preserves the ten locked level layouts and mechanics. */
function routeRectsOverlap(a,b,min=34){
 const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x);
 const oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);
 return ox>=min&&oy>=min;
}
function addRouteBridge(lv,a,b){
 if(routeRectsOverlap(a,b))return;
 const thick=88,ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
 const ox1=Math.max(a.x,b.x),ox2=Math.min(a.x+a.w,b.x+b.w),oy1=Math.max(a.y,b.y),oy2=Math.min(a.y+a.h,b.y+b.h);
 const bridge=(x,y,w,h)=>lv.zones.push({x,y,w,h,name:'SIGNAL LINK',link:true});
 if(ox2>ox1){const x=(ox1+ox2)/2;bridge(x-thick/2,Math.min(ay,by)-thick/2,thick,Math.abs(ay-by)+thick);}
 else if(oy2>oy1){const y=(oy1+oy2)/2;bridge(Math.min(ax,bx)-thick/2,y-thick/2,Math.abs(ax-bx)+thick,thick);}
 else{bridge(Math.min(ax,bx)-thick/2,ay-thick/2,Math.abs(ax-bx)+thick,thick);bridge(bx-thick/2,Math.min(ay,by)-thick/2,thick,Math.abs(ay-by)+thick);}
}
function applyRouteQaLinks(){
 for(const lv of LEVELS){
   const original=lv.zones.slice();
   for(let i=0;i<original.length-1;i++)addRouteBridge(lv,original[i],original[i+1]);
 }
}
applyRouteQaLinks();


function difficultyProfile(n){
 return {
  signalDrain:1+(n-1)*0.09,
  hazardSpeed:1+(n-1)*0.045,
  beamPressure:1+(n-1)*0.035,
  debrisExtra:n<2?0:Math.min(7,1+Math.floor((n-2)*0.75)),
  firewallCount:n<3?0:Math.min(4,1+Math.floor((n-3)/3)),
  driftCount:n<5?0:Math.min(3,1+Math.floor((n-5)/3)),
  jammerCount:n<6?0:Math.min(3,1+Math.floor((n-6)/3)),
  stormCount:n<7?0:Math.min(3,1+Math.floor((n-7)/2))
 };
}
function gameplayZones(lv){return lv.zones.filter(z=>!z.link&&z.name!=='SIGNAL GATE'&&z.w>120&&z.h>105);}
function zoneAt(lv,ratio){const zs=gameplayZones(lv);return zs[clamp(Math.floor((zs.length-1)*ratio),0,zs.length-1)]||lv.zones[0];}
function insideLevelZone(lv,x,y,r=14){return lv.zones.some(z=>x>=z.x+r&&x<=z.x+z.w-r&&y>=z.y+r&&y<=z.y+z.h-r);}
function generateExtraDebris(lv){
 const d=difficultyProfile(lv.n), zs=gameplayZones(lv), out=[]; if(!d.debrisExtra||!zs.length)return out;
 for(let i=0;i<d.debrisExtra;i++){
  const z=zs[(i*3+lv.n)%zs.length];
  const margin=34;
  const x=Math.round(z.x+margin+((i*97+lv.n*53)%(Math.max(1,z.w-margin*2))));
  const y=Math.round(z.y+margin+((i*71+lv.n*41)%(Math.max(1,z.h-margin*2))));
  out.push({x,y,r:15+((i+lv.n)%4),alive:true,extra:true});
 }
 return out;
}
function generateFirewalls(lv){
 const d=difficultyProfile(lv.n), out=[]; if(!d.firewallCount)return out;
 for(let i=0;i<d.firewallCount;i++){
  const z=zoneAt(lv,.32+i*.18); const vertical=z.w>=z.h;
  const span=vertical?Math.max(54,z.h-32):22;
  const x=vertical?Math.round(z.x+z.w*(.38+((i%2)*.24))-11):Math.round(z.x+z.w*.28);
  const y=vertical?Math.round(z.y+16):Math.round(z.y+z.h*(.36+((i%2)*.22))-11);
  const w=vertical?22:Math.round(Math.min(z.w*.58,220));
  const h=vertical?Math.round(span):22;
  out.push({x,y,w,h,period:2.9-Math.min(.55,lv.n*.025),on:.95+lv.n*.015,phase:i*.65+lv.n*.21,label:'FIREWALL'});
 }
 return out;
}
function generateDriftFields(lv){
 const d=difficultyProfile(lv.n), out=[]; if(!d.driftCount)return out;
 const dirs=[{x:1,y:0,label:'E'},{x:0,y:-1,label:'N'},{x:0,y:1,label:'S'},{x:-1,y:0,label:'W'}];
 for(let i=0;i<d.driftCount;i++){
  const z=zoneAt(lv,.42+i*.20); const dir=dirs[(lv.n+i)%dirs.length];
  const w=Math.round(Math.min(z.w-36,260)); const h=Math.round(Math.min(z.h-30,110));
  const x=Math.round(z.x+18+((i*113+lv.n*29)%Math.max(1,z.w-w-36)));
  const y=Math.round(z.y+15+((i*83+lv.n*17)%Math.max(1,z.h-h-30)));
  out.push({x,y,w,h,dx:dir.x,dy:dir.y,force:42+lv.n*3,label:'DRIFT'});
 }
 return out;
}
function generateJammers(lv){
 const d=difficultyProfile(lv.n), out=[]; if(!d.jammerCount)return out;
 const candidates=lv.relays.slice(1,-1).length?lv.relays.slice(1,-1):lv.relays;
 for(let i=0;i<d.jammerCount;i++){
  const r=candidates[(i*2+lv.n)%candidates.length];
  let x=r.x+((i%2)?-95:95), y=r.y+((i%3)-1)*34;
  if(!insideLevelZone(lv,x,y,18)){x=r.x+((i%2)?92:-92);y=r.y;}
  if(!insideLevelZone(lv,x,y,18)){const z=zoneAt(lv,.52+i*.13);x=z.x+z.w*.55;y=z.y+z.h*.5;}
  out.push({x:Math.round(x),y:Math.round(y),r:86+Math.min(18,lv.n*2),phase:i*.8+lv.n*.2,label:'JAMMER'});
 }
 return out;
}
function generatePacketStorms(lv){
 const d=difficultyProfile(lv.n), out=[]; if(!d.stormCount)return out;
 for(let i=0;i<d.stormCount;i++){
  const z=zoneAt(lv,.50+i*.16), vertical=z.w>=z.h;
  out.push({zone:z,axis:vertical?'x':'y',period:3.7-Math.min(.7,lv.n*.04),warn:.85,active:.48+lv.n*.012,phase:i*.9+lv.n*.17,label:'PACKET'});
 }
 return out;
}

function award(points,x,y,meter=.06){const s=state;s.chain=s.chainTime>0?s.chain+1:1;s.chainTime=13;s.combo=Math.min(4,1+Math.floor((s.chain-1)/3));s.stats.bestCombo=Math.max(s.stats.bestCombo,s.combo);const value=Math.round(points*s.combo);s.score+=value;s.floats.push({x,y,text:'+'+value,life:1});if(s.overdrive<=0){s.meter=clamp(s.meter+meter,0,1);if(s.meter>=1){s.overdrive=5;s.meter=0;s.signal=Math.min(100,s.signal+6);s.score+=500;tone('drive');note('OVERDRIVE · SPEED UP · +500');}}}
function moveVector(){let x=input.ax,y=input.ay;if(stickPointer===null){x=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);y=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);}const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}return {x,y};}
function tryMove(dx,dy){const p=state.player;const n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/5));for(let i=0;i<n;i++){const nx=p.x+dx/n,ny=p.y+dy/n;if(isInZone(nx,ny,p.r)){p.x=nx;p.y=ny;}else{if(isInZone(nx,p.y,p.r))p.x=nx;if(isInZone(p.x,ny,p.r))p.y=ny;}}}
function boost(){if(state.boostCooldown>0)return;const v=moveVector(),a=Math.hypot(v.x,v.y)>.1?Math.atan2(v.y,v.x):state.player.angle;state.boostX=Math.cos(a);state.boostY=Math.sin(a);state.boostTime=.24;state.boostCooldown=2.8;state.stats.boosts++;tone('boost');burst(state.player.x,state.player.y,'#75ecff',12,.8);}
function nearestRelay(range=Infinity){let best=null,dist=range*range;for(const r of state.relays){if(r.stable)continue;const d=d2(state.player,r);if(d<dist&&(range===Infinity||lineClear(state.player,r))){dist=d;best=r;}}return best;}
function autoPulse(){const s=state,p=s.player;if(s.pulseCooldown>0)return;if(isPulseJammed()){if(s.noteTimer<=0)note('JAMMED · SCRUB THE VIOLET CORE');return;}if(s.charge<1)return;const r=nearestRelay(138);if(!r)return;s.charge--;s.pulseCooldown=.35;s.chargeClock=0;r.stable=true;s.signal=clamp(s.signal+10,0,100);award(900,r.x,r.y,.24);s.beam={x1:p.x,y1:p.y,x2:r.x,y2:r.y,life:.22};s.pulseFlash=.24;burst(r.x,r.y,'#96ffc6',20,1);tone('link');updateGoal();s.checkpoint=snapshot(false);saveRun();note(s.gateOpen?'GATE OPEN · REACH THE EXIT':'RELAY LINKED · CHECKPOINT SAVED');}
function scrub(){const s=state,p=s.player;if(s.scrubCooldown>0)return;s.scrubCooldown=.42;s.scrubFlash=.24;let n=0;const range=s.overdrive>0?123:103;for(const d of s.debris){if(d.alive&&d2(p,d)<range*range&&lineClear(p,d)){d.alive=false;n++;s.stats.cleaned++;award(180,d.x,d.y,.08);burst(d.x,d.y,'#ffd17b',9,.8);}}for(const j of s.jammers){if(!j.disabled&&d2(p,j)<range*range&&lineClear(p,j)){j.disabled=true;n++;award(350,j.x,j.y,.12);burst(j.x,j.y,'#da91ff',18,1);note('JAMMER CLEARED');}}if(n){tone('scrub');if(n>1)note('CLEAN SWEEP ×'+n);}}
function takeHit(amount,cause='Hazard collision'){const s=state,p=s.player;if(p.inv>0||s.boostTime>0||s.mode!=='running')return;s.signal=clamp(s.signal-amount,0,100);s.stats.hits++;s.combo=1;s.chain=0;s.chainTime=0;s.meter=Math.max(0,s.meter-.12);p.inv=.95;s.hitFlash=.18;s.shake=preferences.reduced?0:.18;s.failure=cause;tone('hit');burst(p.x,p.y,'#ff6c8a',12,.8);note(cause.toUpperCase()+' · −'+Math.ceil(amount));if(s.signal<=0)gameOver();}
function beamCycle(b){const d=state.diff.beamPressure,period=Math.max(1.8,b.period-(d-1)*.24),on=Math.min(period*.65,b.on*d),phase=(state.time+(b.off||0))%period;return {on:phase<on,warning:period-phase<.65,left:period-phase};}
function firewallCycle(f){const phase=(state.time+f.phase)%f.period;return {on:phase<f.on,warning:f.period-phase<.65,left:f.period-phase};}
function isBeamActive(b){return beamCycle(b).on;}function isFirewallActive(f){return firewallCycle(f).on;}
function stormRect(s){const t=(state.time+s.phase)%s.period,warning=t<s.warn,active=t>=s.warn&&t<s.warn+s.active,z=s.zone,k=active?(t-s.warn)/s.active:0;return s.axis==='x'?{x:z.x+14+Math.max(1,z.w-52)*k,y:z.y+12,w:24,h:Math.max(46,z.h-24),warning,active}:{x:z.x+12,y:z.y+14+Math.max(1,z.h-52)*k,w:Math.max(46,z.w-24),h:24,warning,active};}
function isPulseJammed(){return state.jammers.some(j=>!j.disabled&&d2(state.player,j)<j.r*j.r);}
function driftVector(){let x=0,y=0;const p=state.player;for(const f of state.drifts)if(p.x>f.x&&p.x<f.x+f.w&&p.y>f.y&&p.y<f.y+f.h){x+=f.dx*f.force;y+=f.dy*f.force;}return {x,y};}
function updateHazards(dt){const s=state,t=s.time,p=s.player,hm=s.diff.hazardSpeed;for(const h of s.hazards){if(h.axis==='x')h.x=h.base+Math.sin(t*h.speed*hm+h.phase)*h.amp;else h.y=h.base+Math.sin(t*h.speed*hm+h.phase)*h.amp;const dist=Math.sqrt(d2(p,h)),hit=p.r+h.r;if(dist<hit){takeHit(12+levelIndex*.6,'Signal hunter');h.nearArmed=false;}else if(!h.near&&p.inv<=0&&dist<hit+22)h.nearArmed=true;else if(!h.near&&h.nearArmed&&dist>hit+35){h.near=true;h.nearArmed=false;s.stats.near++;award(180,p.x,p.y,.08);note('CLOSE CALL · +'+180*s.combo);}}for(const d of s.debris)if(d.alive&&d2(p,d)<(p.r+d.r)**2)takeHit(9+levelIndex*.3,'Debris impact');for(const b of s.beams)if(isBeamActive(b)&&circleRect(p.x,p.y,p.r,b.x,b.y,b.w,b.h))takeHit(15+levelIndex*.5,'Live beam');for(const f of s.firewalls)if(isFirewallActive(f)&&circleRect(p.x,p.y,p.r,f.x,f.y,f.w,f.h))takeHit(14+levelIndex*.5,'Firewall');for(const storm of s.storms){const r=stormRect(storm);if(r.active&&circleRect(p.x,p.y,p.r,r.x,r.y,r.w,r.h))takeHit(14+levelIndex*.5,'Packet storm');}}
function updatePickups(){const s=state,p=s.player;for(const o of s.orbs){if(o.taken||d2(p,o)>(p.r+13)**2)continue;o.taken=true;s.stats.pickups++;if(o.type==='patch'){s.signal=clamp(s.signal+24,0,100);note('SIGNAL PATCH · +24');}else{s.charge=clamp(s.charge+2,0,s.chargeCap);note('PULSE CHARGE · +2');}award(100,o.x,o.y,.04);tone('pickup');burst(o.x,o.y,o.type==='patch'?'#96ffc6':'#75ecff',8,.6);}}
function updateGoal(){const s=state;s.stable=s.relays.filter(r=>r.stable).length;s.gateOpen=s.stable>=s.level.req;const g=s.level.gate,p=s.player;if(s.mode==='running'&&s.gateOpen&&circleRect(p.x,p.y,p.r,g.x,g.y,g.w,g.h))win();}
function updateCamera(){const p=state.player,lv=state.level;state.cam.x=clamp(p.x-W*.43,0,Math.max(0,lv.worldW-W));state.cam.y=clamp(p.y-H*.50,0,Math.max(0,lv.worldH-H));}
function update(dt){if(!state||state.mode!=='running')return;const s=state;s.time+=dt;s.signal=Math.max(0,s.signal-dt*(.13+levelIndex*.015));if(s.signal<=0){s.failure='Signal exhausted';gameOver();return;}for(const k of ['noteTimer','hitFlash','pulseFlash','scrubFlash','scrubCooldown','pulseCooldown','boostCooldown','chainTime','overdrive','shake'])s[k]=Math.max(0,s[k]-dt);if(s.chainTime===0){s.combo=1;s.chain=0;}s.player.inv=Math.max(0,s.player.inv-dt);if(s.beam){s.beam.life-=dt;if(s.beam.life<=0)s.beam=null;}if(input.boostPressed){boost();input.boostPressed=false;}if(input.a)autoPulse();if(input.b)scrub();if(s.mode!=='running')return;const v=moveVector();if(Math.hypot(v.x,v.y)>.05)s.player.angle=Math.atan2(v.y,v.x);const drift=driftVector(),speed=s.overdrive>0?278:225;if(s.boostTime>0){tryMove(s.boostX*625*dt,s.boostY*625*dt);s.trail.push({x:s.player.x,y:s.player.y,a:s.player.angle,life:.28});}else tryMove((v.x*speed+drift.x)*dt,(v.y*speed+drift.y)*dt);updateHazards(dt);s.boostTime=Math.max(0,s.boostTime-dt);if(s.mode!=='running')return;updatePickups();updateGoal();if(s.mode!=='running')return;if(s.charge<3){s.chargeClock+=dt;if(s.chargeClock>=2.5){s.charge++;s.chargeClock=0;}}else s.chargeClock=0;updateParticles(dt);s.trail.forEach(t=>t.life-=dt);s.trail=s.trail.filter(t=>t.life>0);s.floats.forEach(f=>{f.life-=dt;f.y-=22*dt;});s.floats=s.floats.filter(f=>f.life>0);s.saveClock+=dt;if(s.saveClock>3){s.saveClock=0;saveRun();}updateCamera();updateHud();}
function gameOver(){if(state.mode!=='running')return;state.mode='over';removeSave();tone('over');const s=state;setPanel(`<div class="eyebrow">ROUTE ${pad(s.level.n,2)} · SIGNAL LOST</div><h1>Line<br><em>dark.</em></h1><p class="lead">${s.failure}. ${s.stable}/${s.level.req} relays linked.</p><div class="resultgrid"><div><b>${pad(s.score)}</b><small>RUN SCORE</small></div><div><b>${formatTime(s.time)}</b><small>TIME</small></div><div><b>${s.stats.hits}</b><small>HITS</small></div></div><div class="buttons">${s.checkpoint?'<button class="button primary" data-cmd="checkpoint">Retry checkpoint</button>':''}<button class="button ${s.checkpoint?'':'primary'}" data-cmd="launch">Retry route</button><button class="button" data-cmd="title">Title</button></div><p class="fine">${s.checkpoint?'Checkpoint recovery restores at least 60% signal, costs 15% of checkpoint score, and adds five seconds.':'Hold SCRUB near debris. Boost has a brief shield, then needs 2.8 seconds to recharge.'}</p>`);}
function win(){if(state.mode!=='running')return;const s=state;s.mode='win';const pace=s.time<=PAR[levelIndex],all=s.stable===s.relays.length,medals=1+Number(pace)+Number(all),rank=medals===3?(s.stats.hits===0&&s.stats.reboots===0?'S':'A'):medals===2?'B':'C';const timeBonus=Math.floor(Math.max(0,PAR[levelIndex]-s.time)*30),signalBonus=Math.round(s.signal*15),completeBonus=2000+(all?1000:0);s.score+=timeBonus+signalBonus+completeBonus;const old=records[s.level.n],isBest=!old||s.score>old.score;if(isBest){records[s.level.n]={score:Math.floor(s.score),time:s.time,medals,rank};writeJSON('records',records);}removeSave();tone('win');setPanel(`<div class="eyebrow">${s.level.n===10?'FINAL CORE RESTORED':'ROUTE COMPLETE'} · ${isBest?'NEW BEST':'BEST '+pad(old.score)}</div><h1>${s.level.n===10?'Core online.':'Signal delivered.'}</h1><div class="scorehero"><div><div class="eyebrow">TOTAL SCORE</div><div class="big">${pad(s.score)}</div></div><div class="rank" aria-label="Rank ${rank}">${rank}</div></div><div class="resultgrid"><div><b>${formatTime(s.time)}</b><small>TIME / ${formatTime(PAR[levelIndex])} PAR</small></div><div><b>${s.stable}/${s.relays.length}</b><small>RELAYS LINKED</small></div><div><b>${Math.ceil(s.signal)}%</b><small>SIGNAL LEFT</small></div><div><b>×${s.stats.bestCombo}</b><small>BEST MULTIPLIER</small></div><div><b>${s.stats.hits}</b><small>HITS TAKEN</small></div><div><b>${s.stats.near}</b><small>CLOSE CALLS</small></div></div><div class="medals"><span class="medal earned">✓ Delivered</span><span class="medal ${pace?'earned':''}">${pace?'✓':'○'} Beat par</span><span class="medal ${all?'earned':''}">${all?'✓':'○'} All relays</span></div><p class="fine">Finish +${completeBonus} · Pace +${timeBonus} · Signal +${signalBonus}<br>${s.stats.reboots} checkpoint recoveries · S rank requires all three medals with zero hits and zero recoveries.</p><div class="buttons"><button class="button primary" data-cmd="next">${s.level.n===10?'Back to route 1':'Next route →'}</button><button class="button" data-cmd="launch">Replay</button><button class="button" data-cmd="title">Title</button></div>`);}
function burst(x,y,color,count=10,power=1){if(preferences.reduced)count=Math.min(4,count);for(let i=0;i<count&&state.particles.length<180;i++){const a=rnd(0,Math.PI*2),sp=rnd(35,135)*power;state.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.25,.6),max:.6,color,r:rnd(1.5,3.5)});}}
function updateParticles(dt){for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*2.5;p.vy*=1-dt*2.5;p.life-=dt;}state.particles=state.particles.filter(p=>p.life>0);}

function drawBg(){
 const bg=ctx.createRadialGradient(W*.5,H*.32,40,W*.5,H*.54,H*.96);
 bg.addColorStop(0,'#0b1630');bg.addColorStop(.54,'#040713');bg.addColorStop(1,'#010206');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 if(state){
   const px=(state.cam.x*.16)%54,py=(state.cam.y*.16)%54;
   ctx.fillStyle='rgba(111,244,255,.055)';
   for(let x=-((px+54)%54);x<W;x+=54){for(let y=-((py+54)%54);y<H;y+=54){ctx.fillRect(x,y,2,2);}}
   const sx=(state.cam.x*.06)%110,sy=(state.cam.y*.06)%110;
   ctx.strokeStyle='rgba(111,244,255,.035)';ctx.lineWidth=1;
   for(let x=-((sx+110)%110);x<W+110;x+=110){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+80,H);ctx.stroke();}
 }
 const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'rgba(111,244,255,.09)');g.addColorStop(.55,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(218,92,255,.06)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const v=ctx.createRadialGradient(W*.5,H*.52,H*.32,W*.5,H*.52,H*.80);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.50)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
} 
function visible(z){return z.x+z.w>state.cam.x-60&&z.x<state.cam.x+W+60&&z.y+z.h>state.cam.y-60&&z.y<state.cam.y+H+60;}
function drawWorld(){
 // Hard void: makes blocked/non-route space visually obvious.
 ctx.fillStyle='#020309';ctx.fillRect(state.cam.x,state.cam.y,W,H);
 const t=state.time;
 for(const z of state.level.zones){if(!visible(z))continue;
  const isLink=!!z.link;
  const grad=ctx.createLinearGradient(z.x,z.y,z.x,z.y+z.h);
  if(isLink){grad.addColorStop(0,'rgba(8,31,55,.82)');grad.addColorStop(1,'rgba(5,19,36,.82)');}
  else{grad.addColorStop(0,'rgba(12,45,76,.98)');grad.addColorStop(.45,'rgba(8,31,56,.98)');grad.addColorStop(1,'rgba(5,18,36,.98)');}
  ctx.fillStyle=grad;ctx.fillRect(z.x,z.y,z.w,z.h);
  ctx.save();ctx.beginPath();ctx.rect(z.x,z.y,z.w,z.h);ctx.clip();
  // inner route-floor glow
  const inner=ctx.createRadialGradient(z.x+z.w*.5,z.y+z.h*.45,8,z.x+z.w*.5,z.y+z.h*.5,Math.max(z.w,z.h)*.72);
  inner.addColorStop(0,isLink?'rgba(111,244,255,.07)':'rgba(111,244,255,.13)');inner.addColorStop(1,'rgba(111,244,255,0)');ctx.fillStyle=inner;ctx.fillRect(z.x,z.y,z.w,z.h);
  // fine grid texture
  ctx.strokeStyle='rgba(111,244,255,.055)';ctx.lineWidth=1;
  for(let x=z.x+30;x<z.x+z.w;x+=42){ctx.beginPath();ctx.moveTo(x,z.y);ctx.lineTo(x,z.y+z.h);ctx.stroke();}
  for(let y=z.y+30;y<z.y+z.h;y+=42){ctx.beginPath();ctx.moveTo(z.x,y);ctx.lineTo(z.x+z.w,y);ctx.stroke();}
  // flow chevrons in route corridors, cosmetic only
  if(!isLink&&z.w>=z.h&&z.w>220){const flow=(t*64)%82;ctx.fillStyle='rgba(111,244,255,.11)';for(let x=z.x-82+flow;x<z.x+z.w;x+=82){const cy=z.y+z.h/2;ctx.beginPath();ctx.moveTo(x,cy-6);ctx.lineTo(x+13,cy);ctx.lineTo(x,cy+6);ctx.closePath();ctx.fill();}}
  if(!isLink&&z.h>z.w&&z.h>230){const flow=(t*46)%78;ctx.fillStyle='rgba(111,244,255,.08)';for(let y=z.y-78+flow;y<z.y+z.h;y+=78){const cx=z.x+z.w/2;ctx.beginPath();ctx.moveTo(cx-6,y);ctx.lineTo(cx,y+13);ctx.lineTo(cx+6,y);ctx.closePath();ctx.fill();}}
  ctx.restore();
  // strong wall treatment
  if(!isLink){ctx.strokeStyle='rgba(111,244,255,.62)';ctx.lineWidth=2;ctx.strokeRect(z.x+1,z.y+1,z.w-2,z.h-2);ctx.strokeStyle='rgba(111,244,255,.12)';ctx.lineWidth=6;ctx.strokeRect(z.x,z.y,z.w,z.h);}
  else{ctx.strokeStyle='rgba(111,244,255,.24)';ctx.lineWidth=1.5;ctx.strokeRect(z.x,z.y,z.w,z.h);}
  if(!isLink){ctx.fillStyle='rgba(190,230,246,.42)';ctx.font='10px ui-monospace,monospace';ctx.fillText(z.name,z.x+12,z.y+18);}
 }
 drawGate();
}
function drawGate(){const open=state.gateOpen,g=state.level.gate,lv=state.level,t=state.time;ctx.save();
 const col=open?'#6dff95':'#ff4d6d';
 const pulse=open?(.52+Math.sin(t*4.5)*.48):(.42+Math.sin(t*3)*.24);
 const halo=ctx.createLinearGradient(g.x-42,0,g.x+g.w+42,0);halo.addColorStop(0,'rgba(0,0,0,0)');halo.addColorStop(.5,open?'rgba(109,255,149,.16)':'rgba(255,77,109,.12)');halo.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=halo;ctx.fillRect(g.x-42,g.y-52,g.w+84,g.h+104);
 ctx.fillStyle=open?`rgba(109,255,149,${.14+pulse*.16})`:'rgba(255,77,109,.16)';ctx.fillRect(g.x,g.y,g.w,g.h);
 ctx.save();ctx.beginPath();ctx.rect(g.x,g.y,g.w,g.h);ctx.clip();ctx.strokeStyle=open?'rgba(109,255,149,.52)':'rgba(255,77,109,.42)';ctx.lineWidth=2;const off=(t*(open?96:38))%42;for(let y=g.y-42+off;y<g.y+g.h+42;y+=42){ctx.beginPath();ctx.moveTo(g.x,y);ctx.lineTo(g.x+g.w,y+18);ctx.stroke();}ctx.restore();
 ctx.strokeStyle=col;ctx.lineWidth=4;ctx.strokeRect(g.x,g.y,g.w,g.h);ctx.shadowColor=col;ctx.shadowBlur=open?20*pulse+8:10;ctx.strokeRect(g.x,g.y,g.w,g.h);ctx.shadowBlur=0;
 ctx.fillStyle=col;ctx.font='bold 18px ui-monospace,monospace';ctx.textAlign='left';ctx.fillText(open?'GATE OPEN':'GATE LOCKED',g.labelX,g.labelY);
 ctx.fillStyle=open?'rgba(109,255,149,.94)':'rgba(255,211,106,.94)';ctx.font='11px ui-monospace,monospace';ctx.fillText(open?'ROUTE READY ▶':'RELAYS '+state.stable+'/'+lv.req,g.labelX,g.labelY+16);
 ctx.restore();ctx.textAlign='left';}
function drawObjects(){drawBeams();drawDifficultyObstacles();drawOrbs();drawDebris();drawRelays();drawHazards();drawParticles();drawPulseEffects();drawPlayer();}

function drawPlayer(){const p=state.player;for(const tr of state.trail){if(preferences.reduced)break;ctx.save();ctx.translate(tr.x,tr.y);ctx.rotate(tr.a);ctx.globalAlpha=tr.life/.28*.3;ctx.fillStyle='#75ecff';ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(-13,-10);ctx.lineTo(-8,0);ctx.lineTo(-13,10);ctx.closePath();ctx.fill();ctx.restore();}ctx.save();ctx.translate(p.x,p.y);if(state.boostTime>0){ctx.strokeStyle='#b3fbff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,26,0,Math.PI*2);ctx.stroke();}if(p.inv>0){ctx.strokeStyle='#d9fcff';ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(0,0,23,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}ctx.rotate(p.angle);ctx.shadowColor='#75ecff';ctx.shadowBlur=preferences.reduced?0:10;ctx.fillStyle='#d8faff';ctx.strokeStyle='#75ecff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-13,-13);ctx.lineTo(-7,0);ctx.lineTo(-13,13);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#0d4262';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();ctx.restore();}
function drawOverlay(){if(state.hitFlash>0&&!preferences.reduced){ctx.fillStyle=`rgba(255,80,110,${state.hitFlash*.5})`;ctx.fillRect(0,0,W,H);}drawMiniMap();const target=state.gateOpen?{x:state.level.gate.x,y:state.level.gate.y+state.level.gate.h/2}:nearestRelay();if(!target||state.mode!=='running')return;const tx=target.x-state.cam.x,ty=target.y-state.cam.y;if(tx>20&&tx<W-20&&ty>20&&ty<H-20)return;const p=state.player,ang=Math.atan2(target.y-p.y,target.x-p.x),cx=W/2,cy=H/2,edge=Math.min((W/2-22)/Math.max(.001,Math.abs(Math.cos(ang))),(H/2-65)/Math.max(.001,Math.abs(Math.sin(ang))));ctx.save();ctx.translate(cx+Math.cos(ang)*edge,cy+Math.sin(ang)*edge);ctx.rotate(ang);ctx.fillStyle=state.gateOpen?'#96ffc6':'#ffd17b';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-8,-7);ctx.lineTo(-4,0);ctx.lineTo(-8,7);ctx.closePath();ctx.fill();ctx.restore();}
function drawMiniMap(){const lv=state.level,width=Math.min(W*.50,270),scale=width/lv.worldW,mh=lv.worldH*scale,x=W-width-12,y=H-mh-15;ctx.save();ctx.fillStyle='#03101eec';ctx.fillRect(x-6,y-6,width+12,mh+12);ctx.strokeStyle='#365c70';ctx.lineWidth=1;ctx.strokeRect(x-6,y-6,width+12,mh+12);ctx.fillStyle='#2c5264';for(const z of lv.zones)ctx.fillRect(x+z.x*scale,y+z.y*scale,z.w*scale,z.h*scale);for(const r of state.relays){ctx.fillStyle=r.stable?'#96ffc6':'#ffd17b';ctx.beginPath();ctx.arc(x+r.x*scale,y+r.y*scale,2.5,0,Math.PI*2);ctx.fill();}const g=lv.gate;ctx.fillStyle=state.gateOpen?'#96ffc6':'#ff6c8a';ctx.fillRect(x+g.x*scale,y+g.y*scale,Math.max(3,g.w*scale),g.h*scale);ctx.strokeStyle='#bcecff';ctx.strokeRect(x+state.cam.x*scale,y+state.cam.y*scale,Math.min(W,lv.worldW)*scale,Math.min(H,lv.worldH)*scale);ctx.fillStyle='white';ctx.beginPath();ctx.arc(x+state.player.x*scale,y+state.player.y*scale,3,0,Math.PI*2);ctx.fill();ctx.restore();}


function updateHud(){if(!state)return;const s=state;$('level').textContent=pad(s.level.n,2);$('score').textContent=pad(s.score);$('clock').textContent=formatTime(s.time);$('combo').textContent='×'+s.combo;$('signal').textContent=Math.ceil(s.signal)+'%';$('signalBar').style.width=s.signal+'%';$('signalBar').style.background=s.signal<25?'var(--red)':'var(--mint)';$('charge').textContent='PULSE '+s.charge+(s.charge<3?' ↻':'');$('goal').textContent=s.gateOpen?'GATE OPEN → EXIT':'RELAYS '+s.stable+'/'+s.level.req;const nearby=nearestRelay(138);$('target').textContent=isPulseJammed()?'JAMMED · SCRUB':nearby?'RELAY IN RANGE':s.level.name;$('toast').textContent=s.note;$('toast').classList.toggle('on',s.noteTimer>0&&s.mode==='running');$('boostLabel').textContent=s.boostCooldown>0?s.boostCooldown.toFixed(1)+'s':'READY';$('boostBtn').style.opacity=s.boostCooldown>0?'.58':'1';$('driveLabel').textContent=s.overdrive>0?'OVERDRIVE '+s.overdrive.toFixed(1)+'s':'OVERDRIVE';$('driveBar').style.width=(s.overdrive>0?s.overdrive/5:s.meter)*100+'%';}
function syncActions(){for(const name of ['a','b','boost']){const keyHeld=name==='a'?(keys.has('z')||keys.has('j')||keys.has(' ')):name==='b'?(keys.has('x')||keys.has('k')):keys.has('Shift');const held=keyHeld||[...pointers.values()].includes(name);if(name==='boost'&&held&&!input.boost)input.boostPressed=true;input[name]=held;document.querySelector(`[data-action="${name}"]`).classList.toggle('active',held);}}
for(const btn of document.querySelectorAll('[data-action]')){btn.addEventListener('pointerdown',e=>{if(state.mode!=='running')return;e.preventDefault();wakeAudio();if(pointers.has(e.pointerId))return;pointers.set(e.pointerId,btn.dataset.action);try{btn.setPointerCapture(e.pointerId);}catch{}syncActions();});for(const type of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(type,e=>{pointers.delete(e.pointerId);syncActions();});}
function releaseStick(e){if(e&&e.pointerId!==stickPointer)return;stickPointer=null;stickCenter=null;input.ax=input.ay=0;$('knob').style.transform='translate(-50%,-50%)';$('stick').classList.remove('active');}
function moveStick(e){if(e.pointerId!==stickPointer||!stickCenter)return;let dx=e.clientX-stickCenter.x,dy=e.clientY-stickCenter.y,m=Math.hypot(dx,dy),max=stickCenter.max;if(m>max){dx*=max/m;dy*=max/m;m=max;}const dead=max*.13,f=m<=dead?0:(m-dead)/(max-dead);input.ax=m?dx/m*f:0;input.ay=m?dy/m*f:0;$('knob').style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;}
$('stick').addEventListener('pointerdown',e=>{if(state.mode!=='running'||stickPointer!==null)return;e.preventDefault();wakeAudio();const r=$('stick').getBoundingClientRect();stickCenter={x:r.x+r.width/2,y:r.y+r.height/2,max:r.width*.34};stickPointer=e.pointerId;$('stick').classList.add('active');try{$('stick').setPointerCapture(e.pointerId);}catch{}moveStick(e);});$('stick').addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();moveStick(e);}});for(const type of ['pointerup','pointercancel','lostpointercapture'])$('stick').addEventListener(type,releaseStick);
window.addEventListener('pointerup',e=>{releaseStick(e);pointers.delete(e.pointerId);syncActions();});window.addEventListener('pointercancel',e=>{releaseStick(e);pointers.delete(e.pointerId);syncActions();});
window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(k==='Tab'&&state.mode!=='running'){const buttons=[...$('panel').querySelectorAll('button:not(:disabled)')];if(buttons.length){if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus();}}return;}if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','z','j','x','k',' ','Shift','Enter','Escape','p','m','r'].includes(k))return;if(e.target.tagName==='BUTTON'&&state.mode!=='running'&&(k==='Enter'||k===' '))return;e.preventDefault();if(e.repeat)return;wakeAudio();if(k==='p'||k==='Escape'){if(state.mode==='running')pause();else if(['paused','map'].includes(state.mode))resume();return;}if(k==='m'){if(state.mode==='running')pause('map');else if(state.mode==='map')resume();return;}if(k==='r'){if(state.mode==='running')pause();if(['paused','map'].includes(state.mode))confirmRestart();return;}if(k==='Enter'){if(state.mode==='title')startRun();else if(['paused','map'].includes(state.mode))resume();else if(state.mode==='running')pause();return;}if(state.mode!=='running')return;keys.add(k);syncActions();});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys.delete(k);syncActions();});
function suspend(){clearInputs();if(state?.mode==='running')pause();else saveRun();acc=0;last=performance.now();}
window.addEventListener('blur',suspend);document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend();else{last=performance.now();acc=0;}});window.addEventListener('pagehide',suspend);window.addEventListener('resize',()=>{clearInputs();fitCanvas();});window.visualViewport?.addEventListener('resize',()=>{clearInputs();fitCanvas();});
function loop(now){const delta=last?Math.min((now-last)/1000,.15):0;last=now;if(!document.hidden&&state.mode==='running'){acc+=delta;let steps=0;while(acc>=1/60&&steps++<9){update(1/60);acc-=1/60;}}else acc=0;draw();raf=requestAnimationFrame(loop);}
fitCanvas();reset('title');raf=requestAnimationFrame(loop);

})();
</script></body></html>
