<!DOCTYPE html>

<style>

.tbtn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(14,22,32,.5);border:1.5px solid rgba(160,210,230,.35);color:#d6ecf5;font:600 12px 'Bahnschrift','Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none}

</style>

<body>
<canvas id="game" tabindex="0" aria-label="Signalbound game canvas"></canvas>
<div id="touch"><div id="stick"></div></div>
<noscript>Signalbound needs JavaScript to run.</noscript>
<script>
'use strict';
/* =====================================================================
   SIGNALBOUND
   One file, many systems:
   CONFIG, UTIL, INPUT, AUDIO, MUSIC, DATA, WORLD, PLAYER, ENTITIES,
   ENEMIES, BOSSES, RENDER, UI, SAVE, MAIN
   ===================================================================== */

/* ============================ CONFIG ============================ */
const TS = 48;                       // world units per tile
const TUNE = {
  wallH: 20,
  view: { tilesTall: 10.5, tilesWide: 8.5 },
  player: { r: 12, speed: 196, accel: 1600, decel: 1900, dodgeSpeed: 440, dodgeTime: 0.25, dodgeCd: 0.32, iframes: 0.9, startHp: 6 },
  blade: { swing: 0.22, active0: 0.03, active1: 0.15, chainWin: 0.42, range: 48, arc: 2.3, dmg: [1, 1, 2], heavyDmg: 4, heavyRange: 70, heavyArc: 3.6, charge: 0.55, knock: 210, lunge: 110 },
  block: { parryWin: 0.28, moveMul: 0.42 },
  pulse: { base: 3, regen: 1.45, speed: 620, life: 0.4, dmg: 1 },
  shift: { time: 0.34, cd: 0.14 },
  trace: { dur: 5.5 },
  bridge: { useR: 1.9, range: 6.3, range2: 9.3, span: 10 },
  anchor: { range: 5.4 },
  invert: { range: 3.8 },
  cam: { look: 64, lerp: 5.5 },
  hazard: { corrTick: 0.75, overloadTick: 1.3 },
  drops: { cellChance: 0.22 },
  cost: { blade: [30, 70], pulse: [25, 60], plating: [90] },
};

/* ============================= UTIL ============================= */
const U = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
  rnd: (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a),
  pick: a => a[(Math.random() * a.length) | 0],
  ang: (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax),
  angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; },
  lerpAng(a, b, t) { return a + U.angDiff(a, b) * U.clamp(t, 0, 1); },
  hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; },
  ease: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy; let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = U.clamp(t, 0, 1); return Math.hypot(px - ax - dx * t, py - ay - dy * t); },
  circRect(cx, cy, r, x, y, w, h) { const nx = U.clamp(cx, x, x + w), ny = U.clamp(cy, y, y + h); return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r; },
  rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; },
  mix(h1, h2, t) { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); const r = Math.round(U.lerp(a >> 16 & 255, b >> 16 & 255, t)), g = Math.round(U.lerp(a >> 8 & 255, b >> 8 & 255, t)), bl = Math.round(U.lerp(a & 255, b & 255, t)); return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1); },
};

/* ============================= INPUT ============================ */
const Input = (() => {
  const KEY = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyJ: 'atk', KeyZ: 'atk', Enter: 'atk', KeyK: 'dodge', KeyX: 'dodge', KeyL: 'block', KeyV: 'block', KeyI: 'pulse', KeyC: 'pulse',
    Space: 'shift', ShiftLeft: 'shift', ShiftRight: 'shift', KeyU: 'tool', KeyF: 'tool', KeyQ: 'prev', KeyE: 'next', Tab: 'next',
    KeyM: 'map', Escape: 'pause', KeyP: 'pause', Backspace: 'back' };
  const ACTS = ['up', 'down', 'left', 'right', 'atk', 'dodge', 'block', 'pulse', 'shift', 'tool', 'prev', 'next', 'map', 'pause', 'back'];
  const kb = {}, tap = {}, gp = {}, tc = {}, sim = {};
  let prev = {}, cur = {};
  const stick = { on: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
  const gax = { x: 0, y: 0 };
  let touchMode = false, lastPad = false;
  addEventListener('keydown', e => { const a = KEY[e.code]; if (!a) return; e.preventDefault(); if (!kb[a]) tap[a] = true; kb[a] = true; lastPad = false; AudioSys.unlock(); }, { passive: false });
  addEventListener('keyup', e => { const a = KEY[e.code]; if (a) kb[a] = false; });
  addEventListener('blur', () => { for (const k in kb) kb[k] = false; for (const k in tc) tc[k] = false; stick.on = false; });
  function poll() {
    for (const k in gp) gp[k] = false; gax.x = gax.y = 0;
    let pads = [];
    try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) { pads = []; }
    for (const pd of pads) {
      if (!pd) continue;
      const b = i => !!(pd.buttons[i] && pd.buttons[i].pressed);
      const m = { atk: 0, dodge: 1, pulse: 2, tool: 3, prev: 4, next: 5, block: 6, shift: 7, map: 8, pause: 9, up: 12, down: 13, left: 14, right: 15 };
      for (const k in m) if (b(m[k])) { gp[k] = true; lastPad = true; }
      const x = pd.axes[0] || 0, y = pd.axes[1] || 0;
      if (Math.hypot(x, y) > 0.22) { gax.x = x; gax.y = y; lastPad = true; }
    }
  }
  function update() {
    poll(); prev = cur; cur = {};
    for (const a of ACTS) cur[a] = !!(kb[a] || tap[a] || gp[a] || tc[a] || sim[a]);
    for (const k in tap) tap[k] = false;
  }
  function axis() {
    let x = 0, y = 0;
    if (sim.ax) { x += sim.ax; y += sim.ay; }
    if (cur.left) x -= 1; if (cur.right) x += 1; if (cur.up) y -= 1; if (cur.down) y += 1;
    x += gax.x; y += gax.y;
    if (stick.on) { const dx = stick.x - stick.ox, dy = stick.y - stick.oy, l = Math.hypot(dx, dy); if (l > 8) { const m = Math.min(1, l / 58); x += dx / l * m; y += dy / l * m; } }
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    return { x, y, len: Math.min(1, l) };
  }
  function setupTouch() {
    if (touchMode) return; touchMode = true;
    const root = document.getElementById('touch'); if (!root) return;
    root.classList.add('on');
    const defs = [['atk', 'Strike', 80, 20, 70], ['dodge', 'Roll', 58, 112, 24], ['pulse', 'Pulse', 54, 110, 104], ['shift', 'Shift', 64, 22, 162],
      ['tool', 'Tool', 54, 100, 186], ['block', 'Guard', 52, 188, 40], ['next', 'Swap', 42, 176, 150], ['map', 'Map', 42, 66, -1], ['pause', 'Menu', 42, 14, -1]];
    for (const [a, l, s, r, bt] of defs) {
      const d = document.createElement('div'); d.className = 'tbtn tb-' + a; d.textContent = l;
      d.style.width = d.style.height = s + 'px';
      d.style.right = `calc(${r}px + env(safe-area-inset-right, 0px))`;
      if (bt < 0) d.style.top = `calc(12px + env(safe-area-inset-top, 0px))`; else d.style.bottom = `calc(${bt}px + env(safe-area-inset-bottom, 0px))`;
      const on = e => { e.preventDefault(); tc[a] = true; d.classList.add('down'); AudioSys.unlock(); };
      const off = e => { e.preventDefault(); tc[a] = false; d.classList.remove('down'); };
      d.addEventListener('pointerdown', on); d.addEventListener('pointerup', off); d.addEventListener('pointercancel', off); d.addEventListener('pointerleave', off);
      root.appendChild(d);
    }
    const st = document.getElementById('stick');
    st.addEventListener('pointerdown', e => {
      e.preventDefault(); AudioSys.unlock();
      if (G.mode !== 'play') { UI.pointer(e.clientX, e.clientY); return; }
      stick.on = true; stick.id = e.pointerId; stick.ox = stick.x = e.clientX; stick.oy = stick.y = e.clientY;
      try { st.setPointerCapture(e.pointerId); } catch (_) { }
    });
    st.addEventListener('pointermove', e => { if (stick.on && e.pointerId === stick.id) { stick.x = e.clientX; stick.y = e.clientY; } });
    const end = e => { if (e.pointerId === stick.id) stick.on = false; };
    st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  }
  addEventListener('touchstart', () => setupTouch(), { once: true, passive: true });
  return { sim, update, axis, hit: a => !!cur[a] && !prev[a], down: a => !!cur[a], up: a => !cur[a] && !!prev[a], stick,
    get touch() { return touchMode; }, get pad() { return lastPad; }, setupTouch, clear() { for (const k in kb) kb[k] = false; } };
})();

/* ============================= AUDIO ============================ */
const AudioSys = (() => {
  let ctx = null, sfx, rev, nbuf, master;
  let sfxVol = 0.6, musVol = 0.3;
  function unlock() {
    if (!ctx) {
      try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ctx = new AC(); } catch (e) { ctx = null; return; }
      build();
    }
    if (ctx.state === 'suspended') ctx.resume();
  }
  function imp(sec, decay) {
    const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }
  let musBus;
  function build() {
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3.5;
    master = ctx.createGain(); master.gain.value = 0.9; comp.connect(master); master.connect(ctx.destination);
    sfx = ctx.createGain(); sfx.gain.value = sfxVol; sfx.connect(comp);
    musBus = ctx.createGain(); musBus.gain.value = musVol; musBus.connect(comp);
    rev = ctx.createConvolver(); rev.buffer = imp(2.8, 2.4);
    const rg = ctx.createGain(); rg.gain.value = 0.45; rev.connect(rg); rg.connect(comp);
    nbuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    Music.attach(ctx, musBus, rev);
  }
  function tone(f, dur, o = {}) {
    if (!ctx) return;
    const { type = 'sine', vol = .2, f2 = null, att = .006, filt = null, q = 1, wet = 0, delay = 0 } = o;
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator(); osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let n = osc; if (filt) { const bq = ctx.createBiquadFilter(); bq.type = 'lowpass'; bq.frequency.value = filt; bq.Q.value = q; osc.connect(bq); n = bq; }
    n.connect(g); g.connect(sfx);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(rev); }
    osc.start(t); osc.stop(t + dur + .05);
  }
  function noise(dur, o = {}) {
    if (!ctx) return;
    const { vol = .2, type = 'bandpass', f = 1000, f2 = null, q = 1, att = .005, wet = 0, delay = 0 } = o;
    const t = ctx.currentTime + delay;
    const s = ctx.createBufferSource(); s.buffer = nbuf;
    const bq = ctx.createBiquadFilter(); bq.type = type; bq.frequency.setValueAtTime(f, t); bq.Q.value = q;
    if (f2) bq.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bq); bq.connect(g); g.connect(sfx);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(rev); }
    s.start(t, Math.random() * 1.2); s.stop(t + dur + .05);
  }
  const semi = (b, s) => b * Math.pow(2, s / 12);
  const S = {
    swing() { noise(.14, { f: 1900, f2: 600, q: .8, vol: .16 }); tone(260, .1, { type: 'triangle', vol: .04, f2: 140 }); },
    heavy() { noise(.32, { f: 900, f2: 180, q: .7, vol: .3 }); tone(130, .32, { type: 'sawtooth', vol: .08, f2: 50, filt: 700 }); },
    charged() { tone(700, .25, { type: 'sine', vol: .06, f2: 1400, wet: .5 }); },
    hit() { noise(.08, { f: 2600, q: 1.5, vol: .22, type: 'highpass' }); tone(190, .12, { type: 'square', vol: .06, f2: 60, filt: 1200 }); },
    clang() { tone(880, .28, { type: 'triangle', vol: .11, f2: 850, wet: .4 }); tone(1320, .22, { vol: .05, wet: .4 }); noise(.05, { f: 5200, type: 'highpass', vol: .14 }); },
    parry() { tone(1200, .4, { vol: .16, f2: 1900, wet: .7 }); tone(600, .3, { type: 'triangle', vol: .09, f2: 900, wet: .5 }); noise(.06, { f: 6000, type: 'highpass', vol: .18 }); },
    block() { tone(420, .12, { type: 'triangle', vol: .08, f2: 380 }); noise(.05, { f: 3000, vol: .1 }); },
    dodge() { noise(.2, { f: 500, f2: 1500, q: .6, vol: .1 }); },
    pulse() { tone(520, .22, { vol: .13, f2: 1500, wet: .3 }); tone(260, .18, { type: 'triangle', vol: .05, f2: 700 }); },
    shiftS() { noise(.34, { f: 300, f2: 4200, q: 2, vol: .16, wet: .5 }); tone(220, .36, { vol: .09, f2: 880, wet: .6 }); tone(330, .4, { vol: .05, f2: 1320, wet: .6, delay: .05 }); },
    shiftP() { noise(.34, { f: 4200, f2: 300, q: 2, vol: .16, wet: .4 }); tone(880, .34, { vol: .07, f2: 220, wet: .5 }); tone(72, .3, { vol: .14, f2: 45 }); },
    deny() { tone(160, .12, { type: 'square', vol: .06, filt: 900 }); tone(120, .16, { type: 'square', vol: .06, filt: 900, delay: .09 }); },
    hurt() { tone(300, .25, { type: 'sawtooth', vol: .11, f2: 80, filt: 1400 }); noise(.15, { f: 800, vol: .18 }); },
    pickup() { [0, 4, 7, 12].forEach((s, i) => tone(semi(440, s), .5, { vol: .08, wet: .6, delay: i * .07 })); },
    shard() { tone(semi(1320, (Math.random() * 3) | 0), .12, { vol: .035, wet: .3 }); },
    tool() { [0, 7, 12, 19, 24].forEach((s, i) => tone(semi(330, s), .9, { type: 'triangle', vol: .07, wet: .7, delay: i * .09 })); },
    node() { tone(660, .3, { vol: .11, f2: 990, wet: .5 }); tone(990, .4, { vol: .06, delay: .08, wet: .5 }); },
    door() { tone(90, .6, { type: 'sawtooth', vol: .07, f2: 60, filt: 400 }); noise(.5, { f: 300, vol: .09 }); },
    lever() { noise(.07, { f: 1500, vol: .18 }); tone(140, .15, { type: 'square', vol: .05, filt: 700 }); },
    trace() { tone(1400, .8, { vol: .06, f2: 700, wet: .8 }); tone(700, 1, { vol: .045, f2: 350, wet: .8, delay: .1 }); },
    bridge() { tone(330, .6, { type: 'sawtooth', vol: .05, f2: 660, filt: 1800, wet: .5 }); tone(495, .6, { vol: .07, wet: .5 }); },
    anchor() { tone(110, .6, { vol: .18, f2: 90 }); tone(880, .5, { vol: .05, wet: .6 }); noise(.1, { f: 2000, vol: .09 }); },
    invert() { tone(800, .35, { type: 'triangle', vol: .09, f2: 200, wet: .4 }); tone(200, .35, { type: 'triangle', vol: .09, f2: 800, wet: .4 }); },
    bolt() { tone(700, .12, { type: 'square', vol: .025, f2: 400, filt: 2500 }); },
    edie() { noise(.4, { f: 1200, f2: 200, vol: .22 }); tone(200, .4, { type: 'sawtooth', vol: .06, f2: 40, filt: 900 }); },
    boom() { noise(1.2, { f: 600, f2: 60, vol: .38, q: .5, wet: .5 }); tone(60, 1, { vol: .28, f2: 30 }); },
    save() { [0, 5, 9, 12].forEach((s, i) => tone(semi(392, s), 1.2, { vol: .06, wet: .8, delay: i * .12 })); },
    ui() { tone(900, .06, { vol: .045 }); },
    warn() { tone(440, .2, { type: 'square', vol: .045, filt: 1200 }); tone(440, .2, { type: 'square', vol: .045, filt: 1200, delay: .28 }); },
    heal() { tone(523, .4, { vol: .07, wet: .6 }); tone(784, .5, { vol: .05, delay: .1, wet: .6 }); },
    stomp() { tone(55, .5, { vol: .3, f2: 30 }); noise(.4, { f: 400, vol: .25 }); },
    splash() { noise(.6, { f: 700, f2: 250, vol: .2, wet: .3 }); },
  };
  return { unlock, S, tone, noise, get ctx() { return ctx; },
    setVol(sv, mv) { sfxVol = sv; musVol = mv; if (sfx) sfx.gain.value = sv; if (musBus) musBus.gain.value = mv; }, get vols() { return [sfxVol, musVol]; } };
})();

/* ============================= MUSIC ============================ */
// Generative ambient score. A pad bed in every region; the Signal Layer fades in a
// glassy arpeggio over the same harmony so shifting feels like hearing the machine think.
const Music = (() => {
  let ctx = null, bus, rev, base, sig, perc, cur = null, curName = '', nextT = 0, step = 0, sigTarget = 0;
  const TH = {
    title: { bpm: 60, chords: [[50, 57, 62, 65], [46, 53, 58, 62], [43, 50, 55, 58], [45, 52, 57, 61]] },
    station: { bpm: 66, chords: [[48, 55, 60, 64], [45, 52, 57, 60], [41, 48, 53, 57], [43, 50, 55, 59]], motif: 1 },
    relay: { bpm: 74, chords: [[50, 57, 60, 65], [46, 53, 57, 62], [48, 55, 60, 64], [45, 52, 55, 60]], motif: 1 },
    flood: { bpm: 70, chords: [[45, 52, 55, 59], [41, 48, 52, 55], [43, 50, 53, 57], [40, 47, 52, 55]], motif: 1 },
    archive: { bpm: 58, chords: [[52, 59, 62, 66], [48, 55, 59, 64], [45, 52, 57, 59], [47, 54, 57, 62]], motif: 1 },
    node: { bpm: 78, chords: [[47, 54, 57, 62], [43, 50, 54, 59], [45, 52, 55, 60], [42, 49, 54, 57]], bass2: 1 },
    boss: { bpm: 122, chords: [[45, 52, 57, 60], [41, 48, 53, 57], [43, 50, 55, 58], [40, 47, 52, 55]], perc: 1, bass2: 1 },
    final: { bpm: 132, chords: [[44, 51, 56, 59], [40, 47, 52, 56], [42, 49, 54, 57], [39, 46, 51, 54]], perc: 1, bass2: 1 },
    ending: { bpm: 64, chords: [[48, 55, 60, 64], [53, 57, 60, 65], [45, 52, 57, 60], [50, 55, 59, 62]], motif: 1 },
  };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function attach(c, b, r) {
    ctx = c; bus = b; rev = r;
    base = ctx.createGain(); base.gain.value = 1; base.connect(bus);
    const br = ctx.createGain(); br.gain.value = 0.35; base.connect(br); br.connect(rev);
    sig = ctx.createGain(); sig.gain.value = 0; sig.connect(bus);
    const sr = ctx.createGain(); sr.gain.value = 0.7; sig.connect(sr); sr.connect(rev);
    perc = ctx.createGain(); perc.gain.value = 0.8; perc.connect(bus);
    nextT = ctx.currentTime + 0.1;
  }
  function play(name) { if (name === curName) return; curName = name; cur = TH[name] || TH.station; step = 0; if (ctx) nextT = Math.max(nextT, ctx.currentTime + 0.05); }
  function pad(t, m, dur, g) {
    for (const det of [-7, 7]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(420, t); f.frequency.linearRampToValueAtTime(1200, t + dur * 0.5); f.frequency.linearRampToValueAtTime(520, t + dur);
      const gn = ctx.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(g, t + dur * 0.35); gn.gain.linearRampToValueAtTime(0.0001, t + dur * 1.05);
      o.connect(f); f.connect(gn); gn.connect(base); o.start(t); o.stop(t + dur * 1.1);
    }
  }
  function pluck(t, m, g, dest, type, d) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = mtof(m);
    const gn = ctx.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(g, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn); gn.connect(dest); o.start(t); o.stop(t + d + 0.05);
  }
  function nz(t, d, f, g, type) {
    const s = ctx.createBufferSource(); const len = Math.floor(ctx.sampleRate * d); const b = ctx.createBuffer(1, len, ctx.sampleRate); const dd = b.getChannelData(0); for (let i = 0; i < len; i++) dd[i] = Math.random() * 2 - 1; s.buffer = b;
    const bq = ctx.createBiquadFilter(); bq.type = type; bq.frequency.value = f; const gn = ctx.createGain(); gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(bq); bq.connect(gn); gn.connect(perc); s.start(t);
  }
  function kick(t) { const o = ctx.createOscillator(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15); const g = ctx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3); o.connect(g); g.connect(perc); o.start(t); o.stop(t + 0.35); }
  function tick() {
    if (!ctx || !cur) return;
    const now = ctx.currentTime;
    sig.gain.setTargetAtTime(sigTarget * 0.9, now, 0.12);
    base.gain.setTargetAtTime(1 - sigTarget * 0.3, now, 0.2);
    if (nextT < now) nextT = now + 0.05;
    const e = 60 / cur.bpm / 2;
    let guard = 0;
    while (nextT < now + 0.3 && guard++ < 16) {
      const t = nextT, s = step % 32, bar = (step >> 3) % cur.chords.length, ch = cur.chords[bar];
      if (s % 8 === 0) { ch.forEach(m => pad(t, m, e * 8, 0.03)); pluck(t, ch[0] - 12, 0.15, base, 'triangle', e * 6); }
      if (cur.bass2 && s % 8 === 4) pluck(t, ch[0] - 12, 0.1, base, 'triangle', e * 3);
      const arp = [0, 2, 1, 3, 2, 1, 3, 0];
      pluck(t, ch[arp[s % 8] % ch.length] + 12 + ((s >> 3) % 2) * 12, 0.045, sig, 'sine', e * 1.8);
      if (cur.motif && s % 16 === 6) pluck(t, ch[2] + 12, 0.04, base, 'triangle', e * 4);
      if (cur.perc) { if (s % 4 === 0) kick(t); if (s % 2 === 1) nz(t, 0.05, 7000, 0.06, 'highpass'); if (s % 8 === 4) nz(t, 0.18, 1800, 0.12, 'bandpass'); }
      step++; nextT += e;
    }
  }
  return { attach, play, tick, setSignal(v) { sigTarget = v; }, get name() { return curName; } };
})();

        const kind = U.hash(i, layerK, 8);

        if (kind < .35) { c.moveTo(x, baseY); c.lineTo(x + w * .45, baseY - h * 1.6); c.lineTo(x + w * .55, baseY - h * 1.6); c.lineTo(x + w, baseY); }
        else if (kind < .6) { c.rect(x, baseY - h, w, h); c.moveTo(x + w * .2, baseY - h); c.lineTo(x + w * .2, baseY - h - px(30)); }
        else if (kind < .8) { c.moveTo(x, baseY); c.lineTo(x, baseY - h * .6); c.quadraticCurveTo(x + w / 2, baseY - h * 1.2, x + w, baseY - h * .6); c.lineTo(x + w, baseY); }
        else { c.rect(x, baseY - h * .5, w * 1.4, h * .5); c.rect(x + w * .3, baseY - h * 1.1, w * .25, h * .6); }
        sig ? c.stroke() : c.fill();
        if (sig && U.hash(i, layerK, 9) > .4) { c.fillStyle = '#9ff4ff'; c.fillRect(x + w / 2 - px(1.5), baseY - h * (kind < .35 ? 1.6 : 1) - px(3), px(3), px(3)); c.fillStyle = 'rgba(0,0,0,0)'; }
      }
      if (!sig) { c.fillStyle = ['#162630', '#101c24', '#0a1016'][layerK]; c.fillRect(0, baseY, W, H); }
    };
    c.save(); c.beginPath(); c.rect(0, 0, seam, H); c.clip(); for (let k = 0; k < 3; k++) drawSkyline(false, k);
    c.strokeStyle = 'rgba(170,200,230,.2)'; c.lineWidth = px(1); c.beginPath(); for (let i = 0; i < 90; i++) { const x = (U.hash(i, 1) * W + t * 60) % W, y = (U.hash(i, 2) * H + t * 700 * (0.7 + U.hash(i, 3) * .5)) % H; c.moveTo(x, y); c.lineTo(x - px(4), y - px(16)); } c.stroke();
    c.restore();
    c.save(); c.beginPath(); c.rect(seam, 0, W - seam, H); c.clip();
    c.fillStyle = '#040a14'; c.fillRect(seam, 0, W - seam, H);
    c.strokeStyle = 'rgba(79,224,255,.06)'; c.lineWidth = 1; const gs = px(32); c.beginPath(); for (let x = seam - (seam % gs); x < W; x += gs) { c.moveTo(x, 0); c.lineTo(x, H); } for (let y = 0; y < H; y += gs) { c.moveTo(seam, y); c.lineTo(W, y); } c.stroke();
    for (let k = 0; k < 3; k++) drawSkyline(true, k);
    c.strokeStyle = 'rgba(79,224,255,.35)'; c.lineWidth = px(1.5); for (let i = 0; i < 6; i++) { const y = horizon + H * .05 + i * H * .045; c.setLineDash([px(14), px(10)]); c.lineDashOffset = -t * 40 * (i + 1); c.beginPath(); c.moveTo(seam, y); c.lineTo(W, y); c.stroke(); } c.setLineDash([]);
    c.restore();
    c.fillStyle = '#e8fbff'; c.fillRect(seam - px(1), 0, px(2), H); c.fillStyle = 'rgba(79,224,255,.12)'; c.fillRect(seam - px(20), 0, px(40), H);
    // title: solid bone on the physical side, outlined signal on the other
    const ts = Math.min(px(96), W / 8.2), ty = H * .3;
    c.font = `700 ${ts}px ${font}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.save(); c.beginPath(); c.rect(0, 0, seam, H); c.clip(); c.fillStyle = '#efe6d6'; c.fillText('SIGNALBOUND', W / 2, ty); c.restore();
    c.save(); c.beginPath(); c.rect(seam, 0, W - seam, H); c.clip(); c.strokeStyle = '#4fe0ff'; c.lineWidth = px(2); c.strokeText('SIGNALBOUND', W / 2, ty); c.fillStyle = 'rgba(79,224,255,.1)'; c.fillText('SIGNALBOUND', W / 2, ty); c.restore();
    c.textBaseline = 'alphabetic';
    txt('Two layers of the same broken world. You can stand in either.', W / 2, ty + ts * .72, Math.max(12, Math.min(17, W / dpr / 45)), 'rgba(225,232,238,.75)', 'center', 500);
    // menu
    if (!titleCache) titleCache = titleItems();
    const items = titleCache, iw = Math.min(W - px(40), px(420)), ix = (W - iw) / 2, iy0 = H * .5;
    items.forEach((it, i) => {
      const y = iy0 + i * px(58), sel = i === titleSel;
      c.fillStyle = sel ? 'rgba(8,16,24,.85)' : 'rgba(8,16,24,.5)'; rrS(ix, y, iw, px(50), px(8)); c.fill();
      if (sel) { c.strokeStyle = '#4fe0ff'; c.lineWidth = px(1.5); c.stroke(); }
      txt(it.label, ix + px(20), y + px(it.desc ? 22 : 31), 18, it.dis ? 'rgba(220,230,238,.3)' : '#f0f4f7', 'left', 700);
      if (it.desc) txt(it.desc, ix + px(20), y + px(40), 12, it.dis ? 'rgba(220,230,238,.25)' : 'rgba(210,222,232,.6)', 'left', 500);
      hot.push({ x: ix, y, w: iw, h: px(50), fn: () => { if (!it.dis && !G.fade.cb) { titleSel = i; AudioSys.unlock(); it.act(); } } });
    });
    txt(Input.touch ? 'Tap to choose' : 'Arrows to choose, J or Enter to confirm', W / 2, H - px(24), 12, 'rgba(200,215,228,.5)', 'center', 500);
  }

  /* ---------- ending ---------- */
  function startEnding() {
    G.mode = 'ending'; G.end = { t: 0, phase: 'dialog' };
    G.F.done = 1; G.F.b_null = 1; saveGame(true);
    dialog('ending', () => { G.end.phase = 'protocol'; G.end.t = 0; Music.play('ending'); AudioSys.S.tool(); });
    G.dialog.prevMode = 'ending';
  }
  function endingStep(dt) {
    const e = G.end; if (!e) return; e.t += dt;
    if (e.phase === 'protocol' && e.t > 19 && (Input.hit('atk') || Input.hit('pause') || e.tap)) { e.tap = false; saveGame(true); toTitle(); }
  }
  function drawEnding() {
    const e = G.end; if (!e || e.phase !== 'protocol') return;
    const W = Render.W, H = Render.H, t = e.t;
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, U.mix('#050a12', '#27415a', Math.min(1, t / 14))); g.addColorStop(1, U.mix('#020304', '#1a2a24', Math.min(1, t / 14))); c.fillStyle = g; c.fillRect(0, 0, W, H);
    const hz = H * .66;
    const fac = [
      { x: .12, name: 'The Relay', col: '#4fe0ff', at: 2.5, draw: (x, on) => { c.strokeStyle = on ? '#9ff4ff' : '#1a2630'; c.lineWidth = px(3); for (let k = 0; k < 3; k++) { const xx = x + (k - 1) * px(44), h = px(120 + k * 30); c.beginPath(); c.moveTo(xx - px(14), hz); c.lineTo(xx, hz - h); c.lineTo(xx + px(14), hz); c.stroke(); if (on) { c.fillStyle = '#ffffff'; c.beginPath(); c.arc(xx, hz - h, px(4 + Math.sin(t * 4 + k) * 1.5), 0, 7); c.fill(); } } } },
      { x: .34, name: 'The Floodworks', col: '#3ff5c4', at: 4.8, draw: (x, on) => { c.fillStyle = '#16242a'; c.fillRect(x - px(90), hz - px(70), px(180), px(70)); if (on) { c.fillStyle = 'rgba(63,245,196,.6)'; for (let k = 0; k < 7; k++) c.fillRect(x - px(80) + k * px(26), hz - px(60) + ((t * 80 + k * 20) % px(60)), px(10), px(14)); } } },
      { x: .55, name: 'Field Station', col: '#ffc27a', at: 1, draw: (x, on) => { c.fillStyle = '#1e2420'; c.beginPath(); c.moveTo(x - px(40), hz); c.lineTo(x, hz - px(40)); c.lineTo(x + px(40), hz); c.fill(); if (on) { c.fillStyle = '#ffc27a'; c.beginPath(); c.arc(x, hz - px(12), px(5), 0, 7); c.fill(); } } },
      { x: .74, name: 'The Archive', col: '#ffb347', at: 7, draw: (x, on) => { c.fillStyle = '#231d16'; c.beginPath(); c.moveTo(x - px(80), hz); c.lineTo(x - px(80), hz - px(50)); c.quadraticCurveTo(x, hz - px(140), x + px(80), hz - px(50)); c.lineTo(x + px(80), hz); c.fill(); if (on) { c.fillStyle = 'rgba(255,179,71,.8)'; for (let k = 0; k < 5; k++) c.fillRect(x - px(60) + k * px(28), hz - px(40), px(12), px(20)); } } },
      { x: .92, name: 'The Black Node', col: '#ff5a4a', at: 9.5, draw: (x, on) => { c.fillStyle = '#120c10'; c.fillRect(x - px(50), hz - px(30), px(100), px(30)); c.fillStyle = on ? '#e8fbff' : '#3a1414'; c.beginPath(); c.arc(x, hz - px(40), px(12), 0, 7); c.fill(); } },
    ];
    c.fillStyle = '#0a0f12'; c.fillRect(0, hz, W, H - hz);
    for (const f of fac) f.draw(f.x * W, t > f.at);
    // signal pathways reconnecting across the region
    c.lineWidth = px(2);
    for (let i = 0; i < fac.length; i++) for (let j = i + 1; j < fac.length; j++) {
      const a = fac[i], b = fac[j], on = Math.min(1, Math.max(0, (t - Math.max(a.at, b.at) - .5) / 1.5)); if (on <= 0) continue;
      const ax = a.x * W, bx = b.x * W, my = hz - px(160) - Math.abs(bx - ax) * .25;
      c.strokeStyle = U.rgba(b.col, .5 * on); c.beginPath(); c.moveTo(ax, hz - px(60)); c.quadraticCurveTo((ax + bx) / 2, my, bx, hz - px(60)); c.stroke();
      const k = (t * .4 + i * .2) % 1; const qx = (1 - k) * (1 - k) * ax + 2 * (1 - k) * k * (ax + bx) / 2 + k * k * bx, qy = (1 - k) * (1 - k) * (hz - px(60)) + 2 * (1 - k) * k * my + k * k * (hz - px(60));
      c.fillStyle = '#ffffff'; c.globalAlpha = on; c.beginPath(); c.arc(qx, qy, px(3), 0, 7); c.fill(); c.globalAlpha = 1;
    }
    for (const f of fac) if (t > f.at) { const a = Math.min(1, (t - f.at) * 1.5); c.globalAlpha = a; txt(f.name, f.x * W, hz + px(28), 12, f.col, 'center', 600); c.globalAlpha = 1; }
    if (t < 12) { c.globalAlpha = Math.min(1, t, 12 - t); txt('Signalbound Protocol', W / 2, H * .18, 24, '#e8fbff', 'center', 700); txt('Reconnecting isolated control systems. Human authority restored.', W / 2, H * .18 + px(28), 14, 'rgba(220,235,245,.7)', 'center', 500); c.globalAlpha = 1; }
    if (t > 12) {
      const a = Math.min(1, (t - 12) / 1.5); c.globalAlpha = a;
      c.font = `700 ${Math.min(px(80), W / 9)}px ${font}`; c.textAlign = 'center'; c.fillStyle = '#f4efe6'; c.fillText('SIGNAL RESTORED', W / 2, H * .3);
      c.globalAlpha = 1;
    }
    if (t > 15) {
      const S = G.S, a = Math.min(1, (t - 15)); c.globalAlpha = a;
      const found = Object.keys(S.found).length + '', total = 3 + 2 + Object.keys(LORE).length;
      txt(`Time ${fmtTime(G.playTime)}     Secrets and fragments ${found}/${total}`, W / 2, H * .3 + px(44), 15, 'rgba(230,236,240,.8)', 'center', 500);
      if (t > 19) txt(Input.touch ? 'Tap to return to the title' : 'Press Strike to return to the title', W / 2, H - px(30), 13, 'rgba(210,222,232,.6)', 'center', 500);
      c.globalAlpha = 1;
    }
    hot.push({ x: 0, y: 0, w: W, h: H, fn: () => { e.tap = true; } });
  }

  /* ---------- frame ---------- */
  function draw(dt) {
    c = Render.ctx; dpr = Render.dpr; hot = [];
    c.setTransform(1, 0, 0, 1, 0, 0);
    if (G.mode === 'title' || (G.mode === 'menu' && G.menu && G.menu.prevMode === 'title')) { drawTitle(); if (G.mode === 'menu') { hot = []; drawMenu(); } }
    else if (G.mode === 'ending' && G.end && G.end.phase === 'protocol') drawEnding();
    else if (G.P && G.R) {
      if (G.mode !== 'map') drawHUD(dt);
      if (G.mode === 'dialog') drawDialog();
      if (G.mode === 'menu') drawMenu();
      if (G.mode === 'map') drawMap();
      if (G.mode === 'lore') drawLore();
    }
    if (G.fade.a > 0) { c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = `rgba(3,5,8,${G.fade.a})`; c.fillRect(0, 0, Render.W, Render.H); }
  }
  function pointer(x, y) {
    const X = x * Render.dpr, Y = y * Render.dpr;
    for (let i = hot.length - 1; i >= 0; i--) { const h = hot[i]; if (X >= h.x && X <= h.x + h.w && Y >= h.y && Y <= h.y + h.h) { h.fn(); return true; } }
    return false;
  }
  return Object.assign(ui, { dialog, dialogStep, banner: showBanner, lore: showLore, loreStep, openMenu, closeMenu, menuStep, terminalMenu, benchMenu, pauseMenu, openMap, mapStep, draw, pointer, toTitle, titleStep, startEnding, endingStep });
})();

/* ============================== MAIN ============================= */
function playStep(dt) {
  if (Input.hit('pause')) { UI.pauseMenu(); return; }
  if (Input.hit('map')) { UI.openMap(); return; }
  if (G.hitstop > 0) { G.hitstop -= dt; return; }
  const R = G.R;
  G.time += dt; G.playTime += dt; R.t += dt;
  if (G.T.shiftLock > 0) G.T.shiftLock -= dt;
  updateCyclers(); rebuildTiles(); buildSolids(); buildHittables();
  if (!G.fade.cb) updatePlayer(dt);
  for (const e of R.ents) { const h = ENT[e.t]; if (h && h.update) h.update(e, dt); }
  const b = R.boss;
  if (b && b.alive) { if (b.wake === false) BOSS[b.type].update(b, dt); else if (b.intro > 0) b.intro -= dt; else BOSS[b.type].update(b, dt); b.flash = Math.max(0, b.flash - dt); }
  if (G.mode !== 'play' && G.mode !== 'dialog') return;
  updateEnemies(dt); updateBolts(dt); updateDrops(dt); updateParts(dt);
  for (const s of R.spans) s.t -= dt; R.spans = R.spans.filter(s => s.t > 0);
  if (G.trans) { G.trans.t += dt; if (G.trans.t >= G.trans.dur) G.trans = null; }
  Render.updateCam(dt);
}
function step(dt) {
  G.rt += dt;
  if (G.fade.cb) { G.fade.a += dt * 5; if (G.fade.a >= 1) { G.fade.a = 1; const cb = G.fade.cb; G.fade.cb = null; cb(); } }
  else G.fade.a = Math.max(0, G.fade.a - dt * 3);
  switch (G.mode) {
    case 'title': UI.titleStep(); break;
    case 'play': playStep(dt); break;
    case 'dialog': UI.dialogStep(dt); if (G.R) { updateParts(dt); if (G.trans) { G.trans.t += dt; if (G.trans.t >= G.trans.dur) G.trans = null; } } break;
    case 'menu': UI.menuStep(); break;
    case 'map': UI.mapStep(); break;
    case 'lore': UI.loreStep(); break;
    case 'ending': UI.endingStep(dt); break;
  }
}
let lastTs = 0;
function loop(ts) {
  const now = ts / 1000; const dt = Math.min(.05, Math.max(0, now - lastTs || .016)); lastTs = now;
  try {
    Input.update(); Music.tick(); step(dt);
    if (G.mode !== 'title' && !(G.mode === 'ending' && G.end && G.end.phase === 'protocol') && !(G.mode === 'menu' && G.menu && G.menu.prevMode === 'title')) Render.frame(dt);
    UI.draw(dt);
  } catch (err) { console.error(err); G.errors = (G.errors || 0) + 1; }
  requestAnimationFrame(loop);
}
function boot() {
  Render.init();
  document.getElementById('game').addEventListener('pointerdown', e => { AudioSys.unlock(); UI.pointer(e.clientX, e.clientY); });
  G.P = makePlayer(); G.S = newStats();
  UI.toTitle(); G.fade.a = 1;
  requestAnimationFrame(loop);
}

boot();
</script>
