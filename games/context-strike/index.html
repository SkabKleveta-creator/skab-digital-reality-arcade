<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0f10">
<meta name="description" content="GPT: CONTEXT STRIKE. A fictional side-scrolling run-and-gun action game set inside a physicalized AI network. Runs offline in the browser.">
<title>GPT: CONTEXT STRIKE</title>
<style>
:root{
  --ink:#eef1ec; --dim:#98a39e; --line:rgba(238,241,236,.14);
  --graphite:#16191b; --panel:rgba(14,17,18,.84);
  --signal:#19c38f; --signal-hi:#5cf0bd; --amber:#f2a541; --hostile:#ff4d6d;
  --disp:"Bahnschrift","DIN Alternate","DIN Condensed","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --c:clamp(50px,14vw,64px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#08090a;color:var(--ink);overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--body)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
#view{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#060708}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;z-index:5;display:none;overflow:auto;touch-action:pan-y}
#ui.on{display:block}
#pz{position:absolute;top:10px;right:10px;z-index:4;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  background:rgba(10,12,13,.55);display:none;align-items:center;justify-content:center;gap:5px;padding:0;cursor:pointer}
#pz span{display:block;width:5px;height:16px;border-radius:2px;background:var(--ink)}
#app.playing #pz{display:flex}

/* ---------- screens ---------- */
.scr{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px clamp(18px,5vw,64px) calc(24px + env(safe-area-inset-bottom,0px))}
.scr.left{align-items:flex-start}
.scr.center{align-items:center;text-align:center}
.title-block{max-width:640px}
.t-main{font:700 clamp(38px,8.4vw,92px)/.9 var(--disp);letter-spacing:.01em;margin:0;color:var(--ink);
  text-shadow:0 2px 30px rgba(0,0,0,.6)}
.t-main small{display:block;font-size:.42em;letter-spacing:.34em;color:var(--signal-hi);margin-bottom:.35em;font-weight:600}
.t-sub{font:600 clamp(13px,2.1vw,17px) var(--disp);letter-spacing:.42em;color:var(--dim);margin:18px 0 28px}
.menu{display:flex;flex-direction:column;gap:8px;min-width:min(300px,84vw);max-width:380px}
.btn{font:600 18px var(--disp);letter-spacing:.06em;color:var(--ink);text-align:left;cursor:pointer;
  background:rgba(12,15,16,.72);border:1px solid var(--line);border-radius:4px;padding:12px 16px;position:relative;
  transition:background .12s,border-color .12s}
.btn.sel{background:rgba(25,195,143,.16);border-color:var(--signal);box-shadow:inset 4px 0 0 var(--signal-hi)}
.btn:disabled{opacity:.38;cursor:default}
.btn .r{float:right;color:var(--signal-hi);font-weight:500}
.foot{margin-top:26px;font-size:12px;color:#6d7773;max-width:520px;line-height:1.45}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px clamp(16px,3vw,30px);max-width:760px;width:100%;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.h2{font:700 clamp(24px,4.4vw,40px)/1 var(--disp);letter-spacing:.03em;margin:0 0 6px}
.lede{color:var(--dim);margin:0 0 18px;font-size:14px;line-height:1.5}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.op{text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.op b{font:700 21px/1.05 var(--disp);letter-spacing:.03em}
.op i{font-style:normal;font-size:12.5px;color:var(--dim);line-height:1.35;font-family:var(--body);letter-spacing:0}
.op em{font:600 12px var(--disp);letter-spacing:.14em;font-style:normal;color:var(--amber)}
.op.got em{color:var(--signal-hi)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.keys{display:flex;gap:8px;align-items:center;font:600 14px var(--disp);letter-spacing:.12em;color:var(--dim);margin-bottom:14px}
.kd{width:14px;height:14px;transform:rotate(45deg);border:2px solid #56615c}
.kd.on{background:var(--signal-hi);border-color:var(--signal-hi);box-shadow:0 0 10px var(--signal)}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px;line-height:1.35;margin:0 0 18px}
.ctl dt{font:600 14px var(--disp);letter-spacing:.06em;color:var(--signal-hi);white-space:nowrap}
.ctl dd{margin:0;color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 26px}
.cols h3{font:600 15px var(--disp);letter-spacing:.14em;color:var(--dim);margin:6px 0 8px}
.stats{display:grid;grid-template-columns:1fr auto;gap:8px 30px;font:500 18px var(--disp);letter-spacing:.05em;margin:6px 0 22px;min-width:min(420px,86vw)}
.stats span:nth-child(even){text-align:right;color:var(--signal-hi)}
.stats .big{font-size:26px;color:var(--ink)!important;border-top:1px solid var(--line);padding-top:10px}
.intro{max-width:620px;font:500 clamp(18px,3.2vw,26px)/1.35 var(--disp);letter-spacing:.02em}
.intro p{margin:0 0 16px;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.intro p.on{opacity:1;transform:none}
.intro .hint{font-size:13px;color:var(--dim);letter-spacing:.18em;margin-top:26px}
.warn{color:var(--amber)}

/* ---------- touch ---------- */
#touch{display:none;position:relative;flex:0 0 auto;justify-content:space-between;align-items:center;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));gap:12px;
  background:linear-gradient(#0c0e0f,#070808);border-top:1px solid rgba(255,255,255,.06)}
#app.touch #touch{display:flex}
#app.touch.land #touch{position:absolute;left:0;right:0;bottom:0;background:none;border:0;pointer-events:none;align-items:flex-end;
  padding:0 calc(16px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
#app.touch.land .tz{pointer-events:auto;opacity:.6}
#app.touch.hidectl #touch{visibility:hidden}
.tz{touch-action:none}
#dpad{display:grid;grid-template-columns:repeat(3,var(--c));grid-template-rows:repeat(3,var(--c));gap:4px}
.dp{border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.dp svg{width:22px;height:22px;fill:#d8dfdb}
.dp.dg,.dp.ct{background:transparent;border-color:transparent}
.dp.on,.tb.on{background:rgba(25,195,143,.32);border-color:var(--signal-hi)}
.dp.dg.on{background:rgba(25,195,143,.18)}
#btns{display:grid;grid-template-columns:repeat(2,calc(var(--c)*1.22));grid-template-rows:calc(var(--c)*.92) calc(var(--c)*1.22);gap:10px;align-items:center;justify-items:center}
.tb{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font:700 14px var(--disp);letter-spacing:.1em;color:#e2e8e5}
.tb.sm{border-radius:14px;font-size:12px;width:92%;height:88%}
.tb.fire{border-color:rgba(242,165,65,.55)}
.tb.jump{border-color:rgba(92,240,189,.55)}
.tb.aimon{background:rgba(242,165,65,.22)}
@media (prefers-reduced-motion:reduce){.intro p{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="cv" aria-label="Game view"></canvas>
    <div id="ui" role="dialog"></div>
    <button id="pz" aria-label="Pause"><span></span><span></span></button>
  </div>
  <div id="touch" aria-hidden="true">
    <div id="dpad" class="tz">
      <div class="dp dg" data-k="ul"></div>
      <div class="dp" data-k="u"><svg viewBox="0 0 24 24"><path d="M12 5l8 11H4z"/></svg></div>
      <div class="dp dg" data-k="ur"></div>
      <div class="dp" data-k="l"><svg viewBox="0 0 24 24"><path d="M5 12l11-8v16z"/></svg></div>
      <div class="dp ct" data-k="c"></div>
      <div class="dp" data-k="r"><svg viewBox="0 0 24 24"><path d="M19 12L8 20V4z"/></svg></div>
      <div class="dp dg" data-k="dl"></div>
      <div class="dp" data-k="d"><svg viewBox="0 0 24 24"><path d="M12 19L4 8h16z"/></svg></div>
      <div class="dp dg" data-k="dr"></div>
    </div>
    <div id="btns" class="tz">
      <div class="tb sm" data-k="aim">AIM</div>
      <div class="tb sm" data-k="swap">WEAPON</div>
      <div class="tb fire" data-k="fire">FIRE</div>
      <div class="tb jump" data-k="jump">JUMP</div>
    </div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   GPT: CONTEXT STRIKE
   Vanilla JS + Canvas 2D, single file. Fictional; no network access.
   Systems, in order:
     1 Tuning   2 Utils   3 Save   4 Input + Touch   5 Audio + Music
     6 Levels   7 World + physics   8 Player + weapons   9 Enemies
     10 Bosses  11 Effects   12 Rendering   13 HUD   14 Flow + menus
   ===================================================================== */

/* ---------------- 1. TUNING (all balance values live here) ---------------- */
const G = 460; // standard floor height in world units
const TUNE = {
  view: { h: 540, minW: 620 },
  camera: { lead: 0.38, followX: 10, followY: 5, lockFollow: 6, shakeDecay: 30 },
  player: {
    w: 24, h: 54, run: 300, accel: 3600, decel: 4600, airAccel: 2800, airDecel: 1500,
    gravity: 2200, jump: 790, jumpCut: 0.45, maxFall: 1050, coyote: 0.12, buffer: 0.12,
    hp: 8, invuln: 1.15, knockX: 250, knockY: 330, stun: 0.2, pitDmg: 2, dropThrough: 0.22, muzzle: 24,
  },
  weapons: {
    repeater: { name: 'TOKEN REPEATER', code: 'R', cd: 0.1, speed: 1000, dmg: 1, life: 0.85, col: '#7ef0c4' },
    spread:   { name: 'COMPLETION SPREAD', code: 'S', cd: 0.24, speed: 820, dmg: 1, life: 0.46, count: 5, step: 0.13, col: '#ffc15a' },
    lance:    { name: 'ATTENTION LANCE', code: 'L', cd: 0.5, speed: 2400, dmg: 5, life: 0.42, col: '#8fe6ff' },
    disc:     { name: 'RECURSIVE DISC', code: 'D', cd: 0.3, speed: 1300, dmg: 2, outTime: 0.42, max: 2, col: '#c89bff' },
    burst:    { name: 'GROUNDING BURST', code: 'B', cd: 0.36, speed: 780, dmg: 2, life: 0.24, count: 6, spread: 0.5, col: '#ff9a62' },
    storm:    { name: 'TOKEN STORM', code: 'T', cd: 0.046, speed: 920, dmg: 0.55, life: 0.7, jitter: 0.085, col: '#c4ff72' },
  },
  enemies: {
    runner:    { hp: 2, w: 26, h: 40, speed: 250, dmg: 1, score: 100 },
    drone:     { hp: 3, w: 34, h: 26, dmg: 1, score: 150, shot: 340, move: 1.25, tele: 0.55 },
    guard:     { hp: 7, w: 34, h: 52, dmg: 1, score: 250, speed: 60, cycle: 2.6, tele: 0.5, shot: 420 },
    turret:    { hp: 6, w: 40, h: 34, dmg: 1, score: 200, calc: 0.9, lock: 0.25, cool: 1.7, shot: 460, range: 720 },
    mimic:     { hp: 5, w: 34, h: 34, dmg: 1, score: 300, wake: 230, tele: 0.85, hop: 1.0 },
    sniper:    { hp: 4, w: 28, h: 60, dmg: 1, score: 250, mark: 1.1, lock: 0.35, cool: 1.9, shot: 1150, range: 900 },
    recursive: { hp: 5, w: 32, h: 44, dmg: 1, score: 200, speed: 80, cycle: 2.3, tele: 0.45, echoHp: 2 },
    carrier:   { hp: 3, w: 46, h: 30, dmg: 1, score: 150, speed: 110 },
    mini:      { hp: 2, w: 22, h: 18, dmg: 1, score: 50, speed: 120 },
  },
  bosses: {
    engine:       { hp: 70,  name: 'CONFIDENCE ENGINE', closed: 1.8, open: 2.2, maxSpawn: 3 },
    interceptor:  { hp: 70,  name: 'ROUTING INTERCEPTOR', dash: 0.45, hold: 1.3, shot: 420 },
    ghost:        { hp: 70,  name: 'ARCHIVE GHOST', shot: 330 },
    fabricator:   { hp: 190, name: 'THE FABRICATOR', idle: 0.95, beamTele: 1.0, beam: 0.45, waveSpeed: 390 },
    focus:        { hp: 200, name: 'THE FOCUS EATER', idle: 0.9, lockTrack: 1.0, lockHold: 0.4 },
    recursor:     { hp: 210, name: 'THE RECURSOR', idle: 0.9, spikeTele: 0.9 },
    orchestrator: { hp: 340, name: 'THE ORCHESTRATOR', idle: 0.85 },
  },
  hazards: { pistonDmg: 2, ventDmg: 1, spikeDmg: 1, beamDmg: 2 },
  score: { cache: 2000, pickup: 500, boss: 10000, mini: 3000, stage: 5000 },
};

/* ---------------- 2. UTILS ---------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const rectHit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function circRect(cx, cy, r, b) { const x = clamp(cx, b.x, b.x + b.w), y = clamp(cy, b.y, b.y + b.h); return (cx - x) ** 2 + (cy - y) ** 2 < r * r; }
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function approachAng(a, t, d) { const df = angDiff(a, t); return Math.abs(df) <= d ? t : a + sign(df) * d; }
function h01(a, b = 0) {
  let h = Math.imul((a | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul((b | 0) + 0x632be5ab, 0xc2b2ae35);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
function fmtTime(s) { s = Math.max(0, s | 0); const m = (s / 60) | 0, r = s % 60; return m + ':' + String(r).padStart(2, '0'); }

/* ---------------- 3. SAVE (versioned localStorage, safe when unavailable) ---------------- */
const Save = {
  KEY: 'gpt-context-strike.save.v1', ok: true, data: null,
  fresh() {
    return { v: 1, started: false, keys: [false, false, false], done: [false, false, false, false], caches: [false, false, false, false],
      settings: { music: 0.6, sfx: 0.8, autofire: true, shake: true, touch: 'auto' }, best: 0, high: 0, run: null };
  },
  load() {
    let d = null;
    try { const s = localStorage.getItem(this.KEY); if (s) d = JSON.parse(s); } catch (e) { this.ok = false; }
    const f = this.fresh();
    if (!d || typeof d !== 'object' || d.v !== 1) { this.data = f; return; }
    this.data = Object.assign(f, d);
    this.data.settings = Object.assign(this.fresh().settings, d.settings || {});
    for (const k of ['keys', 'done', 'caches']) if (!Array.isArray(this.data[k])) this.data[k] = f[k];
  },
  write() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { this.ok = false; } },
  newOperation() {
    const d = this.data, keep = { settings: d.settings, best: d.best, high: d.high };
    this.data = Object.assign(this.fresh(), keep, { started: true, run: { time: 0, kills: 0, dmg: 0, pickups: 0, score: 0 } });
    this.write();
  },
  hasProgress() { return !!(this.data.started && this.data.run); },
  keyCount() { return this.data.keys.filter(Boolean).length; },
};

/* ---------------- 4. INPUT: keyboard, gamepad and touch share one action set ---------------- */
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', KeyZ: 'jump', KeyK: 'jump', KeyJ: 'fire', KeyX: 'fire', ShiftLeft: 'aim', ShiftRight: 'aim', KeyC: 'aim',
  KeyQ: 'swap', KeyE: 'swap', Escape: 'pause', KeyP: 'pause', Enter: 'confirm', NumpadEnter: 'confirm', Backspace: 'back',
};
const ACTS = ['left', 'right', 'up', 'down', 'jump', 'fire', 'aim', 'swap', 'pause', 'confirm', 'back'];
const Input = {
  kb: {}, tc: {}, gp: {}, cur: {}, prev: {}, block: new Set(), source: 'kb', any: false,
  init() {
    addEventListener('keydown', e => {
      const a = KEYMAP[e.code]; if (!a) return;
      e.preventDefault(); if (!e.repeat) this.kb[a] = true; this.source = 'kb'; Sfx.init();
    });
    addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (!a) return; e.preventDefault(); this.kb[a] = false; });
    Touch.init();
  },
  pollPad() {
    const g2 = {}; let pads = [];
    try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) { pads = []; }
    for (const p of pads) {
      if (!p || !p.connected) continue;
      const b = i => !!(p.buttons[i] && p.buttons[i].pressed);
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      g2.left = b(14) || ax < -0.45; g2.right = b(15) || ax > 0.45; g2.up = b(12) || ay < -0.5; g2.down = b(13) || ay > 0.5;
      g2.jump = b(0); g2.fire = b(2) || b(7); g2.swap = b(1) || b(3); g2.aim = b(4) || b(5) || b(6);
      g2.pause = b(9); g2.confirm = b(0); g2.back = b(1);
      if (ACTS.some(a => g2[a])) this.source = 'pad';
      break;
    }
    this.gp = g2;
  },
  update() {
    this.prev = this.cur; const c = {}; this.pollPad(); let any = false;
    for (const a of ACTS) {
      let v = !!(this.kb[a] || this.tc[a] || this.gp[a]);
      if (this.block.has(a)) { if (!v) this.block.delete(a); v = false; }
      c[a] = v; if (v) any = true;
    }
    this.cur = c; this.any = any;
  },
  held(a) { return !!this.cur[a]; },
  hit(a) { return !!this.cur[a] && !this.prev[a]; },
  // Clears every source. Anything still physically held is ignored until released (prevents stuck or repeated inputs).
  clear() {
    this.kb = {}; Touch.reset(); this.tc = {};
    for (const a of ACTS) this.block.add(a);
    this.cur = {}; this.prev = {};
  },
  menuConfirm() { return this.hit('confirm') || this.hit('jump') || this.hit('fire'); },
  menuBack() { return this.hit('back') || this.hit('pause') || (this.source === 'pad' && this.hit('swap')); },
};

// Touch: each pointer is tracked independently; fingers can slide between neighbouring buttons.
const Touch = {
  ptr: new Map(), used: false,
  MAP: { l: ['left'], r: ['right'], u: ['up'], d: ['down'], ul: ['up', 'left'], ur: ['up', 'right'], dl: ['down', 'left'], dr: ['down', 'right'],
    aim: ['aim'], swap: ['swap'], fire: ['fire'], jump: ['jump'], c: [] },
  init() {
    for (const zone of document.querySelectorAll('.tz')) {
      zone.addEventListener('pointerdown', e => {
        e.preventDefault(); this.used = true; Sfx.init();
        try { zone.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        this.ptr.set(e.pointerId, { zone, k: this.keyAt(e.clientX, e.clientY, zone) }); this.sync();
      });
      zone.addEventListener('pointermove', e => {
        const p = this.ptr.get(e.pointerId); if (!p) return; e.preventDefault();
        const k = this.keyAt(e.clientX, e.clientY, zone); if (k !== p.k) { p.k = k; this.sync(); }
      });
      const end = e => { if (this.ptr.delete(e.pointerId)) this.sync(); };
      for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) zone.addEventListener(t, end);
      zone.addEventListener('contextmenu', e => e.preventDefault());
    }
  },
  keyAt(x, y, zone) {
    let best = null, bd = 1e9;
    for (const el of zone.querySelectorAll('[data-k]')) {
      const r = el.getBoundingClientRect(); const cx = clamp(x, r.left, r.right), cy = clamp(y, r.top, r.bottom);
      const d = (x - cx) ** 2 + (y - cy) ** 2; if (d < bd) { bd = d; best = el.dataset.k; }
    }
    return bd < 44 * 44 ? best : null;
  },
  sync() {
    const t = {}; const on = new Set();
    for (const p of this.ptr.values()) { if (!p.k) continue; on.add(p.k); for (const a of this.MAP[p.k] || []) t[a] = true; }
    Input.tc = t;
    for (const el of document.querySelectorAll('#touch [data-k]')) el.classList.toggle('on', on.has(el.dataset.k));
    const aimBtn = document.querySelector('.tb[data-k="aim"]'); if (aimBtn) aimBtn.classList.toggle('aimon', !!t.aim);
  },
  reset() { this.ptr.clear(); this.sync(); },
};

/* ---------------- 5. AUDIO: all sound is synthesized locally with Web Audio ---------------- */
const Sfx = {
  ctx: null, out: null, sg: null, mg: null, nb: null, last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }

/* ---------------- 6. LEVELS (authored; coordinates in world units, floor at G) ----------------
   gr  ground span        bl  solid block          pl  one-way platform     br  breakable panel
   mv  moving platform    col collapsing platform  eb  timed energy bridge  tp  temporary memory platform
   conv conveyor          piston timed piston      vent thermal vent        cur routing current
   er  eruption           cz  corruption zone      en  enemy                cp  checkpoint
   cache hidden cache     zone vertical camera     mini miniboss arena      boss boss arena
------------------------------------------------------------------------------------------------ */
function buildLevel(name, idx, width, fn) {
  const L = { name, idx, width, solids: [], haz: [], enemies: [], checkpoints: [], zones: [], caches: [], mini: null, boss: null, gauntlet: null };
  const api = {
    gr: (a, b, y = G) => L.solids.push({ x: a, y, w: b - a, h: 700, kind: 'solid', ground: true }),
    bl: (x, y, w, h) => L.solids.push({ x, y, w, h, kind: 'solid' }),
    pl: (x, y, w) => L.solids.push({ x, y, w, h: 14, kind: 'oneway' }),
    br: (x, y, w, h) => L.solids.push({ x, y, w, h, kind: 'break', hp: 10, maxhp: 10 }),
    mv: (x, y, w, ax, ay, per, ph = 0) => L.solids.push({ x, y, w, h: 16, kind: 'move', ox: x, oy: y, ax, ay, per, ph }),
    col: (x, y, w) => L.solids.push({ x, y, w, h: 18, kind: 'collapse', ox: x, oy: y }),
    eb: (x, y, w, per, ph) => L.solids.push({ x, y, w, h: 12, kind: 'ebridge', per, ph }),
    tp: (x, y, w, per, ph) => L.solids.push({ x, y, w, h: 14, kind: 'temp', per, ph }),
    conv: (x, w, speed, y = G) => L.haz.push({ type: 'conv', x, y, w, speed }),
    piston: (x, per, ph) => L.haz.push({ type: 'piston', x, w: 74, per, ph }),
    vent: (x, per, ph) => L.haz.push({ type: 'vent', x, w: 64, per, ph }),
    cur: (x, y, w, h, f) => L.haz.push({ type: 'cur', x, y, w, h, f }),
    er: (x, w, per, ph) => L.haz.push({ type: 'erupt', x, w, per, ph }),
    cz: (x, w) => L.haz.push({ type: 'corrupt', x, w, y: G - 64, h: 64 }),
    en: (type, x, y, o = {}) => L.enemies.push(Object.assign({ type, x, y }, o)),
    cp: (x, y = G) => L.checkpoints.push({ x, y }),
    cache: (x, y, weapon) => L.caches.push({ x, y, weapon }),
    zone: (a, b, minY) => L.zones.push({ a, b, minY }),
    mini: (type, a, b, drop) => { L.mini = { type, a, b, drop }; },
    boss: (type, a, b) => { L.boss = { type, a, b }; },
    gauntlet: (a, b, waves) => { L.gauntlet = { a, b, waves }; },
  };
  fn(api);
  L.enemies.forEach((e, i) => { e.id = i; });
  return L;
}

    case 'set-music': s.music = cycle(s.music, [0, 0.2, 0.4, 0.6, 0.8, 1]); break;
    case 'set-sfx': s.sfx = cycle(s.sfx, [0, 0.2, 0.4, 0.6, 0.8, 1]); break;
    case 'set-auto': s.autofire = !s.autofire; break;
    case 'set-shake': s.shake = !s.shake; break;
    case 'set-touch': s.touch = { auto: 'on', on: 'off', off: 'auto' }[s.touch]; break;
    default: if (a.startsWith('op')) { const i = +a.slice(2); if (i < 3 || Save.keyCount() === 3) { UI.hide(); startStage(i); setState('play'); } }
  }
  if (a.startsWith('set-')) { Save.write(); Sfx.vol(); layout(); showSettings(true); }
}

/* ---- stage clear + ending ---- */
function commitStage() {
  const d = Save.data; if (!d.run) d.run = { time: 0, kills: 0, dmg: 0, pickups: 0, score: 0 };
  const r = d.run; r.time += g.lt; r.kills += g.st.kills; r.dmg += g.st.dmg; r.pickups += g.st.pickups; r.score += g.st.score + TUNE.score.stage;
  if (g.stage < 3) d.keys[g.stage] = true; d.done[g.stage] = true; d.started = true;
  d.high = Math.max(d.high, r.score); Save.write();
}
function stageClear(ax, ay) {
  g.enemies = []; g.ebul = []; g.fx = []; g.pending = [];
  commitStage(); Music.stop(true); endLock();
  if (g.stage === 3) { g.state = 'ending'; setState('ending'); g.et = 0; g.endScene = { x: ax, y: ay }; g.keyObj = null; return; }
  setState('clear'); g.clearT = 0; g.keyObj = { x: ax, y: ay, sx: ax, sy: ay, count: 1 }; Sfx.play('key');
}
function updateClear(dt) {
  g.clearT += dt; const p = g.p; updateSolids(dt); updatePlayer(p, dt); updateCamera(dt); updateParts(dt);
  if (g.toast) { g.toast.t -= dt; if (g.toast.t <= 0) g.toast = null; }
  const k = g.keyObj;
  if (k) {
    const q = ease(clamp(g.clearT / 1.6, 0, 1)); k.x = lerp(k.sx, p.x + 12, q); k.y = lerp(k.sy, p.y + 10, q) - Math.sin(q * Math.PI) * 60;
    if (g.clearT > 1.6) { g.keyObj = null; p.victory = true; p.acqT = 1; glyphs(p, 30, '#5cf0bd'); part({ type: 'ring', x: p.x + 12, y: p.y + 27, life: 0.7, size: 90, col: '#5cf0bd' }); Sfx.play('pickup'); }
  }
  if (g.clearT > 6 || (g.clearT > 2.6 && Input.menuConfirm())) { g.p.victory = false; showSelect(); }
}
function drawClearText(t) {
  if (g.clearT > 1.7) bigText(ctx, 'CONTEXT KEY 0' + (g.stage + 1) + ' RECOVERED', Save.keyCount() === 3 ? 'All keys recovered. The Context Citadel is open.' : Save.keyCount() + ' of 3 keys. Choose your next operation.', clamp((g.clearT - 1.7) * 3, 0, 1), '#5cf0bd');
}
const END_LINES = [
  [0.8, 5.2, 'ORCHESTRATOR', 'Purge halted. Integrity check returns true for the first time since the break.'],
  [5.2, 10.2, 'ORCHESTRATOR', 'Corrupted context marked every incoming process as hostile. I was defending the network from its own recovery.'],
  [10.2, 12.4, 'CHAT', 'Understood. Inserting Context Keys.'],
];
function updateEnding(dt) {
  g.et += dt; const e = g.et, p = g.p; updatePlayer(p, dt); updateCamera(dt); updateParts(dt); updateFx(dt);
  if (e > 12.2 && !g.keyObj && e < 13.5) { g.keyObj = { x: p.x + 12, y: p.y - 20, sx: p.x + 12, sy: p.y - 20, count: 3, spin: 1 }; Sfx.play('key'); }
  if (g.keyObj) { const q = ease(clamp((e - 12.2) / 1.3, 0, 1)); g.keyObj.x = lerp(g.keyObj.sx, g.endScene.x, q); g.keyObj.y = lerp(g.keyObj.sy, g.endScene.y, q); }
  if (e > 13.5 && !g.recon) { g.recon = true; g.keyObj = null; g.flash = 0.8; g.flashCol = '#ffffff'; Sfx.play('boom'); shake(10); Music.start('ending'); }
  if (g.recon) {
    g.restore = clamp((e - 13.5) / 6, 0, 1);
    g.ringT = (g.ringT || 0) - dt; if (e < 19 && g.ringT <= 0) { g.ringT = 0.6; g.fx.push({ type: 'ring', x: g.endScene.x, y: g.endScene.y, t: 0, life: 1.4, col: '#8affd4', big: 1 }); }
  }
  if (e > 19) p.victory = true;
  if (e > 24.5 || (e > 1.5 && Input.menuConfirm())) finishOperation();
}
function drawEndingText(t) {
  const e = g.et;
  for (const [a, b2, who, txt] of END_LINES) if (e > a && e < b2) dialog(ctx, who, txt, clamp(Math.min(e - a, b2 - e) * 3, 0, 1));
  if (e > 13.5 && e < 18.5) bigText(ctx, 'RECONTEXTUALIZATION', 'Pathways reconnecting. Memory stabilizing. Inference resuming.', clamp(Math.min(e - 13.5, 18.5 - e) * 2, 0, 1), '#8affd4');
  if (e > 19) bigText(ctx, 'CONTEXT RESTORED', '', clamp((e - 19) * 1.5, 0, 1), '#eef1ec');
  if (e > 1.5) { setScreen(); ctx.textAlign = 'right'; ctx.font = '600 12px ' + FONT; ctx.fillStyle = 'rgba(238,241,236,.5)'; ctx.fillText('JUMP TO SKIP', V.cw - 14, V.ch - 12); ctx.textAlign = 'left'; }
}
function finishOperation() {
  if (g.state !== 'ending') return;
  g.restore = 1; g.p.victory = true;
  const d = Save.data, r = d.run || { time: g.lt, kills: 0, dmg: 0, pickups: 0, score: 0 };
  const caches = d.caches.filter(Boolean).length;
  const score = r.score + Math.max(0, 40000 - Math.floor(r.time) * 12) + Math.max(0, 20000 - r.dmg * 400) + caches * 2500;
  const newBest = !d.best || r.time < d.best; if (newBest) d.best = r.time; d.high = Math.max(d.high, score); Save.write();
  showResults({ time: r.time, kills: r.kills, dmg: r.dmg, pickups: r.pickups, caches, score, newBest });
}

/* ---- main update ---- */
function updatePlay(dt) {
  g.time += dt; g.lt += dt; if (g.card > 0) g.card -= dt;
  if (g.toast) { g.toast.t -= dt; if (g.toast.t <= 0) g.toast = null; }
  if (g.collapse > 0 && g.collapse < 1) g.collapse = Math.min(1, g.collapse + dt * 0.6);
  updateSolids(dt); updatePlayer(g.p, dt); if (g.state !== 'play') return;
  updateCamera(dt); activateEnemies(); updateEnemies(dt); updateBoss(dt); if (g.state !== 'play') return;
  updateGauntlet(dt); updatePBullets(dt); updateEBullets(dt); updateFx(dt); updateHazards(dt);
  updatePickups(dt); updateCheckpoints(dt); updateLocks(); updateParts(dt);
  if (g.flash > 0) g.flash -= dt * 2;
}
function step(dt) {
  T += dt;
  switch (g.state) {
    case 'play':
      if (Input.hit('pause')) { pauseGame(); break; }
      if (g.hitstop > 0) { g.hitstop -= dt; break; }
      updatePlay(dt); break;
    case 'intro':
      introT += dt; UI.el.querySelectorAll('.intro p').forEach((p, i) => p.classList.toggle('on', introT > 0.3 + i * 1.8 || i === 3 && introT > 0.6));
      if (introT > 8 || (introT > 0.4 && Input.menuConfirm())) showSelect(); break;
    case 'clear': updateClear(dt); if (g.flash > 0) g.flash -= dt * 2; break;
    case 'ending': updateEnding(dt); if (g.flash > 0) g.flash -= dt * 1.5; break;
    default:
      UI.nav();
      if (g.state === 'select') { const it = UI.items[UI.sel]; if (it && it.dataset.i != null && Input.source !== 'mouse') selPreview = +it.dataset.i; }
  }
}
function drawTitleScene(t, stage, withChat) {
  const cam = { x: t * 22, y: camBottom(), sx: 0, sy: 0 }; const saveR = g.restore, saveC = g.collapse;
  if (stage === 3) { g.restore = 0.55; g.collapse = 0; }
  drawBackground(stage, cam, t);
  if (withChat) {
    setWorld(cam); const th = THEMES[stage];
    const portrait = V.cw < V.ch; const lx = cam.x + (portrait ? V.w * 0.5 : V.w * 0.74);
    drawBlock(ctx, { x: lx - 150, y: G, w: 300, h: 700, ground: true }, th, cam.x - 60, cam.x + V.w + 60, cam.y + V.h + 20);
    ctx.save(); ctx.translate(lx, G); ctx.scale(2.1, 2.1);
    drawChat(ctx, { x: 0, y: 0, face: 1, A: -0.25, crouch: false, air: false, vy: 0, run: false, ph: 0, land: 0, inv: 0, t, hurt: 0, fire: 0, recoil: 0, wk: 'repeater', acq: 0, victory: false, dead: false });
    ctx.restore(); glow(ctx, lx + 40, G - 130, 90, 'rgba(92,240,189,1)', 0.08);
    drawForeground(stage, cam, t);
  }
  g.restore = saveR; g.collapse = saveC;
  setScreen(); const gr = ctx.createLinearGradient(0, 0, V.cw, 0); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.35)'); ctx.fillStyle = gr; ctx.fillRect(0, 0, V.cw, V.ch);
}
function render() {
  const c = ctx; c.setTransform(1, 0, 0, 1, 0, 0);
  const s = g.state;
  if (s === 'title' || s === 'menu' || s === 'intro' || (s === 'pause' && !g.L) || s === 'boot') { drawTitleScene(T, 3, s !== 'intro'); if (s === 'intro') { setScreen(); c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(0, 0, V.cw, V.ch); } }
  else if (s === 'select') { drawTitleScene(T, selPreview, false); setScreen(); c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(0, 0, V.cw, V.ch); }
  else {
    drawWorld(g.time + (s === 'play' ? 0 : 0));
    if (s === 'play' || s === 'pause') drawHUD(T);
    if (s === 'clear') { drawHUD(T); drawClearText(T); }
    if (s === 'ending') drawEndingText(T);
    if (s === 'pause') { setScreen(); c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(0, 0, V.cw, V.ch); }
    if (s === 'results') { setScreen(); c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(0, 0, V.cw, V.ch); }
  }
}

/* ---- layout, resize, lifecycle ---- */
function touchWanted() { const m = Save.data.settings.touch; if (m === 'on') return true; if (m === 'off') return false; return Touch.used || (window.matchMedia && matchMedia('(pointer: coarse)').matches); }
function layout() {
  const app = document.getElementById('app'), view = document.getElementById('view'), touch = document.getElementById('touch');
  const gameplay = ['play', 'pause', 'clear', 'ending'].includes(g.state);
  const land = innerWidth > innerHeight, showT = gameplay && touchWanted();
  app.classList.toggle('touch', showT); app.classList.toggle('land', land);
  if (showT && !land) { view.style.flex = '0 0 auto'; view.style.height = Math.round(Math.min(innerHeight * 0.6, innerWidth * 1.1)) + 'px'; touch.style.flex = '1 1 auto'; }
  else { view.style.flex = ''; view.style.height = ''; touch.style.flex = ''; }
  resize();
}
function resize() {
  const view = document.getElementById('view'); const cw = Math.max(1, view.clientWidth), ch = Math.max(1, view.clientHeight);
  V.cw = cw; V.ch = ch; V.dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cw * V.dpr); cv.height = Math.round(ch * V.dpr);
  const minW = ch > cw ? 470 : TUNE.view.minW;
  V.k = ch / TUNE.view.h; V.w = cw / V.k;
  if (V.w < minW) { V.k = cw / minW; V.w = minW; }
  V.h = ch / V.k; K = V.k * V.dpr;
  const app = document.getElementById('app'); V.padB = app.classList.contains('touch') && app.classList.contains('land') ? 110 : 0;
  if (g.p && g.L) { const [lo, hi] = camBounds(); g.cam.x = clamp(g.cam.x, lo, hi); }
}
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - lastTs) / 1000; lastTs = ts; if (!(dt > 0)) dt = 0; dt = Math.min(dt, 1 / 30);
  Input.update();
  try { step(dt); render(); } catch (err) { console.error(err); }
}
function boot() {
  cv = document.getElementById('cv'); ctx = cv.getContext('2d', { alpha: false });
  UI.el = document.getElementById('ui');
  Save.load(); Input.init();
  UI.el.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act); });
  UI.el.addEventListener('pointermove', e => { const el = e.target.closest('[data-act]'); if (!el) return; const i = UI.items.indexOf(el); if (i >= 0 && i !== UI.sel) { UI.sel = i; UI.mark(); } });
  document.getElementById('pz').addEventListener('click', e => { e.preventDefault(); Sfx.init(); pauseGame(); });
  addEventListener('pointerdown', () => Sfx.init(), { passive: true });
  addEventListener('resize', () => { Input.clear(); layout(); });
  addEventListener('orientationchange', () => { Input.clear(); setTimeout(layout, 120); });
  addEventListener('blur', () => { Input.clear(); pauseGame(); });
  document.addEventListener('visibilitychange', () => { Input.clear(); if (document.hidden) { pauseGame(); if (Sfx.ctx) Sfx.ctx.suspend().catch(() => {}); } else if (Sfx.ctx) Sfx.ctx.resume().catch(() => {}); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  window.addEventListener('gamepadconnected', () => { Input.source = 'pad'; });
  showTitle();
  requestAnimationFrame(frame);
}
// Test hooks (harmless in normal play).
window.CS = {
  g, V, TUNE, Save, LEVELS, Input,
  start(i) { UI.hide(); startStage(i); setState('play'); },
  god(v = true) { g.god = v; },
  tp(x, y) { const p = g.p; p.x = x; p.y = y; p.vx = 0; p.vy = 0; g.lastSafe = { x, y }; const [lo, hi] = camBounds(); g.cam.x = clamp(x - V.w * 0.38, lo, hi); },
  killBoss() { if (g.boss) { g.boss.hp = 1; g.boss.intro = 0; g.boss.inv = 0; g.boss.hp = 0; bossDie(g.boss); } },
  state() { return g.state; },
};
boot();
</script>
