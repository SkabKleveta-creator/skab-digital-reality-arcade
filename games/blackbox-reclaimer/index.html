      label(state.flightTime < 22 ? `CROSSWIND ${Math.abs(Math.floor(state.wind))} m/s` : 'ORBITAL DEBRIS DENSITY: HIGH', view.w - 25, view.h - 28,{size:10,align:'right',color:C.amber});
    }
  }
  function drawOpening() {
    const t = state.elapsed; const floorY = view.h * .84; let y = floorY - 74; let attached = true; let plume = 0;
    if (t >= 10 && t < 13) plume = .22 + (t-10)/3 * .55;
    if (t >= 13 && t < 30) { const p = (t-13)/17; y = lerp(floorY - 74, view.h*.56, p); plume = .78; attached = !state.boostersReleased; }
    if (t >= 30) { y = view.h*.56; plume = .55; attached = false; }
    drawRocket(state.rocketX, y, 1.08, attached, plume, 0);
    if (t < 10) {
      panel(24, view.h*.16, view.w-48, 110,.78); label('WINDOW: LAST SAFE ASCENT',view.w/2,view.h*.16+30,{align:'center',size:12,color:C.cyan}); label('AUTOMATED LAUNCH SEQUENCE',view.w/2,view.h*.16+53,{align:'center',size:11}); label(`T− ${fmt(10-t)}`,view.w/2,view.h*.16+92,{align:'center',size:27,color:C.amber});
    } else if (t < 13) {
      label('IGNITION / HOLD-DOWN',view.w/2,view.h*.19,{align:'center',size:15,color:C.amber}); label('ENGINE CHAMBERS NOMINAL',view.w/2,view.h*.19+21,{align:'center',size:10});
    } else if (t < 30) {
      label('AUTONOMOUS ASCENT',view.w/2,view.h*.14,{align:'center',size:14,color:C.cyan}); label(state.boostersReleased ? 'SEPARATION COMPLETE — TRAJECTORY HOLD' : 'AUXILIARY BOOSTERS ENGAGED',view.w/2,view.h*.14+20,{align:'center',size:10});
      const p=(t-13)/17; panel(35,view.h*.2,view.w-70,8,.4); ctx.fillStyle=C.cyan;ctx.fillRect(37,view.h*.2+2,(view.w-74)*p,4);
    } else {
      ctx.fillStyle='rgba(2,8,13,.52)';ctx.fillRect(0,0,view.w,view.h); panel(22,view.h*.32,view.w-44,160,.91); label('PILOT',view.w/2,view.h*.32+46,{align:'center',size:26,color:C.amber}); label('TAKE CONTROL',view.w/2,view.h*.32+77,{align:'center',size:17}); label('HOLD ANYWHERE • SLIDE LEFT / RIGHT',view.w/2,view.h*.32+111,{align:'center',size:10,color:C.cyan}); label('SURVIVE TO DEPLOY RCLM-01',view.w/2,view.h*.32+132,{align:'center',size:10});
    }
  }
  function drawBriefing() {
    drawBackground(performance.now());
    ctx.fillStyle='rgba(1,5,9,.52)';ctx.fillRect(0,0,view.w,view.h);
    label('BLACKBOX',view.w/2,view.h*.18,{align:'center',size:13,color:C.cyan}); label('// RECLAIMER',view.w/2,view.h*.18+33,{align:'center',size:26});
    panel(24,view.h*.29,view.w-48,180,.87); label('LAST WINDOW',view.w/2,view.h*.29+35,{align:'center',size:15,color:C.amber});
    const copy=['Launch the RCLM-01 reclamation relay.','The computer handles ascent.','After booster separation, you fly.','Hold one thumb anywhere and slide left/right.','Avoid storm traffic, dead satellites, and debris.'];
    copy.forEach((line,i)=>label(line,view.w/2,view.h*.29+63+i*19,{align:'center',size:10,color:i===3?C.cyan:C.white}));
    const by=view.h*.58; ctx.fillStyle='#104a58';ctx.fillRect(30,by,view.w-60,57);ctx.strokeStyle=C.cyan;ctx.strokeRect(30.5,by+.5,view.w-61,56); label('ARM / BEGIN COUNTDOWN',view.w/2,by+35,{align:'center',size:13});
    label('LOCAL-ONLY CANDIDATE • NO COMBAT',view.w/2,view.h-35,{align:'center',size:9,color:'rgba(230,247,248,.66)'}); label(PATCH_ID,view.w/2,view.h-19,{align:'center',size:9,color:'rgba(94,232,236,.75)'});
  }
  function drawEnd(type) {
    ctx.fillStyle='rgba(2,7,12,.65)';ctx.fillRect(0,0,view.w,view.h); const y=view.h*.28; panel(24,y,view.w-48,type==='complete'?225:205,.93);
    if (type === 'complete') {
      label('RCLM-01 DEPLOYED',view.w/2,y+44,{align:'center',size:19,color:C.cyan}); label('ORBITAL RECLAMATION PATH ONLINE',view.w/2,y+72,{align:'center',size:10}); label(`FLIGHT SCORE  ${state.score.toString().padStart(5,'0')}`,view.w/2,y+108,{align:'center',size:12,color:C.amber}); label('NEXT: CAPTURE / TOW OPERATIONS',view.w/2,y+136,{align:'center',size:10});
    } else { label('FLIGHT LOST',view.w/2,y+44,{align:'center',size:20,color:C.red}); label(`SURVIVED TO ${Math.floor(state.altitude)} KM`,view.w/2,y+76,{align:'center',size:11}); label('RE-ENTER THE PILOT WINDOW',view.w/2,y+105,{align:'center',size:10,color:C.fog}); }
    const by=y+(type==='complete'?160:130);ctx.fillStyle='#104a58';ctx.fillRect(42,by,view.w-84,51);ctx.strokeStyle=C.cyan;ctx.strokeRect(42.5,by+.5,view.w-85,50);label(type==='complete'?'RUN ANOTHER RECLAIMER':'RETRY PILOT PHASE',view.w/2,by+31,{align:'center',size:12});
    label(`${PATCH_ID} • LOCAL CANDIDATE`,view.w/2,view.h-22,{align:'center',size:9,color:'rgba(230,247,248,.65)'});
  }
  function render(t) {
    const dx = state.shake ? (rng()-.5)*state.shake : 0; const dy = state.shake ? (rng()-.5)*state.shake : 0;
    ctx.save();ctx.translate(dx,dy); drawBackground(t);
    if (state.mode === 'briefing') { drawBriefing();ctx.restore();return; }
    if (state.mode === 'countdown' || state.mode === 'ignition' || state.mode === 'assisted' || state.mode === 'handoff') drawOpening();
    else {
      for (const o of state.obstacles) drawObstacle(o);
      drawRocket(state.rocketX,view.h*.68,1,false,.42,clamp(state.vx/850,-.18,.18));
    }
    drawParticles(); drawHud();
    if (state.note && performance.now() < state.noteUntil && state.mode !== 'handoff') {
      panel(28,view.h*.25,view.w-56,34,.82);label(state.note,view.w/2,view.h*.25+22,{align:'center',size:11,color:state.integrity<2?C.red:C.amber});
    }
    if (state.hitFlash) { ctx.fillStyle=`rgba(255,81,99,${state.hitFlash*.22})`;ctx.fillRect(0,0,view.w,view.h); }
    if (state.mode === 'failed') drawEnd('failed'); if (state.mode === 'complete') drawEnd('complete');
    ctx.restore();
  }
  function frame(now) { const dt = Math.min(.033,(now-state.last)/1000);state.last=now;update(dt);render(now);requestAnimationFrame(frame); }
  requestAnimationFrame(frame);

  function eventPoint(e) { const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*view.w/r.width,y:(e.clientY-r.top)*view.h/r.height}; }
  canvas.addEventListener('pointerdown', e => {
    const p=eventPoint(e); canvas.setPointerCapture?.(e.pointerId);
    if (state.mode==='briefing') { if (p.y>view.h*.56 && p.y<view.h*.68) armMission(); return; }
    if (state.mode==='failed' || state.mode==='complete') { resetFlight(true); return; }
    if (state.mode!=='flight') return;
    state.pointerId=e.pointerId; state.pointerStart=p.x; state.pointerX=p.x; state.input=0;
  });
  canvas.addEventListener('pointermove', e => { if (state.mode!=='flight' || e.pointerId!==state.pointerId) return; const p=eventPoint(e);state.pointerX=p.x;state.input=clamp((p.x-state.pointerStart)/72,-1,1); });
  function clearPointer(e) { if (e.pointerId===state.pointerId){state.pointerId=null;state.input=0;} }
  canvas.addEventListener('pointerup',clearPointer); canvas.addEventListener('pointercancel',clearPointer);
  window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)){keys.add(e.key);e.preventDefault();}});window.addEventListener('keyup',e=>keys.delete(e.key));
})();
</script>
</body>
