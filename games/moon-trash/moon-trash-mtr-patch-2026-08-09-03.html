  <script>
  (() => {
    'use strict';
    const PATCH_ID='MTR-PATCH-2026-08-09-03';
    const W=800,H=640,GROUND=430,SAVE_KEY='moon-trash-scroll-v02';
    const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
    const $=id=>document.getElementById(id);
    const levels=[
      {name:'SPOONBILL CRATER',tag:'FIRST MESS',cap:3,world:2700,cart:'Scrap Sled',next:'Rattle Cart',parts:[['Bent antenna',540,378],['Solar noodle',1280,298],['Cupholder thruster cap',2180,378]],obstacles:[['boulder',830,'Move lunar boulder'],['crate',1760,'Slide snack crate']],platforms:[[1090,340,350],[1500,286,270],[2010,340,280]],tunnel:[930,1060],line:'A sled, three parts, and zero respectable engineering decisions.'},

      {name:'RICKETY SEA',tag:'LOW GRAVITY',cap:6,world:3900,cart:'Wobble Wagon',next:'Big Moon Wagon',parts:[['Anti-grav can opener',500,378],['Folded engine spoon',1080,318],['Puddle-safe relay',1690,246],['Inflatable wrench',2400,318],['Tactical umbrella',3050,278],['Suspiciously warm nozzle',3600,378]],obstacles:[['crate',760,'Push supply crate'],['boulder',1320,'Move moon rock'],['panel',2700,'Brace and lift panel'],['crate',3270,'Shove cart wheel']],platforms:[[900,352,330],[1450,280,390],[2170,350,320],[2840,310,380]],tunnel:[1850,2150],line:'Nothing here is wet. It just looks like it wants to be.'},
      {name:'SILENT PARKING LOT',tag:'BIG HAUL',cap:7,world:4300,cart:'Big Moon Wagon',next:'Powered Hauler',parts:[['Decorative wing nut',500,378],['Saddle-shaped stabilizer',1000,326],['Moon radio with a mute button',1600,248],['Third cupholder',2250,318],['Trailer hitch plasma coil',2860,280],['Not a lawn chair',3500,318],['Engine part that growls',4010,378]],obstacles:[['boulder',770,'Move crater rock'],['crate',1320,'Push snack locker'],['panel',2510,'Raise dropped hatch'],['crate',3210,'Slide rover tire']],platforms:[[850,350,350],[1400,286,380],[2050,344,320],[2630,290,420],[3330,348,330]],tunnel:[1700,2010],line:'Someone designed a lunar parking lot. Someone else immediately crashed in it.'},
      {name:'EXIT RAMP',tag:'LAST LOAD',cap:8,world:4700,cart:'Powered Hauler',next:'Escape Ship',parts:[['Slightly used star chart',520,378],['Door hinge rated for space-ish',1080,330],['Rover horn capacitor',1720,248],['Emergency moon tape',2360,320],['One brave fuel hose',3000,278],['Window with attitude',3620,318],['Seat belt, probably',4140,270],['Launch key that is just a spoon',4520,378]],obstacles:[['crate',780,'Push tool crate'],['boulder',1390,'Move boulder politely'],['panel',2600,'Lift engine panel'],['crate',3320,'Shove lunch box'],['boulder',3870,'Roll final rock']],platforms:[[860,350,350],[1460,288,390],[2070,344,340],[2750,290,420],[3400,350,340],[3970,300,370]],tunnel:[1830,2180],line:'Fill the hauler, then make a ship from whatever still has a label.'}
    ];
    const state={level:0,loaded:0,ship:0,carrying:null,parts:[],obstacles:[],p:{x:195,y:382,vx:0,vy:0,grounded:true,facing:1,layer:'surface'},camera:0,scan:0,running:false,paused:false,mode:'start',last:0,toastUntil:0,toast:'',particles:[],flash:0};
    const input={left:false,right:false,up:false,down:false,jump:false,use:false,load:false,scan:false,start:false,select:false,just:{jump:false,use:false,load:false,scan:false,start:false,select:false,up:false,down:false}};
    const stage=$('stage'),promptCopy=$('promptCopy'),promptKey=$('promptKey'),dpad=$('dpad');

    function freshLevel(){const l=levels[state.level];state.loaded=0;state.carrying=null;state.parts=l.parts.map((p,i)=>({id:i,name:p[0],x:p[1],y:p[2],done:false}));state.obstacles=l.obstacles.map((o,i)=>({id:i,type:o[0],x:o[1],label:o[2],done:false,w:o[0]==='panel'?78:58,h:o[0]==='panel'?72:54}));state.p={x:195,y:382,vx:0,vy:0,grounded:true,facing:1,layer:'surface'};state.camera=0;state.scan=0;}
    function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({level:state.level,ship:state.ship,mode:state.mode}));}catch(e){}}
    function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
    function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&Number.isInteger(s.level)&&s.level>=0&&s.level<levels.length){state.level=s.level;state.ship=s.ship||0;return true;}}catch(e){}return false;}
    function current(){return levels[state.level]}
    function updateHud(){const l=current();$('sledReadout').textContent=`${state.loaded} / ${l.cap}`;$('shipReadout').textContent=`${state.ship} / 6`;}
    function showOverlay(html){$('overlayCard').innerHTML=html;$('overlay').hidden=false;}
    function hideOverlay(){$('overlay').hidden=true;}
    function startCard(){showOverlay(`<p class="eyebrow">a lunar cleanup inconvenience</p><h1>Moon Trash</h1><p>Bring every ship part back to the sled. When it fills, build a bigger nonsense-cart and keep moving toward a very questionable escape ship.</p><div class="feature-line"><span>RUN + JUMP</span><span>USE OBSTACLES</span><span>FIND TUNNELS</span><span>NO FIGHTING</span></div><button class="primary" id="begin">START THE MESS</button><button class="secondary" id="fresh">START FRESH</button>`);$('begin').onclick=()=>{hideOverlay();startRun(load());};$('fresh').onclick=()=>{clearSave();state.level=0;state.ship=0;hideOverlay();startRun(false);};}
    function clearHeldInput(){for(const k in input){if(k!=='just'&&typeof input[k]==='boolean')setInput(k,false)}for(const k in input.just)input.just[k]=false;}
    function helpCard(){const wasPlaying=state.running&&state.mode==='play';if(wasPlaying){state.paused=true;clearHeldInput();}showOverlay(`<p class="eyebrow">controls · ${PATCH_ID}</p><h1>One handheld. No mystery buttons.</h1><p><b>D-pad</b> walks the route. <b>A</b> moon-jumps. <b>B</b> picks up parts, moves obstacles, and enters or exits tunnels. <b>X</b> loads your carried part into the sled. <b>Y</b> scans the route. <b>START</b> pauses. <b>SELECT</b> brings this card back.</p><div class="feature-line"><span>WASD / ARROWS</span><span>Z JUMP</span><span>X USE</span><span>C LOAD</span><span>V SCAN</span></div><button class="primary" id="resume">BACK TO THE MOON</button>`);$('resume').onclick=()=>{state.paused=false;hideOverlay();};}
    function pauseCard(){if(!state.running||state.mode!=='play')return;state.paused=true;clearHeldInput();showOverlay(`<p class="eyebrow">start button</p><h1>Moonwalk paused.</h1><p>Your sled is waiting exactly where you left it. The Moon will remain unreasonable.</p><div class="feature-line"><span>SELECT = CONTROLS</span><span>START = RESUME</span></div><button class="primary" id="resume">RESUME MOONWALK</button>`);$('resume').onclick=()=>{state.paused=false;hideOverlay();};}
    function buildCard(){const l=current(),final=state.level===levels.length-1;const next=final?'THE ESCAPE SHIP':levels[state.level+1].cart;showOverlay(`<p class="eyebrow">sled full · route ${String(state.level+1).padStart(2,'0')} complete</p><h1>${final?'Enough parts to flee.':'Build a worse cart.'}</h1><p>${final?'You found the last pieces. The garage has built something with a window, a fuel hose, and one very assertive spoon.':'Those salvaged parts become the '+next+'. It holds more trash, makes fewer sounds, and is only slightly more likely to roll away.'}</p><div class="feature-line"><span>${l.cap} PARTS HAULED</span><span>SHIP SYSTEM ${state.ship+1}/6</span></div><button class="primary" id="build">${final?'BUILD & LAUNCH':'BUILD '+next.toUpperCase()}</button>`);$('build').onclick=()=>{state.ship++;if(final){state.mode='won';save();winCard();return;}state.level++;state.mode='play';save();freshLevel();hideOverlay();prompt(`<b>${levels[state.level].cart} online.</b> It is somehow legal. Fill it with ${levels[state.level].cap} parts.`, 'X LOAD');};}
    function winCard(){showOverlay(`<p class="eyebrow">six routes cleared · ${PATCH_ID}</p><h1>You left the Moon.</h1><p>The next moonwalk finds a few tidy craters, one unusually clean parking lot, and an exhaust trail shaped exactly like a lawnmower trying its best.</p><div class="feature-line"><span>36 PARTS RECOVERED</span><span>0 ALIENS FOUND</span><span>1 VERY BAD SHIP</span></div><button class="primary" id="again">DO IT AGAIN, BUT LESS SAFELY</button>`);$('again').onclick=()=>{clearSave();state.level=0;state.ship=0;hideOverlay();startRun(false);};}
    function startRun(resume){freshLevel();state.mode='play';state.running=true;state.paused=false;updateHud();prompt(resume?`<b>Recovered run:</b> ${current().name}. Fill the ${current().cart}.`:`<b>Route 01:</b> collect a part, bring it to the <b>Scrap Sled</b>, and press <b>X LOAD</b>.`,resume?'Y SCAN':'X LOAD');}
    function prompt(html,key){promptCopy.innerHTML=html;promptKey.textContent=key;}
    function toast(text){state.toast=text;state.toastUntil=performance.now()+2400;$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2400);}
    function worldGround(){return GROUND;}
    function nearby(x,y,range){return Math.hypot(state.p.x-x,state.p.y-y)<range;}
    function addFx(x,y,color,count=8){for(let i=0;i<count;i++)state.particles.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*4-1,life:25+Math.random()*18,color});}
    function beginJump(){if(!state.p.grounded||state.p.layer==='tunnel')return;state.p.vy=-12.4;state.p.grounded=false;addFx(state.p.x+14,GROUND,'#d7e6ef',5);}
    function interaction(){const p=state.p,l=current();if(p.layer==='tunnel'){const exit=Math.min(l.world-28,l.tunnel[1]+88);p.layer='surface';p.x=exit;p.y=382;p.vx=0;toast('Tunnel exit found. The Moon is unhelpful again.');prompt('<b>Surface route restored.</b> A jumps to the teal salvage. B picks it up.','A JUMP');return;}
      const part=state.parts.find(o=>!o.done&&nearby(o.x,o.y,74));if(part&&!state.carrying){part.done=true;state.carrying=part;addFx(part.x,part.y,'#77e7da',8);toast(`${part.name} acquired. Do not put it in your pocket.`);prompt(`<b>Carrying:</b> ${part.name}. Return to the sled at the far left and press <b>X LOAD</b>.`,'X LOAD');return;}
      if(state.carrying&&nearby(185,380,95)){loadSled();return;}
      const obstacle=state.obstacles.find(o=>!o.done&&nearby(o.x,GROUND-o.h/2,84));if(obstacle){obstacle.done=true;addFx(obstacle.x,GROUND-20,obstacle.type==='boulder'?'#bec8d0':'#f7b06e',13);toast(`${obstacle.label} — problem relocated.`);prompt(`<b>Route opened.</b> Find the next part, then carry it all the way back to the ${l.cart}.`,'X LOAD');return;}
      const entry=l.tunnel[0];if(Math.abs(p.x-entry)<85){p.layer='tunnel';p.x=entry+25;p.y=382;p.vx=0;toast('Into the tunnel. B exits safely from anywhere inside.');prompt('<b>Tunnel route:</b> move right if you want, then press <b>B USE</b> anytime to exit safely.','B EXIT');return;}
      if(state.carrying){toast('You are carrying something. The sled is back at the far left.');return;}
      toast('Nothing useful at arm’s length. Scan, jump, or walk it off.');}
    function loadSled(){if(!state.carrying)return;if(!nearby(185,380,110)){toast('The sled is left of the crash route. Bring the part to it.');return;}state.loaded++;const part=state.carrying;state.carrying=null;addFx(185,392,'#ffc966',12);updateHud();toast(`${part.name} loaded. Sled ${state.loaded}/${current().cap}.`);if(state.loaded===current().cap){setTimeout(buildCard,650);return;}prompt(`<b>Sled ${state.loaded}/${current().cap} loaded.</b> Go get the next part. The slope will pretend it does not care.`, 'Y SCAN');}
    function scan(){if(state.p.layer==='tunnel'){state.scan=0;toast('Tunnel scan: follow the teal rail, then press B to exit safely.');prompt('<b>In a tunnel:</b> press <b>B USE</b> anytime to return to the surface.','B EXIT');return;}state.scan=260;toast('Scan on: parts glow teal. Obstacles glow warm. Your dignity remains untracked.');prompt('<b>Scan active.</b> Teal = salvage. Amber = something to use or move.','B USE');}
    function handleActions(){if(input.just.start){input.just.start=false;pauseCard();return;}if(input.just.select){input.just.select=false;helpCard();return;}if(input.just.jump)beginJump();if(input.just.use)interaction();if(input.just.load)loadSled();if(input.just.scan)scan();for(const k in input.just)input.just[k]=false;}
    function collision(dt){const p=state.p;if(p.layer==='tunnel'){p.y=382;p.vy=0;p.grounded=true;return;}const oldX=p.x;p.x+=p.vx*dt;for(const o of state.obstacles){if(o.done)continue;const left=o.x-o.w/2,right=o.x+o.w/2,top=GROUND-o.h;if(p.x+18>left&&p.x-12<right&&p.y+43>top){p.x=oldX;p.vx*=-.25;addFx(p.x+12,p.y+28,'#ffe58a',4);toast('BONK. The obstacle has strong opinions. Try B USE.');break;}}
      p.vy+=.54*dt;p.y+=p.vy*dt;p.grounded=false;let landing=GROUND;for(const plat of current().platforms){const [x,y,w]=plat;if(p.x+13>x&&p.x-13<x+w&&p.vy>=0&&p.y+48>=y&&p.y+48-p.vy*dt<=y)landing=Math.min(landing,y);}if(p.y+48>=landing){p.y=landing-48;p.vy=0;p.grounded=true;}p.x=Math.max(28,Math.min(current().world-28,p.x));}
    function update(dt){if(!state.running||state.mode!=='play'||state.paused)return;const p=state.p;let move=(input.left?-1:0)+(input.right?1:0);if(move){p.vx+=move*.62*dt;p.vx=Math.max(-5.8,Math.min(5.8,p.vx));p.facing=move<0?-1:1;}else p.vx*=Math.pow(.78,dt);collision(dt);state.camera+=((Math.max(0,Math.min(current().world-W,p.x-W*.38)))-state.camera)*Math.min(1,.13*dt);if(state.scan>0)state.scan-=dt;state.flash=Math.max(0,state.flash-dt);state.particles=state.particles.filter(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=.16*dt;f.life-=dt;return f.life>0;});handleActions();}
    function drawSky(){const grad=ctx.createLinearGradient(0,0,0,H),moonX=W-105;grad.addColorStop(0,'#061226');grad.addColorStop(.68,'#1c3550');grad.addColorStop(1,'#6c6f8b');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let i=0;i<45;i++){const x=(i*211+71)%W,y=(i*83+29)%275;ctx.fillStyle=i%5?'#cce6ee':'#ffc965';ctx.globalAlpha=.18+(i%4)*.12;ctx.fillRect(x,y,1+(i%3===0),1+(i%2));}ctx.globalAlpha=1;ctx.fillStyle='#829cca';ctx.beginPath();ctx.arc(moonX,103,52,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b9c6e0';ctx.beginPath();ctx.arc(moonX-17,90,13,0,Math.PI*2);ctx.arc(moonX+21,122,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#31445c';ctx.beginPath();ctx.moveTo(0,330);ctx.lineTo(170,250);ctx.lineTo(355,330);ctx.lineTo(520,235);ctx.lineTo(700,330);ctx.lineTo(865,265);ctx.lineTo(W,326);ctx.lineTo(W,430);ctx.lineTo(0,430);ctx.fill();}
    function drawGround(){ctx.fillStyle='#98a4b2';ctx.beginPath();ctx.moveTo(-60,GROUND);for(let x=-60;x<=current().world+60;x+=55)ctx.lineTo(x,GROUND+Math.sin(x*.024)*6+Math.cos(x*.051)*3);ctx.lineTo(current().world+60,H);ctx.lineTo(-60,H);ctx.closePath();ctx.fill();ctx.fillStyle='#626e80';for(let x=20;x<current().world;x+=190){ctx.beginPath();ctx.ellipse(x,GROUND+31,36,9,0,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#d6dce0';ctx.globalAlpha=.4;for(let x=80;x<current().world;x+=127){ctx.beginPath();ctx.arc(x,GROUND+Math.sin(x)*6,2+(x%5),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
    function drawPlatform(x,y,w){ctx.fillStyle='#6c7888';ctx.fillRect(x,y,w,14);ctx.fillStyle='#b3bfca';ctx.fillRect(x+6,y,w-12,4);ctx.fillStyle='#4d5969';ctx.fillRect(x+15,y+14,w-30,10);}
    function drawTunnel(){const [a,b]=current().tunnel;ctx.fillStyle='#434d5e';ctx.fillRect(a-42,GROUND-84,105,84);ctx.beginPath();ctx.arc(a+10,GROUND-80,52,Math.PI,0);ctx.fill();ctx.fillStyle='#101b2c';ctx.fillRect(a-31,GROUND-79,81,79);ctx.beginPath();ctx.arc(a+10,GROUND-78,40,Math.PI,0);ctx.fill();ctx.fillStyle='#91b4c8';ctx.font='800 10px ui-rounded, sans-serif';ctx.fillText('TUNNEL',a-22,GROUND-100);if(state.p.layer==='tunnel'){ctx.fillStyle='#263347';ctx.fillRect(a,GROUND-51,b-a,51);ctx.fillStyle='#536279';ctx.fillRect(a,GROUND-51,b-a,8);for(let x=a+26;x<b;x+=64){ctx.fillStyle='#75dfd3';ctx.globalAlpha=.45;ctx.fillRect(x,GROUND-39,7,4)}ctx.globalAlpha=1;ctx.fillStyle='#7df3e1';ctx.fillRect(b-5,GROUND-70,10,70);ctx.fillStyle='#d7fff1';ctx.font='900 10px ui-rounded, sans-serif';ctx.fillText('B EXIT SAFE',b-33,GROUND-83);}}
    function drawObstacle(o){const x=o.x,y=GROUND-o.h;if(o.done){ctx.globalAlpha=.35;ctx.fillStyle='#586574';ctx.fillRect(x-o.w/2,GROUND-8,o.w,8);ctx.globalAlpha=1;return;}ctx.save();ctx.translate(x,y);if(o.type==='boulder'){ctx.fillStyle='#596575';ctx.beginPath();ctx.arc(0,o.h*.52,o.w*.48,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8290a0';ctx.beginPath();ctx.arc(-11,o.h*.36,o.w*.18,0,Math.PI*2);ctx.fill();}else if(o.type==='panel'){ctx.rotate(-.13);ctx.fillStyle='#ee9b71';ctx.fillRect(-o.w/2,8,o.w,o.h-15);ctx.fillStyle='#ffca81';ctx.fillRect(-o.w/2+8,15,o.w-16,9);ctx.fillStyle='#754a52';ctx.fillRect(-o.w/2+12,38,o.w-24,7);}else{ctx.fillStyle='#b87957';ctx.fillRect(-o.w/2,10,o.w,o.h-10);ctx.strokeStyle='#ffd58b';ctx.lineWidth=3;ctx.strokeRect(-o.w/2+5,15,o.w-10,o.h-20);ctx.beginPath();ctx.moveTo(-o.w/2+6,16);ctx.lineTo(o.w/2-5,o.h-7);ctx.moveTo(o.w/2-5,16);ctx.lineTo(-o.w/2+6,o.h-7);ctx.stroke();}ctx.restore();if(state.scan>0){ctx.strokeStyle='#ffbc70';ctx.lineWidth=2;ctx.strokeRect(x-o.w/2-4,y-4,o.w+8,o.h+8);ctx.fillStyle='#ffdf9d';ctx.font='800 10px ui-rounded,sans-serif';ctx.fillText('USE',x-o.w/2,y-10);}}
    function drawPart(part){if(part.done)return;const bob=Math.sin(performance.now()*.004+part.id)*4;ctx.save();ctx.translate(part.x,part.y+bob);ctx.shadowColor='#65f2df';ctx.shadowBlur=state.scan>0?24:13;ctx.fillStyle='#6de0cf';ctx.fillRect(-15,-10,30,20);ctx.fillStyle='#d7ffef';ctx.fillRect(-8,-6,16,7);ctx.fillStyle='#ffca70';ctx.fillRect(-4,10,8,5);ctx.shadowBlur=0;ctx.restore();if(state.scan>0){ctx.fillStyle='#d7ffef';ctx.font='800 10px ui-rounded,sans-serif';ctx.textAlign='center';ctx.fillText(part.name,part.x,part.y-23+bob);ctx.textAlign='left';}}
    function drawSled(){const x=176,y=GROUND-14;ctx.save();ctx.translate(x,y);ctx.fillStyle='#283c56';ctx.fillRect(-64,-14,128,15);ctx.fillStyle='#ffb36d';ctx.fillRect(-48,-38,96,27);ctx.fillStyle='#ffe0a2';ctx.fillRect(-41,-34,82,6);ctx.strokeStyle='#263346';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-55,4);ctx.quadraticCurveTo(-25,17,0,7);ctx.quadraticCurveTo(27,17,58,4);ctx.stroke();ctx.fillStyle='#0a1828';ctx.font='900 11px ui-rounded,sans-serif';ctx.textAlign='center';ctx.fillText(current().cart.toUpperCase(),0,-22);ctx.textAlign='left';for(let i=0;i<state.loaded;i++){ctx.fillStyle=i%2?'#ff9fb7':'#75e0d4';ctx.fillRect(-41+i*14,-36,10,18);}ctx.restore();if(state.scan>0){ctx.strokeStyle='#77e7da';ctx.lineWidth=2;ctx.strokeRect(x-68,y-45,136,58);}}
    function drawAlien(){const p=state.p;ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.facing,1);const walking=Math.abs(p.vx)>.3;const leg=Math.sin(performance.now()*.016*Math.max(1,Math.abs(p.vx)))*5;ctx.fillStyle='#303c56';ctx.fillRect(-9,24,7,18);ctx.fillRect(5,24,7,18);ctx.fillStyle='#293549';ctx.fillRect(-11,40,11,5);ctx.fillRect(4,40,11,5);ctx.fillStyle='#819472';ctx.fillRect(-14,0,28,31);ctx.fillStyle='#647955';ctx.fillRect(-16,7,32,17);ctx.fillStyle='#121d2e';ctx.beginPath();ctx.ellipse(0,-8,21,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5dd9ce';ctx.beginPath();ctx.ellipse(0,-9,16,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d7fff1';ctx.beginPath();ctx.ellipse(-6,-9,3.5,4,0,0,Math.PI*2);ctx.ellipse(6,-9,3.5,4,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#5a6f7f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(5,-34);ctx.stroke();ctx.fillStyle='#ffc968';ctx.beginPath();ctx.arc(6,-35,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#303c56';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-10,16);ctx.lineTo(-17+(walking?leg:0),29);ctx.moveTo(10,16);ctx.lineTo(18-(walking?leg:0),28);ctx.stroke();if(state.carrying){ctx.fillStyle='#70e2d2';ctx.fillRect(-13,-54,26,17);ctx.fillStyle='#f3c368';ctx.fillRect(-5,-57,10,4);}ctx.restore();}
    function drawWorld(){drawSky();ctx.save();ctx.translate(-state.camera,0);drawGround();for(const p of current().platforms)drawPlatform(...p);drawTunnel();drawSled();for(const o of state.obstacles)drawObstacle(o);for(const part of state.parts)drawPart(part);drawAlien();for(const f of state.particles){ctx.globalAlpha=Math.max(0,f.life/42);ctx.fillStyle=f.color;ctx.fillRect(f.x,f.y,3,3);}ctx.globalAlpha=1;ctx.restore();ctx.fillStyle='#d8e8ef';ctx.font='900 12px ui-rounded,sans-serif';ctx.fillText(`ROUTE ${String(state.level+1).padStart(2,'0')} · ${current().name}`,16,24);ctx.fillStyle='#9ab3c5';ctx.font='700 10px ui-rounded,sans-serif';ctx.fillText(current().tag+' · '+current().line,16,41);}
    function render(t){const dt=Math.min(2.2,(t-state.last||16.6)/16.666);state.last=t;update(dt);ctx.clearRect(0,0,W,H);drawWorld();requestAnimationFrame(render);}
    function setVisual(key,value){document.querySelectorAll(`[data-input="${key}"],[data-direction="${key}"]`).forEach(b=>b.classList.toggle('active',value));}
    function setInput(key,value){if(value&&key==='select'&&state.paused){input.select=true;input.just.select=false;helpCard();setVisual('select',true);return;}if(value&&key==='start'&&state.paused){input.start=true;input.just.start=false;state.paused=false;hideOverlay();setVisual('start',true);return;}if(value&&key==='start'&&!state.running&&state.mode==='start'){input.start=true;input.just.start=false;hideOverlay();startRun(load());setVisual('start',true);return;}if(value&&!input[key]&&input.just[key]!==undefined)input.just[key]=true;input[key]=value;setVisual(key,value);}
    function haptic(){try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}}
    function setDirection(direction){for(const key of ['up','down','left','right'])setInput(key,key===direction);}
    function directionAt(event){const r=dpad.getBoundingClientRect(),dx=event.clientX-(r.left+r.width/2),dy=event.clientY-(r.top+r.height/2),dead=Math.min(r.width,r.height)*.13;if(Math.max(Math.abs(dx),Math.abs(dy))<dead)return null;return Math.abs(dx)>=Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');}
    let dpadPointer=null,dpadDirection=null;
    function updateDpad(event,feedback=false){const next=directionAt(event);if(next===dpadDirection)return;dpadDirection=next;setDirection(next);if(feedback&&next)haptic();}
    dpad.addEventListener('pointerdown',event=>{event.preventDefault();dpadPointer=event.pointerId;dpad.setPointerCapture?.(event.pointerId);updateDpad(event,true);});
    dpad.addEventListener('pointermove',event=>{if(event.pointerId===dpadPointer)updateDpad(event,true);});
    for(const type of ['pointerup','pointercancel','lostpointercapture'])dpad.addEventListener(type,event=>{if(event.pointerId!==dpadPointer)return;dpadPointer=null;dpadDirection=null;setDirection(null);});
    document.querySelectorAll('[data-input]').forEach(button=>{const k=button.dataset.input;button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture?.(e.pointerId);setInput(k,true);haptic();});['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(type=>button.addEventListener(type,e=>{if(type==='pointerleave'&&button.hasPointerCapture?.(e.pointerId))return;setInput(k,false);}));});
    const keyMap={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down',z:'jump',' ':'jump',x:'use',c:'load',v:'scan',enter:'start',p:'start',tab:'select','`':'select'};
    addEventListener('keydown',e=>{const k=keyMap[e.key.toLowerCase()];if(k){e.preventDefault();setInput(k,true);}});addEventListener('keyup',e=>{const k=keyMap[e.key.toLowerCase()];if(k){e.preventDefault();setInput(k,false);}});addEventListener('blur',()=>Object.keys(input).forEach(k=>{if(k!=='just'&&typeof input[k]==='boolean')setInput(k,false);}));document.addEventListener('visibilitychange',()=>{if(document.hidden)Object.keys(input).forEach(k=>{if(k!=='just'&&typeof input[k]==='boolean')setInput(k,false);});});
    $('help').onclick=helpCard;canvas.addEventListener('pointerdown',()=>{if($('overlay').hidden)canvas.focus?.();});startCard();requestAnimationFrame(render);
  })();
