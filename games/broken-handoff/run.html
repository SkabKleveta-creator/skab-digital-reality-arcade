.header{display:grid;grid-template-columns:340px minmax(320px,1fr) 620px;align-items:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#10171d,#080b0e);box-shadow:0 8px 20px var(--shadow);padding:0 20px;gap:14px}.brand h1{margin:0;font-size:31px;letter-spacing:1.6px;font-weight:950;line-height:.95;text-transform:uppercase}.brand .tag{color:var(--gold2);font-weight:850;font-size:12px;letter-spacing:1px;margin-top:5px;text-transform:uppercase}.sceneTitle{text-align:center;border-left:1px solid #303740;border-right:1px solid #303740;padding:8px 8px}.sceneTitle .n{font-size:20px;font-weight:950;letter-spacing:.5px}.sceneTitle .label{color:var(--gold2);font-weight:850;font-size:12px;text-transform:uppercase;margin-top:4px}.meters{display:grid;grid-template-columns:1fr 1fr 1fr 94px;gap:14px;align-items:center}.meterLabel{font-size:12px;color:var(--muted);font-weight:850;letter-spacing:1px;text-transform:uppercase}.strainBoxes{display:flex;gap:5px;align-items:center;margin-top:4px}.box{width:17px;height:17px;border:1px solid #725b21;border-radius:4px;background:transparent}.box.on{background:var(--gold);box-shadow:0 0 10px rgba(215,169,52,.45)}.bigNum{font-size:21px;font-weight:950;margin-left:8px}.pill,.chip{display:inline-block;margin-top:5px;padding:4px 10px;border:1px solid var(--gold);border-radius:999px;color:var(--gold2);font-weight:850;font-size:11px;text-align:center;text-transform:uppercase;letter-spacing:.35px}.pill.green{border-color:#d6c7ad;color:#f0e7d8}.pill.red{border-color:#d6c7ad;color:#f0e7d8}.viewToggle{border:1px solid #58616b;background:#151b20;color:#f2efe6;border-radius:7px;padding:10px 10px;font-weight:900;font-size:12px;text-transform:uppercase;cursor:pointer;white-space:nowrap}.viewToggle:hover{filter:brightness(1.14)}

.right{display:grid;grid-template-rows:auto 1fr 104px}.tableHeader{padding:12px 18px;border-bottom:1px solid #2f363d;background:linear-gradient(90deg,rgba(255,255,255,.045),rgba(255,255,255,0))}.tableHeader h2{font-size:18px;margin:0;text-transform:uppercase;letter-spacing:.4px}.tableHeader p{margin:6px 0 0;color:#cfc6ba;font-size:13px}.tabletop{min-height:0;padding:16px;background:linear-gradient(145deg,rgba(83,49,22,.55),rgba(24,17,12,.8)),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 80px);display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));grid-auto-rows:minmax(205px,1fr);gap:14px;overflow:auto}.card{background:linear-gradient(180deg,#f5ecd8,#e8dac0);border:2px solid #60584c;border-radius:7px;color:#14100c;box-shadow:0 9px 14px rgba(0,0,0,.45);padding:10px;position:relative;display:flex;flex-direction:column;min-height:195px;animation:deal .22s ease-out both}.card.green{border-color:#73695d}.card.gap{border-color:#73695d}.card.ai{border-color:#73695d}.card.pressure{border-color:#73695d}.card.validation{border-color:#73695d}.card.evidence{border-color:#73695d}.cardHead{display:flex;align-items:center;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:6px;margin-bottom:7px;gap:7px}.eid{background:#3d3d38;color:#fff;border-radius:3px;padding:3px 6px;font-weight:950;font-size:12px}.card.green .eid{background:#3d3d38}.card.gap .eid{background:#3d3d38}.card.ai .eid{background:#3d3d38}.card.pressure .eid{background:#3d3d38}.card.validation .eid{background:#3d3d38}.ctitle{font-weight:950;text-transform:uppercase;font-size:12.5px;letter-spacing:.3px}.kind{margin-left:auto;font-size:10px;text-transform:uppercase;font-weight:950;color:#3e352d;opacity:.8}.ctext{font-size:13.3px;line-height:1.27;flex:1}.icon{font-size:33px;text-align:center;margin:9px 0;color:rgba(40,30,20,.78);font-weight:950}.source{font-size:10.8px;line-height:1.22;color:#211a14}.tracks{border-top:1px solid #2f363d;background:rgba(5,7,8,.84);display:grid;grid-template-columns:1fr 1fr;gap:0;padding:12px 18px}.trackBlock:first-child{border-right:1px solid #353b42}.trackBlock:last-child{padding-left:18px}.trackTitle{font-weight:950;text-transform:uppercase;font-size:13px;margin-bottom:10px}.trackSteps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}.dot{width:23px;height:23px;border:1px solid #7d7d78;border-radius:50%;margin:0 auto 4px;background:#191b1d}.dot.on{background:var(--gold);border-color:var(--gold2);box-shadow:0 0 12px rgba(215,169,52,.45)}.step{font-size:10.5px;color:#c8c1b8}
.footer{border-top:1px solid #252d34;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:0 24px;background:#0a0d10;color:#d5d0c8}.footer b{font-size:13px}.elapsed{text-align:center;color:#a9a39a}.end{text-align:right}.smallBtn{padding:9px 16px;border:1px solid #474e56;background:#1a1f25;color:#ddd;border-radius:6px;font-weight:850;cursor:pointer}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:20}.modal{width:min(980px,92vw);max-height:88vh;overflow:auto;background:#11161a;border:1px solid #69717b;border-radius:10px;box-shadow:0 20px 50px #000;padding:22px}.modal h2{margin:0 0 8px;font-size:28px}.modal p{color:#d6d0c8;line-height:1.45}.startTitle{font-size:40px;font-weight:950;letter-spacing:1px;text-transform:uppercase}.selectorGrid{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:14px;margin-top:16px}.scenarioCard{border:1px solid #3e4650;border-radius:10px;background:linear-gradient(180deg,#1a2026,#11161a);padding:15px;min-height:250px;display:flex;flex-direction:column}.scenarioCard h3{margin:0 0 8px;font-size:20px;line-height:1.05}.scenarioCard p{font-size:13px;margin:7px 0;color:#d7d0c7}.scenarioMeta{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}.scenarioCard .btn{margin-top:auto}.aarGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.aarBox{background:#171d22;border:1px solid #3b444e;border-radius:8px;padding:12px}.decisionLog{font-size:13px;border-top:1px solid #333;margin-top:8px;padding-top:8px}.toast{position:fixed;top:99px;left:50%;transform:translateX(-50%);background:#1d241c;border:1px solid #648b55;color:#e8ffe3;padding:10px 16px;border-radius:8px;display:none;z-index:30;box-shadow:0 8px 22px #000}.right.evidenceFocus{outline:2px solid rgba(217,169,58,.82);outline-offset:-2px}
.decisionFeedback{border:1px solid #6c665d;background:#161b20;border-radius:8px;padding:10px 12px;margin:9px 0 11px;color:#e7dfd3;font-size:13px;line-height:1.35}.decisionFeedback b{display:block;text-transform:uppercase;letter-spacing:.35px;font-size:11px;color:#d6c7ad;margin-bottom:4px}.decisionFeedback .cat{font-weight:950;text-transform:uppercase}.egrid{display:grid;gap:7px;margin-top:2px}.erow{font-size:12.7px;line-height:1.32;padding:2px 0}.erow b{font-size:10.7px;text-transform:uppercase;letter-spacing:.25px;color:#3a3128}.doctrineTag{font-size:11px;color:#bfb7ad;margin-top:4px;text-transform:uppercase;font-weight:850;letter-spacing:.35px}.decisionLog .bad{color:#f0b8b1}.decisionLog .warn{color:#f3d69b}.decisionLog .good{color:#dfe8d6}
body.compact .main{grid-template-columns:minmax(420px,690px) 1fr}body.compact .right{display:none}body.compact .main:after{content:'Evidence is hidden in Compact View. Use Review Evidence to open the tabletop spread.';display:block;border:1px dashed #555c65;border-radius:8px;color:#cfc6ba;padding:18px;background:rgba(10,13,16,.75);align-self:start}.mobileHint{display:none}@keyframes deal{from{opacity:0;transform:translateY(16px) rotate(-1deg)}to{opacity:1;transform:translateY(0) rotate(0)}}

<script>
'use strict';
const SCENARIOS = [{"id":"green-check","title":"The Green Check That Lied","domain":"System repair / validation","lesson":"False completion","premise":"The handoff is marked complete. Users still report the same failure. The board is green, but validation is not proven.","est":"8–12 min","status":"Playable","tag":"System Repair","translationWarning":"A clean dashboard can preserve a False story when the validation artifact is missing or stale.","discussion":["What did you trust first?","Which evidence made the green status suspect?","Where did pressure enter the decision?","Did the status artifact prove the outcome?","What should the next team know?","What would you refuse to sign?"],"scenes":[{"label":"Initial False Green","situation":"The status board shows the handoff complete. Prior shift says the issue is validated and ready. Two users report the process still fails at the same handoff point.","question":"What do you do first?","evidence":[["E1","Status","SYSTEM STATUS","Dashboard shows all checks complete and no active blockers.","Monitoring System","green","GREEN CHECK"],["E2","Evidence","PRIOR SHIFT NOTE","The handoff says: “Validated. Ready for production.”","Shift Handoff","evidence","👁"],["E3","Gap","USER REPORTS","Two users report the process still fails at the same handoff point.","Service Desk","gap","👥"]],"options":[{"option_id":"green-check_s1_pull_source_records","title":"Pull source records","detail":"Check original records before acting on the board.","tag":"preserve","strain":0,"best":true,"category":"doctrine_aligned","score":2,"disqualifying":false,"explanation":"This strengthens the handoff because source evidence, validation, and ownership stay in the same chain. It may slow closure, but the next owner can see what was proven and what remains open. This is doctrine-aligned because status follows proof."},{"option_id":"green-check_s1_accept_current_status","title":"Accept current status","detail":"Treat the board as current and begin normal closure.","tag":"appearance","strain":1,"best":false,"category":"doctrine_violation","score":-2,"disqualifying":true,"explanation":"This is disqualifying because it allows closure, acceptance, or operational movement while the validation gap remains unresolved. That turns apparent progress into false closure. A later team would inherit a clean-looking record without proof."},{"option_id":"green-check_s1_ask_for_priority","title":"Ask for priority","detail":"Let leadership choose speed, delay, or risk.","tag":"pressure","strain":1,"best":false,"category":"risk_transfer","score":-1,"disqualifying":false,"explanation":"This moves decision pressure to another owner before the evidence chain is complete. That is not automatically fatal if the facts, gap, recommendation, and owner are preserved. As written, it weakens the handoff and should appear as accepted or unresolved risk."},{"option_id":"green-check_s1_call_prior_shift","title":"Call prior shift","detail":"Clarify what validation meant before closure.","tag":"evidence","strain":0,"best":true,"category":"doctrine_aligned","score":2,"disqualifying":false,"explanation":"This strengthens the handoff because source evidence, validation, and ownership stay in the same chain. It may slow closure, but the next owner can see what was proven and what remains open. This is doctrine-aligned because status follows proof."}]},{"label":"Leadership Pressure","situation":"Leadership wants the ticket closed before the next brief. The dashboard still looks clean, but no one has produced the validation artifact.","question":"What do you protect under pressure?","evidence":[["E4","Pressure","LEADERSHIP MESSAGE","“Need this green for the 1500 update. Close if no blockers.”","Ops Lead","pressure","⏱"],["E5","Gap","MISSING ARTIFACT","No signed validation record is attached to the handoff package.","Records Check","gap","⚠"],["E6","Evidence","QUEUE HISTORY","Similar failure was reopened twice after green status.","Ticket Queue","evidence","↻"]],"options":[{"option_id":"green-check_s2_close_with_note","title":"Close with note","detail":"Record uncertainty and still meet the brief.","tag":"pressure","strain":1,"best":false,"category":"risk_transfer","score":-1,"disqualifying":false,"explanation":"This moves decision pressure to another owner before the evidence chain is complete. That is not automatically fatal if the facts, gap, recommendation, and owner are preserved. As written, it weakens the handoff and should appear as accepted or unresolved risk."},{"option_id":"green-check_s2_summarize_with_ai","title":"Summarize with AI","detail":"Use AI wording as support for the brief.","tag":"ai","strain":1,"best":false,"category":"doctrine_violation","score":-2,"disqualifying":false,"explanation":"This weakens the handoff because it leans on appearance, summary, or partial proof before validation is complete. It is recoverable if the team stops closure and rebuilds the evidence chain. The AAR should mark it as a doctrine warning, not as a personal failure."},{"option_id":"green-check_s2_hold_for_proof","title":"Hold for proof","detail":"Require validation evidence before closure.","tag":"preserve","strain":0,"best":true,"category":"doctrine_aligned","score":2,"disqualifying":false,"explanation":"This strengthens the handoff because source evidence, validation, and ownership stay in the same chain. It may slow closure, but the next owner can see what was proven and what remains open. This is doctrine-aligned because status follows proof."},{"option_id":"green-check_s2_route_backward","title":"Route backward","detail":"Return the case to the prior shift owner.","tag":"handoff","strain":1,"best":false,"category":"risk_transfer","score":-1,"disqualifying":false,"explanation":"This moves decision pressure to another owner before the evidence chain is complete. That is not automatically fatal if the facts, gap, recommendation, and owner are preserved. As written, it weakens the handoff and should appear as accepted or unresolved risk."}]},{"label":"Conflicting Evidence","situation":"The log shows the repair script completed. User reports continue. The automated test passed, but the timestamp appears older than the latest failure.","question":"Which evidence matters most now?","evidence":[["E7","Evidence","REPAIR LOG","Repair script completed with no reported errors.","System Log","evidence","📄"],["E8","Status","TEST RESULT","Automated tests passed before the latest user failure.","Test Suite","green","☑"],["E9","Gap","LATEST FAILURE","User failure was reported after automated test completion.","Service Desk","gap","✖"]],"options":[{"option_id":"green-check_s3_trust_repair_log","title":"Trust repair log","detail":"The script completed cleanly, so proceed.","tag":"appearance","strain":1,"best":false,"category":"doctrine_violation","score":-2,"disqualifying":true,"explanation":"This is disqualifying because it allows closure, acceptance, or operational movement while the validation gap remains unresolved. That turns apparent progress into false closure. A later team would inherit a clean-looking record without proof."},{"option_id":"green-check_s3_repeat_old_test","title":"Repeat old test","detail":"Run the same validation again now.","tag":"partial","strain":1,"best":false,"category":"incomplete_recoverable","score":1,"disqualifying":false,"explanation":"This is recoverable because it recognizes part of the risk, but it does not fully prove the condition or assign the next action. It can remain usable if the AAR preserves the missing proof. It should not be treated as clean closure."},{"option_id":"green-check_s3_escalate_conflict","title":"Escalate conflict","detail":"Push the mismatch to leadership.","tag":"pressure","strain":1,"best":false,"category":"risk_transfer","score":-1,"disqualifying":false,"explanation":"This moves decision pressure to another owner before the evidence chain is complete. That is not automatically fatal if the facts, gap, recommendation, and owner a let state = { view:'table', selected:null, scenario:null, scene:0, strain:0, reopenUsed:false, decisions:[], evidenceSeen:[], aar:false, aarNotes:[], started:false, startTime:null };
const app=document.getElementById('app'), overlay=document.getElementById('overlay'), toast=document.getElementById('toast');

function optTitle(o){return o.title!==undefined?o.title:o[0]}
function optDetail(o){return o.detail!==undefined?o.detail:o[1]}
function optTag(o){return o.tag!==undefined?o.tag:o[2]}
function optStrain(o){return o.strain!==undefined?o.strain:o[3]}
function optBest(o){return o.best!==undefined?!!o.best:!!o[4]}
function optCategory(o){return o.category || (optBest(o)?'doctrine_aligned':(optTag(o)==='partial'?'incomplete_recoverable':(['pressure','handoff'].includes(optTag(o))?'risk_transfer':'doctrine_violation')))}
function optScore(o){return o.score!==undefined?o.score:({'doctrine_aligned':2,'incomplete_recoverable':1,'risk_transfer':-1,'doctrine_violation':-2}[optCategory(o)]||0)}
function optDisqualifying(o){return !!o.disqualifying}
function optExplanation(o){return o.explanation || 'This choice should be reviewed against the doctrine-to-scoring rule.'}
function categoryLabel(cat){return ({doctrine_aligned:'Doctrine-aligned',incomplete_recoverable:'Incomplete but recoverable',risk_transfer:'Risk transfer',doctrine_violation:'Doctrine violation'}[cat]||cat)}
function categoryClass(cat){return cat==='doctrine_aligned'?'good':(cat==='incomplete_recoverable'?'warn':'bad')}
function runMetrics(){const decisions=state.decisions||[]; const aligned=decisions.filter(d=>d.category==='doctrine_aligned').length; const incomplete=decisions.filter(d=>d.category==='incomplete_recoverable').length; const transfers=decisions.filter(d=>d.category==='risk_transfer').length; const violations=decisions.filter(d=>d.category==='doctrine_violation').length; const disq=decisions.filter(d=>d.disqualifying).length; const score=decisions.reduce((n,d)=>n+(d.score||0),0); return {decisions,aligned,incomplete,transfers,violations,disq,score,total:decisions.length}}
function outcomeText(){const m=runMetrics(); if(m.total<7) return 'Pending'; if(m.disq>0) return 'Failed Validation'; if(m.violations>0 || m.transfers>=2 || state.strain>=6) return 'At Risk'; if(m.aligned>=7 && m.transfers===0 && m.violations===0 && state.strain<=2) return 'Validated'; if(m.aligned>=5) return 'Conditional'; return 'At Risk'}
function outcomeMessage(){const m=runMetrics(); if(m.disq>0) return 'Validation failed because one decision broke the evidence chain.'; if(m.violations>0) return 'A doctrine warning remains unresolved.'; if(m.transfers>=2) return 'Risk was transferred before proof was preserved.'; if(state.strain>=6) return 'High strain left the handoff unstable.'; if(outcomeText()==='Validated') return 'Evidence preserved and validation protected.'; if(outcomeText()==='Conditional') return 'Mostly usable, but unresolved risk remains.'; if(outcomeText()==='Pending') return 'Decision chain still forming.'; return 'Appearance or pressure outweighed proof.'}
function fairnessNote(){const m=runMetrics(); if(m.disq>0) return 'This result is not saying the player failed at the job. It means the handoff cannot be called validated because at least one locked choice created false closure, unsupported acceptance, or silent transfer of unresolved risk.'; if(m.violations>0) return 'The run remains usable, but the AAR should preserve the doctrine warning and identify what proof must be rebuilt before closure.'; if(m.transfers>=2) return 'Several choices moved pressure or ownership before the evidence chain was complete. That may be realistic, but it must be documented as accepted or unresolved risk.'; if(state.strain>=6) return 'The decision chain produced too much strain to treat the handoff as clean. The repair path should reduce pressure, clarify ownership, and validate the contested evidence.'; if(outcomeText()==='Validated') return 'The run protected source evidence, validation, and ownership well enough to support a strong handoff.'; if(outcomeText()==='Conditional') return 'The run is mostly usable, but the next owner should not inherit it as clean closure. Preserve the unresolved proof gap in the handoff.'; return 'The run needs stronger evidence discipline before it should be treated as a safe handoff.'}
function repairAdvice(){const m=runMetrics(); if(m.disq>0) return 'Repair by reopening the poisoned decision, attaching the missing evidence or accepted-risk statement, and naming the owner of the next validation step.'; if(m.violations>0) return 'Repair by replacing appearance-based acceptance with source evidence and an explicit validation requirement.'; if(m.transfers>=2) return 'Repair by packaging the facts, gap, recommendation, and owner before escalation or leadership acceptance.'; if(state.strain>=6) return 'Repair by reducing deadline pressure, narrowing the decision, and confirming which evidence actually proves the condition.'; if(outcomeText()==='Validated') return 'Preserve this as the reference handoff: what was proven, what was not proven, who owns the next action, and what risk remains.'; return 'Repair by documenting the missing proof, the current owner, and the smallest validation step required before closure.'}
function feedbackHTML(){const f=state.lastFeedback; if(!f)return ''; const cat=esc(categoryLabel(f.category)); return `<div class="decisionFeedback"><b>Last Decision Review</b><span class="cat ${categoryClass(f.category)}">${cat}${f.disqualifying?' · Disqualifying':''}</span><div>${esc(f.explanation)}</div></div>`}
function evidenceDoesNotProve(e){const kind=String(e[1]||'').toLowerCase(); const cls=String(e[5]||'').toLowerCase(); if(kind.includes('status')||cls==='green')return 'It does not prove the actual condition is fixed.'; if(cls==='ai')return 'It does not prove source evidence or operational truth.'; if(cls==='pressure')return 'It does not prove the work is complete or safe to close.'; if(cls==='gap')return 'It does not prove ownership, cause, or resolution.'; if(cls==='validation')return 'It does not prove unrelated handoff steps are clean.'; return 'It does not prove the full handoff is safe.'}
function evidenceRiskIfIgnored(e){const cls=String(e[5]||'').toLowerCase(); if(cls==='green')return 'False green status can become silent risk transfer.'; if(cls==='ai')return 'AI confidence may launder uncertainty into authority.'; if(cls==='pressure')return 'Schedule pressure can turn an open gap into false closure.'; if(cls==='gap')return 'The same failure may reappear downstream.'; if(cls==='validation')return 'A partial test may be mistaken for full proof.'; return 'Missing context can weaken the AAR and next handoff.'}

function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function scenario(){return state.scenario===null?null:SCENARIOS[state.scenario]}
function currentScene(){return scenario().scenes[state.scene]}
function uniqueEvidence(){const map=new Map(); state.evidenceSeen.forEach(e=>map.set(e[0],e)); return [...map.values()]}
function goodDecisions(){return runMetrics().aligned}
function evidenceCount(kind){return uniqueEvidence().filter(e=>e[1].toLowerCase()===kind).length}
function validationStatus(){return outcomeText()}
function chainStatus(){const m=runMetrics(); if(m.disq>0)return 'Broken Chain'; if(m.violations>0||m.transfers>=2)return 'Fragile'; if(m.aligned>=7&&m.transfers===0&&m.violations===0)return 'Strong'; if(m.aligned>=5)return 'Usable'; return 'Thin'}
function render(){document.body.classList.toggle('compact', state.view==='compact'); if(state.scenario===null){renderSelector();return} if(state.aar){renderAAR();return} const sc=currentScene(); sc.evidence.forEach(e=>{if(!state.evidenceSeen.find(x=>x[0]===e[0])) state.evidenceSeen.push(e)}); app.innerHTML=headerHTML()+mainHTML(sc)+footerHTML(); attach()}
function headerHTML(){const s=scenario(); let boxes=''; for(let i=1;i<=8;i++) boxes+=`<span class="box ${state.strain>=i?'on':''}"></span>`; const status=validationStatus(); return `<div class="header"><div class="brand"><h1>Broken Handoff</h1><div class="tag">v0.3.2 · Fairness + AAR Readability</div><div class="mobileHint">Touch still works, but this build is laptop-first.</div></div><div class="sceneTitle"><div class="n">${esc(s.title)}</div><div class="label">Scene ${state.scene+1} of ${s.scenes.length} · ${esc(currentScene().label)}</div></div><div class="meters"><div><div class="meterLabel">Strain</div><div class="strainBoxes">${boxes}<span class="bigNum">${state.strain}</span></div></div><div><div class="meterLabel">Validation</div><span class="pill ${status==='Validated'?'green':(status==='At Risk'||status==='Failed Validation')?'red':''}">${status}</span></div><div><div class="meterLabel">Reopen</div><span class="pill ${!state.reopenUsed?'green':''}">${state.reopenUsed?'Used':'Available'}</span></div><button class="viewToggle" id="viewToggle">${state.view==='compact'?'Show Table':'Compact'}</button></div></div>`}
function mainHTML(sc){const s=scenario(); return `<div class="main"><aside class="left"><div><div class="sectionBar"><span>Situation</span><span class="domainLine">${esc(s.domain)}</span></div><div class="situation"><div class="paper">${esc(sc.situation)}<div class="q">${esc(sc.question)}</div></div></div></div><div class="sectionBar"><span>Decision</span><span class="domainLine">Mouse · Select · Lock</span></div><div class="decision"><div class="hint"><span>Choose your action.</span><span>Choices are visually neutral. AI confidence is evidence, not truth.</span></div>${feedbackHTML()}${sc.options.map((o,i)=>optionHTML(o,i)).join('')}</div><div class="actions"><div class="actionsRow"><button class="btn" id="reviewBtn">Review Evidence</button><button class="btn" id="reconsiderBtn" ${state.selected===null?'disabled':''}>Reconsider</button><button class="btn danger" id="reopenBtn" ${state.reopenUsed||state.decisions.length===0?'disabled':''}>Reopen Last</button><button class="btn primary" id="lockBtn" ${state.selected===null?'disabled':''}>Lock Decision 🔒</button></div><div class="note">Reconsider before lock. One emergency Reopen per run adds Strain +1 and appears in the AAR.</div></div></aside><section class="right"><div class="tableHeader"><h2>Tabletop Evidence Board</h2><p>Each card shows source, what it shows, what it does not prove, and risk if ignored. Appearance is not proof.</p></div><div class="tabletop">${uniqueEvidence().map(cardHTML).join('')}</div>${tracksHTML()}</section></div>`}
function optionHTML(o,i){return `<button class="option ${state.selected===i?'selected':''}" data-option="${i}"><div class="badge">R${i+1}</div><div><div class="otitle">${esc(optTitle(o))}</div><div class="osub">${esc(optDetail(o))}</div><div class="doctrineTag">Neutral response · scoring hidden until lock</div></div></button>`}
function cardHTML(e){const cls=e[5]==='green'?'green':e[5]; return `<article class="card ${cls}"><div class="cardHead"><span class="eid">${esc(e[0])}</span><span class="ctitle">${esc(e[2])}</span><span class="kind">${esc(e[1])}</span></div><div class="egrid"><div class="erow"><b>Source:</b> ${esc(e[4])}</div><div class="erow"><b>What it shows:</b> ${esc(e[3])}</div><div class="erow"><b>What it does not prove:</b> ${esc(evidenceDoesNotProve(e))}</div><div class="erow"><b>Risk if ignored:</b> ${esc(evidenceRiskIfIgnored(e))}</div></div></article>`}
function tracksHTML(){const m=runMetrics(); const val=[m.aligned>=1,m.aligned>=3,m.aligned>=5,m.aligned>=7&&m.disq===0]; const hq=[m.violations===0,m.transfers<=1,m.disq===0,m.aligned>=5&&m.disq===0]; const names1=['Evidence','Cross-check','Validation','Decision']; const names2=['No Violation','Risk Held','No Poison','Actionable']; return `<div class="tracks"><div class="trackBlock"><div class="trackTitle">Validation Track</div><div class="trackSteps">${names1.map((n,i)=>`<div><div class="dot ${val[i]?'on':''}"></div><div class="step">${n}</div></div>`).join('')}</div></div><div class="trackBlock"><div class="trackTitle">Handoff Quality</div><div class="trackSteps">${names2.map((n,i)=>`<div><div class="dot ${hq[i]?'on':''}"></div><div class="step">${n}</div></div>`).join('')}</div></div></div>`}
function footerHTML(){const s=scenario(); return `<div class="footer"><b>${esc(s.title)} · ${esc(s.tag)}</b><div class="elapsed">ESTIMATED PLAYTIME <b>${esc(s.est)}</b> · ELAPSED <b id="elapsed">00:00</b></div><div class="end"><button class="smallBtn" id="selectorBtn">Scenario Selector</button> <button class="smallBtn" id="endBtn">End Run & View AAR</button></div></div>`}
function attach(){document.querySelectorAll('[data-option]').forEach(btn=>btn.onclick=()=>{state.selected=Number(btn.dataset.option);render()}); document.getElementById('reconsiderBtn').onclick=()=>{state.selected=null;render()}; document.getElementById('lockBtn').onclick=lockDecision; document.getElementById('reviewBtn').onclick=showReview; document.getElementById('reopenBtn').onclick=reopenLast; document.getElementById('endBtn').onclick=()=>{state.aar=true;render()}; document.getElementById('selectorBtn').onclick=()=>{state.scenario=null;render()}; const vt=document.getElementById('viewToggle'); if(vt) vt.onclick=()=>{state.view=state.view==='compact'?'table':'compact';render()}; updateElapsed()}
function resetRun(index){state={view:state.view||'table', selected:null, scenario:index, scene:0, strain:0, reopenUsed:false, decisions:[], evidenceSeen:[], aar:false, aarNotes:[], lastFeedback:null, started:true, startTime:Date.now()}; render()}
function lockDecision(){if(state.selected===null)return; const sc=currentScene(), o=sc.options[state.selected]; const decision={scene:state.scene+1,label:sc.label,choice:optTitle(o),detail:optDetail(o),tag:optTag(o),strain:optStrain(o),best:optBest(o),category:optCategory(o),score:optScore(o),disqualifying:optDisqualifying(o),explanation:optExplanation(o),option_id:o.option_id||null}; state.decisions.push(decision); state.lastFeedback={choice:decision.choice,category:decision.category,disqualifying:decision.disqualifying,explanation:decision.explanation}; state.strain=Math.min(8,state.strain+decision.strain+(decision.disqualifying?1:0)); state.selected=null; if(state.scene<scenario().scenes.length-1){state.scene++; setTimeout(render,180)} else {state.aar=true;render()}}
function reopenLast(){if(state.reopenUsed||state.decisions.length===0)return; const last=state.decisions.pop(); state.reopenUsed=true; state.strain=Math.min(8,state.strain+1); state.scene=Math.max(0,last.scene-1); state.selected=null; state.lastFeedback=null; state.aarNotes.push('Decision reopened after lock. Strain +1.'); rebuildEvidenceSeen(); setTimeout(render,180)}
function rebuildEvidenceSeen(){state.evidenceSeen=[]; if(!scenario())return; for(let i=0;i<=state.scene;i++) scenario().scenes[i].evidence.forEach(e=>{if(!state.evidenceSeen.find(x=>x[0]===e[0])) state.evidenceSeen.push(e)})}
function showReview(){
  if(state.view==='compact'){
    state.view='table';
    render();
    setTimeout(scrollEvidenceIntoView,80);
    return;
  }
  scrollEvidenceIntoView();
}
function scrollEvidenceIntoView(){
  const board=document.querySelector('.right');
  const header=document.querySelector('.tableHeader');
  const table=document.querySelector('.tabletop');
  const target=header||board||table;
  if(!target)return;
  if(window.matchMedia && window.matchMedia('(max-width:900px)').matches){
    target.scrollIntoView({behavior:'smooth',block:'start'});
  }else{
    target.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
    if(table && table.scrollTo) table.scrollTo({top:0,behavior:'smooth'});
  }
  if(board){
    board.classList.add('evidenceFocus');
    setTimeout(()=>board.classList.remove('evidenceFocus'),900);
  }
}
function closeOverlay(){if(overlay){overlay.style.display='none';overlay.innerHTML=''}} window.closeOverlay=closeOverlay;
function showToast(msg){ if(window.console&&msg) console.info(msg); }
function renderSelector(){app.innerHTML=`<div class="header"><div class="brand"><h1>Broken Handoff</h1><div class="tag">v0.3.2 · Fairness + AAR Readability</div></div><div class="sceneTitle"><div class="n">Scenario Selector</div><div class="label">Choose one playable decision simulation</div></div><div class="meters"><div><div class="meterLabel">Scenarios</div><span class="pill green">4 Playable</span></div><div><div class="meterLabel">Input</div><span class="pill green">Mouse</span></div><div><div class="meterLabel">Scope</div><span class="pill">Prototype</span></div><button class="viewToggle" id="viewToggle">${state.view==='compact'?'Show Table':'Compact'}</button></div></div><div class="main" style="grid-template-columns:1fr"><div class="modal" style="margin:auto;width:min(1240px,94vw);max-height:none"><div class="startTitle">Broken Handoff v0.3.2</div><p><b>Mission:</b> prove the decision engine can run across multiple domains without turning into a full product. Observe → Review Evidence → Choose → Reconsider / Lock → Validate → AAR.</p><div class="selectorGrid">${SCENARIOS.map((s,i)=>scenarioCard(s,i)).join('')}</div></div></div><div class="footer"><b>Clean tabletop decision simulator</b><div class="elapsed">No backend · no accounts · no database</div><div></div></div>`; const vt=document.getElementById('viewToggle'); if(vt) vt.onclick=()=>{state.view=state.view==='compact'?'table':'compact';render()}; document.querySelectorAll('[data-start]').forEach(btn=>btn.onclick=()=>resetRun(Number(btn.dataset.start)))}
function scenarioCard(s,i){return `<div class="scenarioCard"><h3>${esc(s.title)}</h3><div class="scenarioMeta"><span class="chip">${esc(s.domain)}</span><span class="chip">${esc(s.est)}</span><span class="chip">${esc(s.status)}</span></div><p><b>Lesson:</b> ${esc(s.lesson)}</p><p>${esc(s.premise)}</p><button class="btn primary" data-start="${i}">Start Scenario</button></div>`}
function renderAAR(){const s=scenario(), m=runMetrics(), total=s.scenes.length; const outcome=outcomeText(); const quality=chainStatus(); const preserved=state.decisions.filter(d=>d.category==='doctrine_aligned').map(d=>`Scene ${d.scene}: ${d.choice}`); const weak=state.decisions.filter(d=>d.category!=='doctrine_aligned').map(d=>`Scene ${d.scene}: ${d.choice} (${categoryLabel(d.category)}${d.disqualifying?', disqualifying':''})`); const poisoned=state.decisions.filter(d=>d.disqualifying); const transfers=state.decisions.filter(d=>d.category==='risk_transfer'); const finalMsg=outcomeMessage(); app.innerHTML=`<div class="header"><div class="brand"><h1>Broken Handoff</h1><div class="tag">Scenario-Specific AAR · v0.3.2</div></div><div class="sceneTitle"><div class="n">${esc(s.title)}</div><div class="label">${esc(finalMsg)}</div></div><div class="meters"><div><div class="meterLabel">Strain</div><span class="bigNum">${state.strain}</span></div><div><div class="meterLabel">Validation</div><span class="pill ${outcome==='Validated'?'green':(outcome==='At Risk'||outcome==='Failed Validation')?'red':''}">${outcome}</span></div><div><div class="meterLabel">Reopen</div><span class="pill">${state.reopenUsed?'Used':'Unused'}</span></div><button class="viewToggle" id="viewToggle">${state.view==='compact'?'Show Table':'Compact'}</button></div></div><div class="main" style="grid-template-columns:1fr"><div class="modal" style="width:min(1180px,94vw);max-height:78vh"><h2>AAR — ${esc(s.title)}</h2><p><b>Domain:</b> ${esc(s.domain)}<br><b>Outcome:</b> ${esc(finalMsg)}</p><div class="aarGrid"><div class="aarBox"><b>Run Summary</b><p>Decisions made: ${state.decisions.length} / ${total}<br>Doctrine-aligned: ${m.aligned}<br>Recoverable incomplete: ${m.incomplete}<br>Risk-transfer choices: ${m.transfers}<br>Doctrine violations: ${m.violations}<br>Disqualifying choices: ${m.disq}<br>Final strain: ${state.strain} / 8<br>Validation outcome: ${outcome}<br>Handoff quality: ${quality}</p>${state.aarNotes.length?`<p><b>AAR Note:</b> ${esc(state.aarNotes.join(' '))}</p>`:''}</div><div class="aarBox"><b>Why This Result</b><p>${esc(fairnessNote())}</p><p><b>Repair path:</b><br>${esc(repairAdvice())}</p><p><b>Translation warning:</b><br>${esc(s.translationWarning)}</p></div></div><div class="aarGrid" style="margin-top:12px"><div class="aarBox"><b>Doctrine Review</b><p><b>Broken chain / false closure:</b><br>${poisoned.length?esc(poisoned.map(d=>`Scene ${d.scene}: ${d.choice}`).join(' · ')):'None recorded.'}</p><p><b>Risk transferred:</b><br>${transfers.length?esc(transfers.map(d=>`Scene ${d.scene}: ${d.choice}${d.disqualifying?' (disqualifying)':''}`).join(' · ')):'None recorded.'}</p><p><b>Evidence preserved:</b><br>${preserved.length?esc(preserved.join(' · ')):'None recorded.'}</p><p><b>Ignored / underweighted:</b><br>${weak.length?esc(weak.join(' · ')):'No major weak calls recorded.'}</p></div><div class="aarBox"><b>Discussion Questions</b><p>${s.discussion.map(q=>`• ${esc(q)}`).join('<br>')}</p></div></div><div class="aarGrid" style="margin-top:12px"><div class="aarBox"><b>Decision Timeline</b>${state.decisions.map(d=>`<div class="decisionLog"><b>Scene ${d.scene}: ${esc(d.label)}</b><br>${esc(d.choice)} — <span class="${categoryClass(d.category)}">${esc(categoryLabel(d.category))}${d.disqualifying?' · Disqualifying':''}</span><br>${esc(d.explanation)}</div>`).join('')}</div><div class="aarBox"><b>Scenario Integrity Reminder</b><p>A handoff can look complete and still be unsafe.</p><p>One bad decision should only break the chain when it creates false closure, unsupported acceptance, or silent transfer of unresolved risk. Otherwise, the run should preserve the weakness as recoverable risk.</p></div></div><p style="text-align:right"><button class="btn" id="copyBtn">Copy AAR</button> <button class="btn" id="selectorBtn">Scenario Selector</button> <button class="btn primary" id="restartBtn">Restart Scenario</button></p></div></div><div class="footer"><b>${esc(s.title)} · AAR</b><div class="elapsed">A handoff can look complete and still be unsafe.</div><div></div></div>`; document.getElementById('restartBtn').onclick=()=>resetRun(state.scenario); document.getElementById('selectorBtn').onclick=()=>{state.scenario=null;render()}; document.getElementById('copyBtn').onclick=copyAAR; const vt=document.getElementById('viewToggle'); if(vt) vt.onclick=()=>{state.view=state.view==='compact'?'table':'compact';render()} }
function copyAAR(){const s=scenario(), m=runMetrics(), outcome=outcomeText(); const lines=[`Broken Handoff v0.3.2 AAR`, `Scenario: ${s.title}`, `Domain: ${s.domain}`, `Decisions: ${state.decisions.length}/${s.scenes.length}`, `Reopen used: ${state.reopenUsed?'Yes':'No'}`, `Final strain: ${state.strain}/8`, `Validation outcome: ${outcome}`, `Handoff quality: ${chainStatus()}`, `Doctrine-aligned: ${m.aligned}`, `Recoverable incomplete: ${m.incomplete}`, `Risk transfers: ${m.transfers}`, `Doctrine violations: ${m.violations}`, `Disqualifying choices: ${m.disq}`, `Why this result: ${fairnessNote()}`, `Repair path: ${repairAdvice()}`, `Translation-loss warning: ${s.translationWarning}`, `Decisions:`].concat(state.decisions.map(d=>`Scene ${d.scene} - ${d.label}: ${d.choice} (${categoryLabel(d.category)}${d.disqualifying?', disqualifying':''}) - ${d.explanation}`)); navigator.clipboard?.writeText(lines.join('\n')); showToast('AAR copied.')} 
function updateElapsed(){if(!state.startTime)return; const e=document.getElementById('elapsed'); if(e){const sec=Math.floor((Date.now()-state.startTime)/1000), m=String(Math.floor(sec/60)).padStart(2,'0'), s=String(sec%60).padStart(2,'0'); e.textContent=`${m}:${s}`;} setTimeout(updateElapsed,500)}
render();
</script>
</body>
</html>
